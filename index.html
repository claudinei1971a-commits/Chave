  <style id="financas-pro-mobile-responsive">
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-x: hidden; }
    button, input, select, textarea { touch-action: manipulation; }
    input, select, textarea { max-width: 100%; }
    .overflow-x-auto { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

    @media (max-width: 640px) {
      body { font-size: 14px; }

      /* Cabeçalho e navegação: mantém todas as funções acessíveis no celular */
      header { padding-left: 10px !important; padding-right: 10px !important; padding-top: 8px !important; padding-bottom: 8px !important; }
      header > div { gap: 8px !important; }
      header nav {
        width: 100% !important;
        justify-content: flex-start !important;
        border-radius: 12px !important;
        scroll-snap-type: x proximity;
        padding: 4px !important;
      }
      header nav button { flex: 0 0 auto !important; min-height: 42px; scroll-snap-align: start; }
      header nav + div button { min-height: 44px; }

      /* Áreas principais respiram melhor em telas estreitas */
      main, section { max-width: 100%; }
      .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { width: 100%; }
      .px-6 { padding-left: 12px !important; padding-right: 12px !important; }
      .px-5 { padding-left: 12px !important; padding-right: 12px !important; }
      .p-6 { padding: 14px !important; }
      .p-5 { padding: 12px !important; }
      .gap-6 { gap: 12px !important; }

      /* Formulários passam para uma coluna quando necessário */
      .grid-cols-2, .grid-cols-3, .grid-cols-4, .grid-cols-5, .grid-cols-6 {
        grid-template-columns: minmax(0, 1fr) !important;
      }
      .sm\\:grid-cols-2, .md\\:grid-cols-2, .md\\:grid-cols-3, .lg\\:grid-cols-2,
      .lg\\:grid-cols-3, .lg\\:grid-cols-4, .xl\\:grid-cols-4 {
        grid-template-columns: minmax(0, 1fr) !important;
      }

      /* Evita zoom automático do iPhone em campos */
      input, select, textarea { font-size: 16px !important; min-height: 42px; }
      input[type="checkbox"], input[type="radio"] { min-height: auto; }
      button { min-height: 40px; }

      /* Tabelas continuam completas e ganham rolagem horizontal suave */
      table { white-space: nowrap; }
      th, td { padding-left: 10px !important; padding-right: 10px !important; }
      .overflow-x-auto { position: relative; width: 100%; }
      .overflow-x-auto::after {
        content: "← deslize para ver mais →";
        display: block;
        position: sticky;
        left: 0;
        width: max-content;
        margin: 5px auto 0;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(15, 23, 42, .06);
        color: #64748b;
        font-size: 9px;
        font-weight: 700;
        pointer-events: none;
      }

      /* Modais cabem na altura do celular e respeitam área segura */
      .fixed.inset-0 { padding: 8px !important; align-items: flex-end !important; }
      .fixed.inset-0 > div[class*="bg-white"] {
        width: 100% !important;
        max-width: 100% !important;
        max-height: calc(100dvh - 16px) !important;
        border-radius: 20px !important;
      }

      /* Cartões e textos longos não estouram a tela */
      .rounded-3xl { border-radius: 18px !important; }
      .text-3xl { font-size: 1.5rem !important; line-height: 2rem !important; }
      .text-2xl { font-size: 1.25rem !important; line-height: 1.75rem !important; }
      .whitespace-nowrap { white-space: nowrap; }
    }

    @media (max-width: 390px) {
      header h1 { font-size: 1rem !important; }
      header nav button { padding-left: 9px !important; padding-right: 9px !important; font-size: 10px !important; }
      .px-4 { padding-left: 10px !important; padding-right: 10px !important; }
    }

    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>


  <style id="financas-pro-modern-dashboard">
    /* Dashboard 2026: mesma estrutura e funções, leitura mais clara */
    .modern-dashboard > div:first-child {
      background: linear-gradient(145deg,#f8fafc 0%,#f1f5f9 52%,#eef2ff 100%) !important;
      border: 1px solid rgba(148,163,184,.24) !important;
      box-shadow: 0 18px 50px rgba(15,23,42,.07) !important;
      border-radius: 28px !important;
    }
    .modern-dashboard h2 { letter-spacing: -.035em !important; }
    .modern-dashboard > div:first-child > div:first-child > div:last-child {
      border: 1px solid rgba(148,163,184,.25) !important;
      box-shadow: 0 8px 22px rgba(15,23,42,.06) !important;
      border-radius: 14px !important;
    }
    /* quatro indicadores superiores */
    .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 > div {
      border: 1px solid rgba(148,163,184,.20) !important;
      border-radius: 18px !important;
      box-shadow: 0 8px 24px rgba(15,23,42,.055) !important;
      min-height: 112px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 > div:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15,23,42,.09) !important;
    }
    /* saldo previsto vira o destaque principal */
    .modern-dashboard .bg-\\[\\#2D2A68\\] {
      background: linear-gradient(120deg,#111827 0%,#312e81 55%,#4338ca 100%) !important;
      border: 0 !important;
      box-shadow: 0 14px 34px rgba(49,46,129,.22) !important;
      border-radius: 20px !important;
    }
    /* painéis Faturas e Contas */
    .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div {
      border: 1px solid rgba(148,163,184,.20) !important;
      border-radius: 20px !important;
      box-shadow: 0 10px 28px rgba(15,23,42,.055) !important;
    }
    .modern-dashboard .custom-scrollbar > div {
      border-color: rgba(148,163,184,.14) !important;
    }
    .modern-dashboard .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .modern-dashboard .custom-scrollbar::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
    @media (max-width:640px) {
      .modern-dashboard { gap: 12px !important; }
      .modern-dashboard > div:first-child { padding: 14px !important; border-radius: 20px !important; }
      .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 > div { min-height: 92px; padding: 14px !important; }
      .modern-dashboard .bg-\\[\\#2D2A68\\] { padding: 16px !important; align-items:flex-start !important; }
      .modern-dashboard .bg-\\[\\#2D2A68\\] .text-3xl { font-size:1.55rem !important; }
      .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div { padding: 14px !important; }
    }
  </style>


  <style id="financas-pro-cobrefacil-dashboard">
    /* Visual inspirado no painel de referência: azul corporativo + verde, sem alterar os cálculos */
    .modern-dashboard {
      background: linear-gradient(135deg,#0753bd 0%,#0b4fb3 46%,#0645a2 100%);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 22px 55px rgba(6,69,162,.20);
    }
    .modern-dashboard > .dashboard-cobrefacil {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      padding: 12px !important;
    }
    .dashboard-cobrefacil > div:first-child {
      color: #fff;
      margin-bottom: 18px !important;
    }
    .dashboard-cobrefacil > div:first-child h2 { color:#fff !important; font-size:1.35rem !important; }
    .dashboard-cobrefacil > div:first-child p { color:#dbeafe !important; }
    .dashboard-cobrefacil > div:first-child > div:last-child {

      padding:7px 12px !important;

    .dashboard-kpis { position:relative; gap:18px !important; }
    .dashboard-kpi {
      position:relative;
      min-height:108px !important;
      background:#fff !important;
      border:0 !important;
      border-radius:13px !important;
      box-shadow:0 7px 18px rgba(4,43,101,.22) !important;
      padding:18px 20px !important;
      overflow:visible;
    }
    .dashboard-kpi::before {
      content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
      border-radius:13px 0 0 13px; background:#2b78ff;
    }
    .dashboard-kpi.kpi-receitas::before,.dashboard-kpi.kpi-movimentado::before { background:#1db45a; }

    .dashboard-kpi.kpi-movimentado .text-emerald-700 { color:#16a34a !important; }
    .dashboard-kpi.kpi-despesas .text-rose-500 { color:#135fd6 !important; }
    .dashboard-kpi.kpi-pendente .text-amber-700 { color:#d97706 !important; }
    @media (min-width:1024px) {
      .dashboard-kpi:not(:last-child)::after {
        content:""; position:absolute; right:-18px; top:42%; width:18px; height:16px;
        background:linear-gradient(90deg,#60a5fa,#2563eb);
        clip-path:polygon(0 25%,62% 25%,62% 0,100% 50%,62% 100%,62% 75%,0 75%);
        z-index:4;
      }
    }

    .dashboard-saldo {
      background:linear-gradient(90deg,#16a34a 0%,#1db45a 42%,#0879e9 100%) !important;
      border:0 !important;
      border-radius:13px !important;
      box-shadow:0 8px 20px rgba(4,43,101,.20) !important;
      padding:18px 22px !important;
    }
    .dashboard-saldo p { color:#dcfce7 !important; }

    .dashboard-panel {
      position:relative;
      border:0 !important;
      border-radius:13px !important;
      box-shadow:0 8px 20px rgba(4,43,101,.20) !important;
      padding:54px 18px 18px !important;
      overflow:hidden;
      background:#fff !important;
    }
    .dashboard-panel::before {
      content:""; position:absolute; left:0; top:0; right:0; height:36px; background:#0879e9;
    }
    .dashboard-faturas::before { background:#1db45a; }
    .dashboard-panel > div:first-child { position:absolute; left:15px; right:15px; top:6px; z-index:2; margin:0 !important; min-height:24px; }
    .dashboard-panel > div:first-child h4 { color:#fff !important; }
    .dashboard-panel > div:first-child h4 svg { color:#fff !important; }
    .dashboard-panel > div:first-child button {
      background:rgba(255,255,255,.16) !important; border-color:rgba(255,255,255,.28) !important; color:#fff !important;
    }
    .dashboard-panel > div:first-child > span {
      background:#fff !important; border:0 !important; color:#0b4fb3 !important; border-radius:7px !important;
    }
    .dashboard-panel .custom-scrollbar > div {
      background:#f8fbff !important;
      border:1px solid #e2e8f0 !important;
      border-radius:10px !important;
      box-shadow:none !important;
    }
    .dashboard-panel .custom-scrollbar > div:hover { background:#eff6ff !important; }

    /* Gráficos inferiores do painel passam a parecer módulos do dashboard de referência */
    .modern-dashboard > div:not(.dashboard-cobrefacil) {
      border-radius:13px !important;
    }

    @media (max-width:640px) {
      .modern-dashboard { padding:8px; border-radius:18px; }
      .modern-dashboard > .dashboard-cobrefacil { padding:8px !important; }
      .dashboard-kpis { gap:10px !important; }
      .dashboard-kpi { min-height:88px !important; padding:13px 15px !important; }
      .dashboard-panel { padding:49px 12px 12px !important; }
      .dashboard-panel::before { height:34px; }
      .dashboard-saldo { padding:14px 16px !important; }
    }
  </style>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TrendingUp, TrendingDown, Wallet, Calendar, CreditCard, Sliders, Plus, Trash2, Edit3, 
      Download, Upload, Smartphone, CheckCircle, AlertCircle, PiggyBank, PieChart as PieIcon, 
      Filter, Search, ChevronLeft, ChevronRight, ChevronUp, ChevronDown, X, Printer, User, Database, 
      Copy, ShoppingBag, ShieldCheck, HardDrive, CloudLightning, Clock, Calculator, Layers, FileText, Target, Settings, Landmark, Tag
    } from 'lucide-react';
    import { 
      ResponsiveContainer, AreaChart, Area, BarChart, Bar, XAxis, YAxis, Tooltip, PieChart, Pie, Cell, Legend, CartesianGrid 
    } from 'recharts';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'firebase/auth';
    import { getFirestore, doc, collection, onSnapshot, setDoc, deleteDoc, writeBatch } from 'firebase/firestore';

    // --- NORMALIZAÇÃO DO STATUS DE PAGAMENTO ---
    // Corrige dados antigos/importados onde paid pode ter sido salvo como texto ("true"/"false"), número ou nulo.
    const normalizePaidValue = (value, paymentDate = null) => {
      if (value === true || value === 1 || value === '1') return true;
      if (value === false || value === 0 || value === '0' || value === null || value === undefined || value === '') {
        // Se há uma data de pagamento válida, considera pago para preservar lançamentos antigos confirmados.
        return Boolean(paymentDate);
      }
      if (typeof value === 'string') {
        const v = value.trim().toLowerCase();
        if (['true','sim','pago','confirmado','paid','yes'].includes(v)) return true;
        if (['false','nao','não','pendente','unpaid','no'].includes(v)) return false;
      }
      return Boolean(paymentDate);
    };

    const normalizeTransactionPaid = (t) => ({
      ...t,
      paid: normalizePaidValue(t?.paid, t?.paymentDate)
    });

    const isPaidTransaction = (t) => normalizePaidValue(t?.paid, t?.paymentDate);

    // Data exibida para pagamentos: lançamentos antigos confirmados sem paymentDate
    // usam o vencimento como data de pagamento, conforme regra do usuário.
    const getEffectivePaymentDate = (t) => {
      if (!isPaidTransaction(t)) return '';
      return t?.paymentDate || t?.dueDate || t?.date || t?.data || '';
    };

    // --- FIREBASE INITIALIZATION ---
    let db = null;
    let auth = null;
    let appId = window.__app_id || 'financas-pro';

    try {
      if (typeof window.__firebase_config !== 'undefined' && window.__firebase_config) {
        const firebaseConfig = typeof window.__firebase_config === 'string' ? JSON.parse(window.__firebase_config) : window.__firebase_config;
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
      } else {
        const localConfig = localStorage.getItem('__firebase_config');
        if (localConfig) {
          const app = initializeApp(JSON.parse(localConfig));
          auth = getAuth(app);
          db = getFirestore(app);
        }
      }
      if (typeof window.__app_id !== 'undefined') {
        appId = window.__app_id;
      }
    } catch (e) {
      console.warn("Inicialização do Firebase ignorada ou falhou. Usando modo offline.", e);
    }

    // --- CONSTANTS & INITIAL DATA ---

    // Soma meses mantendo o dia sempre que existir; se não existir, usa o último dia do mês.
    // Ex.: 31/01 + 1 mês = 28/02 (ou 29/02 em ano bissexto), sem pular para março.
    const addMonthsClampedIso = (isoDate, monthsToAdd = 0) => {
      const match = String(isoDate || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return isoDate;
      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      const targetBase = new Date(year, (month - 1) + Number(monthsToAdd || 0), 1);
      const targetYear = targetBase.getFullYear();
      const targetMonth = targetBase.getMonth() + 1;
      const lastDay = new Date(targetYear, targetMonth, 0).getDate();
      const safeDay = Math.min(day, lastDay);
      return `${targetYear}-${String(targetMonth).padStart(2, '0')}-${String(safeDay).padStart(2, '0')}`;
    };

    const calculateFirstPaymentDate = (item, myCards) => {
      if (!item?.data) return '';

      // Despesa: o 1º vencimento informado pelo usuário continua valendo.
      if (item.tipoLancamento === 'prazo') {
        const explicitDue = String(item.vencimento || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (explicitDue) return item.vencimento;
      }

      // Parcelamento: o 1º vencimento é sempre calculado pela
      // Data do Lançamento + fechamento/vencimento do cartão.
      const purchaseMatch = String(item.data || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!purchaseMatch) return '';

      let year = parseInt(purchaseMatch[1], 10);
      let month = parseInt(purchaseMatch[2], 10);
      const purchaseDay = parseInt(purchaseMatch[3], 10);

      const card = myCards.find(
        c => normalizeCardName(c.name) === normalizeCardName(item.pagamento)
      );

      if (!card) {
        const fallbackDay = Math.min(
          Math.max(purchaseDay, 1),
          new Date(year, month, 0).getDate()
        );
        return `${year}-${String(month).padStart(2,'0')}-${String(fallbackDay).padStart(2,'0')}`;
      }

      const closingDay = Math.max(1, Math.min(31, parseInt(card.fechamento, 10) || 1));
      const dueDay = Math.max(1, Math.min(31, parseInt(card.vencimento, 10) || 1));

      // Regra do ciclo já usada pelo sistema:
      // compra no/apos fechamento -> próxima competência;
      // vencimento anterior ao fechamento -> vencimento cai no mês seguinte.
      if (purchaseDay >= closingDay) month++;
      if (dueDay < closingDay) month++;

      while (month > 12) {
        month -= 12;
        year++;
      }

      const safeDueDay = Math.min(dueDay, new Date(year, month, 0).getDate());
      return `${year}-${String(month).padStart(2,'0')}-${String(safeDueDay).padStart(2,'0')}`;
    };

    const getInstallmentInfo = (item, targetYearMonth, myCards) => {
        // Ajustes manuais da análise de cartões pertencem diretamente à fatura indicada.
        if (item.manualInvoiceMonth) {
          if (item.manualInvoiceMonth !== targetYearMonth) return null;
          const manualValue = parseFloat(item.valorParcela ?? item.valorTotal) || 0;
          return { value: manualValue, current: 1, total: 1 };
        }
        if (!item.data) return null;

        const numParc = parseInt(item.parcelas) || 1;
        const valParc = parseFloat(item.valorParcela) || 0;

        const firstDue = calculateFirstPaymentDate(item, myCards);
        const firstDueMatch = String(firstDue || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!firstDueMatch) return null;

        const dueYear = parseInt(firstDueMatch[1], 10);
        const dueMonth = parseInt(firstDueMatch[2], 10);

        const [tYear, tMonth] = targetYearMonth.split('-').map(Number);
        const diff = (tYear - dueYear) * 12 + (tMonth - dueMonth);
        if (diff >= 0 && diff < numParc) {
          return { value: valParc, current: diff + 1, total: numParc };
        }
        return null;
    };

    const calculateLastPaymentDate = (item, myCards) => {
      if (!item.data) return '';
      const totalParc = parseInt(item.parcelas) || 1;

      const firstDue = calculateFirstPaymentDate(item, myCards);
      const match = String(firstDue || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return '';

      const firstDueYear = parseInt(match[1], 10);
      const firstDueMonth = parseInt(match[2], 10);
      const dueDay = parseInt(match[3], 10);

      const lastDate = new Date(firstDueYear, firstDueMonth - 1 + (totalParc - 1), 1);
      const lastYear = lastDate.getFullYear();
      const lastMonth = lastDate.getMonth() + 1;
      const maxDay = new Date(lastYear, lastMonth, 0).getDate();
      const safeDay = Math.min(Math.max(dueDay, 1), maxDay);

      return `${String(safeDay).padStart(2, '0')}/${String(lastMonth).padStart(2, '0')}/${lastYear}`;
    };

      const handleAutoClassify = async () => {
        let updatedCount = 0;
        const batches = [];
        const updatedTransactions = transactions.map(t => {
          if (t.category === 'outros') {
            let newCat = t.category;
            let newRule = t.ruleType;
            const desc = t.description.toLowerCase();

            if (desc.includes('cashback') || desc.includes('resgate do limite')) {
              newCat = 'receita_freelance';
              newRule = 'receita';
            } else if (desc.includes('rendimento') || desc.includes('cdi')) {
              newCat = 'investimentos';
              newRule = 'receita';
            } else if (desc.includes('conta') || desc.includes('fatura') || desc.includes('cartão')) {
              newCat = desc.includes('fatura') ? 'dividas' : 'moradia';
              newRule = 'necessidade';
            } else if (desc.includes('uber') || desc.includes('combustível') || desc.includes('posto') || desc.includes('gasolina')) {
              newCat = 'transporte';
              newRule = 'necessidade';
            } else if (desc.includes('pix')) {
              if (t.type === 'income') {
                newCat = 'receita_freelance';
                newRule = 'receita';
              } else {
                newCat = 'lazer';
                newRule = 'desejo';
              }
            } else if (desc.includes('ifood') || desc.includes('mcdonald') || desc.includes('restaurante')) {
              newCat = 'restaurantes';
              newRule = 'desejo';
            } else if (desc.includes('farmácia') || desc.includes('drogaria') || desc.includes('saúde')) {
              newCat = 'saude';
              newRule = 'necessidade';
            } else if (desc.includes('supermercado') || desc.includes('mercado') || desc.includes('padaria')) {
              newCat = 'alimentacao';
              newRule = 'necessidade';
            }

            if (newCat !== t.category) {
              updatedCount++;
              const updatedTx = { ...t, category: newCat, ruleType: newRule };
              batches.push(updatedTx);
              return updatedTx;
            }
          }
          return t;
        });

        if (updatedCount > 0) {
          setTransactions(updatedTransactions);
          showToast(`${updatedCount} lançamentos reclassificados com sucesso!`);

                const docRef = doc(db, 'artifacts', appId, 'public', 'data', `wallet_${syncKey}_transactions`, b.id);
                batch.set(docRef, b, { merge: true });

      const handleSaveTransaction = async (e, mode = null) => {
        if (e) e.preventDefault();
        
        const dataToSave = mode ? futureEditsModal.pendingFormData : formData;
        if (!dataToSave.description || !dataToSave.amount || parseFloat(dataToSave.amount) <= 0) return;

        if (!mode && dataToSave.type === 'future') {
          await handleSaveFutureFromAccountForm(dataToSave);

        }

        const isEdit = !!editingTransaction;
        
        // INTERCETAR EDIÇÕES COM IMPACTO NO FUTURO
        // Procura parcelas da mesma série, contas fixas e outros lançamentos futuros
        // com o mesmo valor e características principais do lançamento original.
        if (isEdit && !mode) {
            const futureMap = new Map();
            const normalizeDesc = (desc = '') => desc
              .replace(/\s\(\d+\/\d+\)$/, '')
              .trim()
              .toLowerCase();
            const originalAmount = parseFloat(editingTransaction.amount) || 0;
            const baseDesc = normalizeDesc(editingTransaction.description);
            const parentId = editingTransaction.installmentsInfo?.parentId;

            transactions.forEach(t => {
                if (!t || t.id === editingTransaction.id) return;
                if (!t.dueDate || t.dueDate <= editingTransaction.dueDate) return;

                const sameInstallmentGroup = !!(editingTransaction.installmentsInfo && t.installmentsInfo && (
                    (parentId && t.installmentsInfo.parentId === parentId) ||
                    (!parentId &&
                      t.installmentsInfo.total === editingTransaction.installmentsInfo.total &&
                      normalizeDesc(t.description) === baseDesc &&
                      t.installmentsInfo.current > editingTransaction.installmentsInfo.current)
                ));

                const sameFixedSeries = !!(editingTransaction.isFixed && t.isFixed &&
                    normalizeDesc(t.description) === baseDesc);

                const sameCharacteristics =
                    Math.abs((parseFloat(t.amount) || 0) - originalAmount) < 0.005 &&
                    normalizeDesc(t.description) === baseDesc &&
                    t.type === editingTransaction.type &&
                    t.category === editingTransaction.category &&
                    (t.bank || '') === (editingTransaction.bank || '') &&
                    (t.paymentMethod || '') === (editingTransaction.paymentMethod || '');

                if (sameInstallmentGroup || sameFixedSeries || sameCharacteristics) {
                    futureMap.set(t.id, {
                        ...t,
                        matchReason: sameInstallmentGroup ? 'Mesma parcela/série' :
                                     sameFixedSeries ? 'Mesma conta fixa' :
                                     'Mesmo valor e características'
                    });
                }
            });

            const futureTxs = Array.from(futureMap.values())
                .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

            if (futureTxs.length > 0) {
                setFutureEditsModal({
                    isOpen: true,
                    pendingFormData: { ...formData },
                    futureTxs,
                    selectedIds: futureTxs.map(t => t.id)
                });
                return; // Pausa para o usuário escolher quais lançamentos futuros alterar
            }
        }

        const value = parseFloat(dataToSave.amount);
        let updatedTransactions = [...transactions];
        const batches = [];

        if (isEdit) {
            // Atualizar o lançamento atual
            const transactionPayload = {
                ...editingTransaction,
                description: dataToSave.description,
                amount: value,
                type: dataToSave.type,
                category: dataToSave.type === 'transfer' ? 'transferencia' : dataToSave.category,
                bank: dataToSave.bank,
                destinationBank: dataToSave.type === 'transfer' ? dataToSave.destinationBank : null,
                isFixed: dataToSave.isFixed,
                dueDate: dataToSave.dueDate, 
                paid: dataToSave.paid,
                paymentMethod: dataToSave.paymentMethod,
                associatedCard: dataToSave.associatedCard || null,
                budgetStatus: dataToSave.budgetStatus || 'orcado',
                ruleType: dataToSave.type === 'income' ? 'receita' : (dataToSave.type === 'transfer' ? 'neutro' : dataToSave.ruleType)
            };

            const index = updatedTransactions.findIndex(t => t.id === editingTransaction.id);
            if (index > -1) updatedTransactions[index] = transactionPayload;
            if (db && user && syncKey) batches.push({ id: editingTransaction.id, data: transactionPayload });

            // Atualizar somente os lançamentos futuros assinalados pelo usuário

                    }

                    const ftPayload = {
                        ...ft,
                        description: newDesc,
                        amount: value,
                        type: dataToSave.type,
                        category: dataToSave.type === 'transfer' ? 'transferencia' : dataToSave.category,
                        bank: dataToSave.bank,
                        destinationBank: dataToSave.type === 'transfer' ? dataToSave.destinationBank : null,

                        budgetStatus: dataToSave.budgetStatus || 'orcado',
                        ruleType: dataToSave.type === 'income' ? 'receita' : (dataToSave.type === 'transfer' ? 'neutro' : dataToSave.ruleType),
                        isFixed: dataToSave.isFixed
                        // Mantém a Data de Vencimento e estado "Pago" originais de cada mês

                    const fIdx = updatedTransactions.findIndex(t => t.id === ft.id);

            const groupId = 'grp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

            const totalCents = Math.round(value * 100);

            for (let i = 0; i < installmentsCount; i++) {

                // A última parcela absorve os centavos restantes para a soma bater exatamente com o total.
                const parcelCents = isInstallment
                  ? (i === installmentsCount - 1 ? totalCents - (baseParcelCents * (installmentsCount - 1)) : baseParcelCents)
                  : totalCents;
                const parcelAmount = parcelCents / 100;

        if (!isoDate) return '';
        const parts = String(isoDate).split('-');
        if (parts.length !== 3) return '';
        return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0].slice(-2)}`;
      };

      const maskDateShortBR = (value) => {
        const digits = String(value || '').replace(/\D/g, '').slice(0, 6);
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
        return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      };

      const parseDateShortBR = (value) => {
        const m = String(value || '').match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
        if (!m) return '';
        const day = parseInt(m[1], 10);
        const month = parseInt(m[2], 10);
        const year = 2000 + parseInt(m[3], 10);
        const d = new Date(year, month - 1, day);
        if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return '';
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      };

      const formatDateBRFull = (isoDate) => {

        const m = String(isoDate).match(/^(\d{4})-(\d{2})-(\d{2})$/);

        return `${m[3]}/${m[2]}/${m[1]}`;

        return `${digits.slice(0,2)}/${digits.slice(2,4)}/${digits.slice(4)}`;

               while (endM > 12) { endM -= 12; endY++; }
               const endStr = `${endY}-${String(endM).padStart(2, '0')}`;
               if (endStr > maxDate) maxDate = endStr;
            });

            const [minY, minM] = minDate.split('-').map(Number);
            const [maxY, maxM] = maxDate.split('-').map(Number);
            startY = minY;
            startM = minM;
            count = (maxY - minY) * 12 + (maxM - minM) + 1;
            if (count > 120) count = 120; // Limite de segurança de 10 anos
        }

        const list = [];
        list.push({ key: 'all', label: 'Todas as Compras', year: 0, month: 0 });

        for(let i=0; i<count; i++) {
           let y = startY;
           let m = startM + i;
           while(m > 12) { m -= 12; y++; }
           const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
           const label = `${monthNames[m-1]} ${y}`;
           const key = `${y}-${String(m).padStart(2, '0')}`;
           list.push({ key, label, year: y, month: m });
        }
        return list;
      }, [pmPeriodFilter, pmExpenses]);

      // Meses exclusivos da Conferência de Faturas: permite consultar histórico

          const d = new Date(now.getFullYear(), now.getMonth() + offset, 1);
          const y = d.getFullYear();
          const m = d.getMonth() + 1;
          const monthNames = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
          list.push({
            key: `${y}-${String(m).padStart(2, '0')}`,
            label: `${monthNames[m-1]} ${y}`,
            year: y,
            month: m
          });
        }
        return list.reverse();

      const handleSavePmExpense = async (e) => {

        });

      // --- DERIVED DATA ---
      const isTransactionInPeriod = (t) => {
        if (filterMonth === 'all') return true;
        if (filterMonth === 'custom') {
          const txDate = t.dueDate;
          if (customStartDate && txDate < customStartDate) return false;
          if (customEndDate && txDate > customEndDate) return false;
          return true;
        }
        return t.dueDate.startsWith(filterMonth);
      };

      const balances = useMemo(() => {
        const bankBalances = {};
        banks.forEach(b => { bankBalances[b] = 0; });
        let totalAllTimeConfirmedIncome = 0;
        let totalAllTimeConfirmedExpense = 0;

        transactions.forEach(t => {
          if (!isTransactionInPeriod(t)) return;

          const amt = parseFloat(t.amount) || 0;
          if (isPaidTransaction(t)) {
            if (t.type === 'income') {
              totalAllTimeConfirmedIncome += amt;
              bankBalances[t.bank] = (bankBalances[t.bank] || 0) + amt;
            } else if (t.type === 'expense') {
              totalAllTimeConfirmedExpense += amt;
              bankBalances[t.bank] = (bankBalances[t.bank] || 0) - amt;
            } else if (t.type === 'transfer') {
              bankBalances[t.bank] = (bankBalances[t.bank] || 0) - amt;
              if (t.destinationBank) {
                bankBalances[t.destinationBank] = (bankBalances[t.destinationBank] || 0) + amt;
              }
            }
          }
        });

        return { bankBalances, currentRealBalance: totalAllTimeConfirmedIncome - totalAllTimeConfirmedExpense };
      }, [transactions, banks, filterMonth, customStartDate, customEndDate]);

      const projectedBalances = useMemo(() => {
        const bankBalances = {};
        banks.forEach(b => { bankBalances[b] = 0; });

        transactions.forEach(t => {
          if (!isTransactionInPeriod(t)) return;

          const amt = parseFloat(t.amount) || 0;

          if (t.type === 'income') {
            bankBalances[t.bank] = (bankBalances[t.bank] || 0) + amt;
          } else if (t.type === 'expense') {
            bankBalances[t.bank] = (bankBalances[t.bank] || 0) - amt;
          } else if (t.type === 'transfer') {
            bankBalances[t.bank] = (bankBalances[t.bank] || 0) - amt;
            if (t.destinationBank) {
              bankBalances[t.destinationBank] = (bankBalances[t.destinationBank] || 0) + amt;
            }
          }
        });

        return { bankBalances };
      }, [transactions, banks, filterMonth, customStartDate, customEndDate]);

      const projectedBalanceLabel = (filterMonth === 'all' || filterMonth === 'custom')
        ? 'Previsto no período'
        : 'Previsto para o mês';

      const bancosSaldos = useMemo(() => {

        // Filtra para mostrar APENAS os bancos com saldo real diferente de zero (positivo ou negativo)
        return banks.filter(b => {

          return Math.abs(val) >= 0.01; // Remove os que têm R$ 0,00
        });
      }, [banks, balances, showAllBanks]);

      // --- LÓGICA EXTRATO (Agora obedece ao filtro de Período) ---
      const extratoTransactions = useMemo(() => {
        if (!extratoModal.bankName) return [];
        const b = extratoModal.bankName;
        const filtered = transactions.filter(t => {
          const matchBank = t.bank === b || (t.type === 'transfer' && t.destinationBank === b);
          const matchPeriod = isTransactionInPeriod(t);
          return matchBank && matchPeriod;
        });
        return filtered.sort((a, b) => b.dueDate.localeCompare(a.dueDate));
      }, [transactions, extratoModal.bankName, filterMonth, customStartDate, customEndDate]);

      const extratoTotals = useMemo(() => {
        let inTotal = 0;
        let outTotal = 0;
        extratoTransactions.forEach(t => {
          if (t.type === 'income') inTotal += parseFloat(t.amount);
          else if (t.type === 'expense') outTotal += parseFloat(t.amount);
          else if (t.type === 'transfer') {
            if (t.bank === extratoModal.bankName) outTotal += parseFloat(t.amount); // Saiu deste banco
            if (t.destinationBank === extratoModal.bankName) inTotal += parseFloat(t.amount); // Entrou neste banco
          }
        });
        return { inTotal, outTotal };
      }, [extratoTransactions, extratoModal.bankName]);

      const resumoData = useMemo(() => {
        let pmTotal = 0;
        const pmGrouped = {};

        let filterYear = null;
        let filterMonthNum = null;

        if (filterMonth !== 'all' && filterMonth !== 'custom') {
          const parts = filterMonth.split('-');
          filterYear = parseInt(parts[0]);
          filterMonthNum = parseInt(parts[1]);
        } else {
            const d = new Date();
            filterYear = d.getFullYear();
            filterMonthNum = d.getMonth() + 1;
        }

        const targetMonthKey = `${filterYear}-${String(filterMonthNum).padStart(2, '0')}`;

        pmExpenses.forEach(item => {
            const info = getInstallmentInfo(item, targetMonthKey, myCards);
            if (info) {
              pmTotal += info.value;
              if (!pmGrouped[item.pagamento]) {
                pmGrouped[item.pagamento] = 0;
              }
              pmGrouped[item.pagamento] += info.value;
            }
        });

        const normalizeCardText = (value) => String(value || '')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().trim();

        // Monta a lista de faturas a partir de TODOS os cartões cadastrados + cartões com compras.
        // Assim, valores salvos da fatura não somem do Painel mesmo quando não há compra PayManager no mês.
        const invoiceCardNames = Array.from(new Set([
          ...myCards.map(c => c.name).filter(Boolean),
          ...Object.keys(pmGrouped)
        ]));

        const pmList = invoiceCardNames.map(cardName => {
          const cardDef = myCards.find(c => normalizeCardText(c.name) === normalizeCardText(cardName));
          const cardNorm = normalizeCardText(cardName);
          const registeredTotal = parseFloat(pmGrouped[cardName]) || 0;

          // Pagamento da fatura: SOMENTE lançamentos confirmados na categoria
          // "Cartão de Crédito" e com o campo "Cartão associado" igual a este cartão.
          // Banco pagador e descrição nunca identificam a fatura.
          const paymentTransactions = transactions.filter(t => {
            if (t.type !== 'expense' || !isPaidTransaction(t)) return false;
            const referenceDate = t.dueDate || t.paymentDate || t.date || t.data || '';
            if (String(referenceDate).slice(0, 7) !== targetMonthKey) return false;

            const categoryObj = categories.find(c => c.id === t.category);
            const categoryText = normalizeCardText(categoryObj?.name || t.category || t.categoryName);
            const isCreditCardPayment =
              categoryText.includes('cartao de credito') ||
              categoryText.includes('cartao credito') ||
              (categoryText.includes('cartao') && categoryText.includes('credito'));
            if (!isCreditCardPayment) return false;

            const explicitCard = normalizeCardText(t.associatedCard || '');
            return Boolean(explicitCard) && explicitCard === cardNorm;
          });

          const paidAmount = paymentTransactions.reduce((acc, t) => acc + (parseFloat(t.amount) || 0), 0);
          const paymentDate = paymentTransactions
            .map(t => t.paymentDate || t.dueDate || '')
            .filter(Boolean).sort().slice(-1)[0]
            || (cardDef && cardDef.faturasPagasDatas && cardDef.faturasPagasDatas[targetMonthKey])
            || '';
          const payerBanks = Array.from(new Set(paymentTransactions.map(t => t.payerBank || '').filter(Boolean)));
          const manualPaid = !!(cardDef && cardDef.faturasPagas && cardDef.faturasPagas[targetMonthKey] === true);
          const storedInvoice = cardDef?.faturasValoresInformados?.[targetMonthKey];
          const storedPaidValue = cardDef?.faturasPagasValores?.[targetMonthKey];
          const invoiceTarget = storedInvoice !== undefined && storedInvoice !== null && storedInvoice !== ''
            ? (parseFloat(storedInvoice) || 0)
            : registeredTotal;
          // Compatibilidade com faturas antigas marcadas como pagas manualmente.
          const effectivePaidAmount = paidAmount > 0
            ? paidAmount
            : (manualPaid ? (parseFloat(storedPaidValue) || invoiceTarget || 0) : 0);
          // No Painel, se existe pagamento confirmado da fatura, ela deve aparecer como PAGA.
          // Eventuais diferenças entre valor registrado e valor pago ficam para a Conferência de Faturas,
          // evitando mostrar "Parcial" ou "Vencido" no resumo quando a fatura já foi efetivamente paga.
          const hasConfirmedPayment = paymentTransactions.length > 0 || effectivePaidAmount > 0;
          const isPaid = manualPaid || hasConfirmedPayment;
          const isPartial = false;

          return {
            cardName,
            totalValue: registeredTotal,
            invoiceTarget,
            vencimentoDia: cardDef ? cardDef.vencimento : null,
            isPaid,
            isPartial,
            paidAmount: effectivePaidAmount,
            paymentDate,
            payerBanks,
            paymentTransactions,
            monthKey: targetMonthKey
          };
        });

        const pmTotalPendente = pmList
          .filter(f => !f.isPaid)
          .reduce((acc, f) => acc + (parseFloat(f.invoiceTarget || f.totalValue || 0) || 0), 0);

        // Pagamento de fatura de cartão não é uma nova conta: ele liquida uma fatura já mostrada
        // no painel de Faturas. Por isso, no Dashboard, escondemos esses lançamentos da lista "Contas"
        // e dos totais de despesas para evitar duplicidade visual e financeira. Eles continuam normalmente
        // em Lançamentos e na conferência de faturas.
        const isCreditCardPaymentTransaction = (t) => {
          if (!t || t.type !== 'expense') return false;
          const categoryObj = categories.find(c => c.id === t.category);
          const categoryText = normalizeCardText(categoryObj?.name || t.category || t.categoryName);
          const descriptionText = normalizeCardText(t.description || '');
          const explicitCard = normalizeCardText(t.associatedCard || t.cardName || t.cartao);
          return Boolean(explicitCard) ||
            categoryText.includes('cartao de credito') ||
            categoryText.includes('cartao credito') ||
            (categoryText.includes('cartao') && categoryText.includes('credito')) ||
            descriptionText.includes('cartao de credito') ||

        const dashPaidIn = dashMonthIncomes.filter(t => isPaidTransaction(t)).reduce((acc, t) => acc + parseFloat(t.amount), 0);
        const dashPaidExp = dashMonthExpenses.filter(t => isPaidTransaction(t)).reduce((acc, t) => acc + parseFloat(t.amount), 0);
        const dashPendingExp = dashMonthExpenses.filter(t => !isPaidTransaction(t)).reduce((acc, t) => acc + parseFloat(t.amount), 0);

        const totalContasFaturas = dashTotalExp + pmTotal;
        const saldoEstimado = dashTotalIn - totalContasFaturas;
        const totalPagoRecebido = dashPaidIn - dashPaidExp; 
        const restantePendente = dashPendingExp + pmTotalPendente;

        return {

      const getDueStatus = (dateStr, isPaid = false) => {
        if (!dateStr) return null;
        if (isPaid) return { text: 'Pago', className: 'text-emerald-700 bg-emerald-50 border-emerald-100' };

        const parts = String(dateStr).split('-').map(Number);
        if (parts.length !== 3 || parts.some(Number.isNaN)) return null;

        const due = new Date(parts[0], parts[1] - 1, parts[2]);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffDays = Math.round((due - today) / 86400000);

        if (diffDays < 0) {
          const days = Math.abs(diffDays);
          return {
            text: `Vencido há ${days} ${days === 1 ? 'dia' : 'dias'}`,
            className: 'text-rose-700 bg-rose-50 border-rose-200'
          };
        }
        if (diffDays === 0) {
          return { text: 'Vence hoje', className: 'text-amber-700 bg-amber-50 border-amber-200' };
        }
        if (diffDays === 1) {
          return { text: 'Vence amanhã', className: 'text-amber-700 bg-amber-50 border-amber-200' };
        }
        return {
          text: `Faltam ${diffDays} dias para vencer`,
          className: diffDays <= 5

      const monthlyTrendData = useMemo(() => {
        const trend = {};
        
        const d = new Date();
        const currY = d.getFullYear();
        const currM = d.getMonth() + 1;
        const currentMonthStr = `${currY}-${String(currM).padStart(2, '0')}`;

        // Assegura que os meses do período escolhido aparecem no gráfico, mesmo vazios
        const ensureMonthExists = (y, m) => {
          const mStr = `${y}-${String(m).padStart(2, '0')}`;
          if (!trend[mStr]) {
            trend[mStr] = { month: mStr, displayMonth: `${String(m).padStart(2, '0')}/${y}`, Receitas: 0, Despesas: 0 };
          }
        };

        if (trendFilter === 'next6months' || trendFilter === 'next12months') {
           let limit = trendFilter === 'next6months' ? 6 : 12;
           for (let i = 0; i < limit; i++) {
              let m = currM + i;
              let y = currY;
              while (m > 12) { m -= 12; y++; }
              ensureMonthExists(y, m);
           }
        } else if (trendFilter === 'past6months') {
           for (let i = 5; i >= 0; i--) {
              let m = currM - i;
              let y = currY;
              while (m < 1) { m += 12; y--; }
              ensureMonthExists(y, m);
           }
        }

        transactions.forEach(t => {
          const m = t.dueDate.substring(0, 7);
          if (!trend[m]) {
            const [year, month] = m.split('-');
            trend[m] = { month: m, displayMonth: `${month}/${year}`, Receitas: 0, Despesas: 0 };
          }
          if (t.type === 'income') trend[m].Receitas += parseFloat(t.amount);
          else if (t.type === 'expense') trend[m].Despesas += parseFloat(t.amount);
        });

        let sorted = Object.values(trend).sort((a, b) => a.month.localeCompare(b.month));

        if (trendFilter === 'next6months') {
          sorted = sorted.filter(item => item.month >= currentMonthStr).slice(0, 6);
        } else if (trendFilter === 'next12months') {
          sorted = sorted.filter(item => item.month >= currentMonthStr).slice(0, 12);
        } else if (trendFilter === 'past6months') {
          sorted = sorted.filter(item => item.month <= currentMonthStr).slice(-6);
        } else if (trendFilter !== 'all') {
          sorted = sorted.filter(item => item.month.startsWith(trendFilter));
        }

        return sorted.map(item => ({
          ...item,
          Receitas: parseFloat(item.Receitas.toFixed(2)),
          Despesas: parseFloat(item.Despesas.toFixed(2))
        }));
