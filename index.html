  <style id="financas-pro-mobile-responsive">
    html { -webkit-text-size-adjust: 100%; }
    body { overflow-x: hidden; }
    button, input, select, textarea { touch-action: manipulation; }
    input, select, textarea { max-width: 100%; }
    .overflow-x-auto { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

    @media (max-width: 640px) {
      body { font-size: 14px; }

      /* Cabeçalho e navegação: mantém todas as funções acessíveis no celular */
      header { padding-left: 10px !important; padding-right: 10px !important; padding-top: 8px !important; padding-bottom: 8px !important; }
      header > div { gap: 8px !important; }
      header nav {
        width: 100% !important;
        justify-content: flex-start !important;
        border-radius: 12px !important;
        scroll-snap-type: x proximity;
        padding: 4px !important;
      }
      header nav button { flex: 0 0 auto !important; min-height: 42px; scroll-snap-align: start; }
      header nav + div button { min-height: 44px; }

      /* Áreas principais respiram melhor em telas estreitas */
      main, section { max-width: 100%; }
      .max-w-7xl, .max-w-6xl, .max-w-5xl, .max-w-4xl { width: 100%; }
      .px-6 { padding-left: 12px !important; padding-right: 12px !important; }
      .px-5 { padding-left: 12px !important; padding-right: 12px !important; }
      .p-6 { padding: 14px !important; }
      .p-5 { padding: 12px !important; }
      .gap-6 { gap: 12px !important; }

      /* Formulários passam para uma coluna quando necessário */
      .grid-cols-2, .grid-cols-3, .grid-cols-4, .grid-cols-5, .grid-cols-6 {
        grid-template-columns: minmax(0, 1fr) !important;
      }
      .sm\\:grid-cols-2, .md\\:grid-cols-2, .md\\:grid-cols-3, .lg\\:grid-cols-2,
      .lg\\:grid-cols-3, .lg\\:grid-cols-4, .xl\\:grid-cols-4 {
        grid-template-columns: minmax(0, 1fr) !important;
      }

      /* Evita zoom automático do iPhone em campos */
      input, select, textarea { font-size: 16px !important; min-height: 42px; }
      input[type="checkbox"], input[type="radio"] { min-height: auto; }
      button { min-height: 40px; }

      /* Tabelas continuam completas e ganham rolagem horizontal suave */
      table { white-space: nowrap; }
      th, td { padding-left: 10px !important; padding-right: 10px !important; }
      .overflow-x-auto { position: relative; width: 100%; }
      .overflow-x-auto::after {
        content: "← deslize para ver mais →";
        display: block;
        position: sticky;
        left: 0;
        width: max-content;
        margin: 5px auto 0;
        padding: 3px 8px;
        border-radius: 999px;
        background: rgba(15, 23, 42, .06);
        color: #64748b;
        font-size: 9px;
        font-weight: 700;
        pointer-events: none;
      }

      /* Modais cabem na altura do celular e respeitam área segura */
      .fixed.inset-0 { padding: 8px !important; align-items: flex-end !important; }
      .fixed.inset-0 > div[class*="bg-white"] {
        width: 100% !important;
        max-width: 100% !important;
        max-height: calc(100dvh - 16px) !important;
        border-radius: 20px !important;
      }

      /* Cartões e textos longos não estouram a tela */
      .rounded-3xl { border-radius: 18px !important; }
      .text-3xl { font-size: 1.5rem !important; line-height: 2rem !important; }
      .text-2xl { font-size: 1.25rem !important; line-height: 1.75rem !important; }
      .whitespace-nowrap { white-space: nowrap; }
    }

    @media (max-width: 390px) {
      header h1 { font-size: 1rem !important; }
      header nav button { padding-left: 9px !important; padding-right: 9px !important; font-size: 10px !important; }
      .px-4 { padding-left: 10px !important; padding-right: 10px !important; }
    }

    @media (display-mode: standalone) {
      body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>


  <style id="financas-pro-modern-dashboard">
    /* Dashboard 2026: mesma estrutura e funções, leitura mais clara */
    .modern-dashboard > div:first-child {
      background: linear-gradient(145deg,#f8fafc 0%,#f1f5f9 52%,#eef2ff 100%) !important;
      border: 1px solid rgba(148,163,184,.24) !important;
      box-shadow: 0 18px 50px rgba(15,23,42,.07) !important;
      border-radius: 28px !important;
    }
    .modern-dashboard h2 { letter-spacing: -.035em !important; }
    .modern-dashboard > div:first-child > div:first-child > div:last-child {
      border: 1px solid rgba(148,163,184,.25) !important;
      box-shadow: 0 8px 22px rgba(15,23,42,.06) !important;
      border-radius: 14px !important;
    }
    /* quatro indicadores superiores */
    .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 > div {
      border: 1px solid rgba(148,163,184,.20) !important;
      border-radius: 18px !important;
      box-shadow: 0 8px 24px rgba(15,23,42,.055) !important;
      min-height: 112px;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 > div:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(15,23,42,.09) !important;
    }
    /* saldo previsto vira o destaque principal */
    .modern-dashboard .bg-\\[\\#2D2A68\\] {
      background: linear-gradient(120deg,#111827 0%,#312e81 55%,#4338ca 100%) !important;
      border: 0 !important;
      box-shadow: 0 14px 34px rgba(49,46,129,.22) !important;
      border-radius: 20px !important;
    }
    /* painéis Faturas e Contas */
    .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div {
      border: 1px solid rgba(148,163,184,.20) !important;
      border-radius: 20px !important;
      box-shadow: 0 10px 28px rgba(15,23,42,.055) !important;
    }
    .modern-dashboard .custom-scrollbar > div {
      border-color: rgba(148,163,184,.14) !important;
    }
    .modern-dashboard .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .modern-dashboard .custom-scrollbar::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:999px; }
    @media (max-width:640px) {
      .modern-dashboard { gap: 12px !important; }
      .modern-dashboard > div:first-child { padding: 14px !important; border-radius: 20px !important; }
      .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.lg\\:grid-cols-4 > div { min-height: 92px; padding: 14px !important; }
      .modern-dashboard .bg-\\[\\#2D2A68\\] { padding: 16px !important; align-items:flex-start !important; }
      .modern-dashboard .bg-\\[\\#2D2A68\\] .text-3xl { font-size:1.55rem !important; }
      .modern-dashboard > div:first-child > .grid.grid-cols-1.md\\:grid-cols-2.gap-6 > div { padding: 14px !important; }
    }
  </style>


  <style id="financas-pro-cobrefacil-dashboard">
    /* Visual inspirado no painel de referência: azul corporativo + verde, sem alterar os cálculos */
    .modern-dashboard {
      background: linear-gradient(135deg,#0753bd 0%,#0b4fb3 46%,#0645a2 100%);
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 22px 55px rgba(6,69,162,.20);
    }
    .modern-dashboard > .dashboard-cobrefacil {
      background: transparent !important;
      border: 0 !important;
      box-shadow: none !important;
      padding: 12px !important;
    }
    .dashboard-cobrefacil > div:first-child {
      color: #fff;
      margin-bottom: 18px !important;
    }
    .dashboard-cobrefacil > div:first-child h2 { color:#fff !important; font-size:1.35rem !important; }
    .dashboard-cobrefacil > div:first-child p { color:#dbeafe !important; }
    .dashboard-cobrefacil > div:first-child > div:last-child {

      padding:7px 12px !important;

    .dashboard-kpis { position:relative; gap:18px !important; }
    .dashboard-kpi {
      position:relative;
      min-height:108px !important;
      background:#fff !important;
      border:0 !important;
      border-radius:13px !important;
      box-shadow:0 7px 18px rgba(4,43,101,.22) !important;
      padding:18px 20px !important;
      overflow:visible;
    }
    .dashboard-kpi::before {
      content:""; position:absolute; left:0; top:0; bottom:0; width:6px;
      border-radius:13px 0 0 13px; background:#2b78ff;
    }
    .dashboard-kpi.kpi-receitas::before,.dashboard-kpi.kpi-movimentado::before { background:#1db45a; }

    .dashboard-kpi.kpi-movimentado .text-emerald-700 { color:#16a34a !important; }
    .dashboard-kpi.kpi-despesas .text-rose-500 { color:#135fd6 !important; }
    .dashboard-kpi.kpi-pendente .text-amber-700 { color:#d97706 !important; }
    @media (min-width:1024px) {
      .dashboard-kpi:not(:last-child)::after {
        content:""; position:absolute; right:-18px; top:42%; width:18px; height:16px;
        background:linear-gradient(90deg,#60a5fa,#2563eb);
        clip-path:polygon(0 25%,62% 25%,62% 0,100% 50%,62% 100%,62% 75%,0 75%);
        z-index:4;
      }
    }

    .dashboard-saldo {
      background:linear-gradient(90deg,#16a34a 0%,#1db45a 42%,#0879e9 100%) !important;
      border:0 !important;
      border-radius:13px !important;
      box-shadow:0 8px 20px rgba(4,43,101,.20) !important;
      padding:18px 22px !important;
    }
    .dashboard-saldo p { color:#dcfce7 !important; }

    .dashboard-panel {
      position:relative;
      border:0 !important;
      border-radius:13px !important;
      box-shadow:0 8px 20px rgba(4,43,101,.20) !important;
      padding:54px 18px 18px !important;
      overflow:hidden;
      background:#fff !important;
    }
    .dashboard-panel::before {
      content:""; position:absolute; left:0; top:0; right:0; height:36px; background:#0879e9;
    }
    .dashboard-faturas::before { background:#1db45a; }
    .dashboard-panel > div:first-child { position:absolute; left:15px; right:15px; top:6px; z-index:2; margin:0 !important; min-height:24px; }
    .dashboard-panel > div:first-child h4 { color:#fff !important; }
    .dashboard-panel > div:first-child h4 svg { color:#fff !important; }
    .dashboard-panel > div:first-child button {
      background:rgba(255,255,255,.16) !important; border-color:rgba(255,255,255,.28) !important; color:#fff !important;
    }
    .dashboard-panel > div:first-child > span {
      background:#fff !important; border:0 !important; color:#0b4fb3 !important; border-radius:7px !important;
    }
    .dashboard-panel .custom-scrollbar > div {
      background:#f8fbff !important;
      border:1px solid #e2e8f0 !important;
      border-radius:10px !important;
      box-shadow:none !important;
    }
    .dashboard-panel .custom-scrollbar > div:hover { background:#eff6ff !important; }

    /* Gráficos inferiores do painel passam a parecer módulos do dashboard de referência */
    .modern-dashboard > div:not(.dashboard-cobrefacil) {
      border-radius:13px !important;
    }

    @media (max-width:640px) {
      .modern-dashboard { padding:8px; border-radius:18px; }
      .modern-dashboard > .dashboard-cobrefacil { padding:8px !important; }
      .dashboard-kpis { gap:10px !important; }
      .dashboard-kpi { min-height:88px !important; padding:13px 15px !important; }
      .dashboard-panel { padding:49px 12px 12px !important; }
      .dashboard-panel::before { height:34px; }
      .dashboard-saldo { padding:14px 16px !important; }
    }
  </style>

    // --- NORMALIZAÇÃO DO STATUS DE PAGAMENTO ---
    // Corrige dados antigos/importados onde paid pode ter sido salvo como texto ("true"/"false"), número ou nulo.
    const normalizePaidValue = (value, paymentDate = null) => {
      if (value === true || value === 1 || value === '1') return true;
      if (value === false || value === 0 || value === '0' || value === null || value === undefined || value === '') {
        // Se há uma data de pagamento válida, considera pago para preservar lançamentos antigos confirmados.
        return Boolean(paymentDate);
      }
      if (typeof value === 'string') {
        const v = value.trim().toLowerCase();
        if (['true','sim','pago','confirmado','paid','yes'].includes(v)) return true;
        if (['false','nao','não','pendente','unpaid','no'].includes(v)) return false;
      }
      return Boolean(paymentDate);
    };

    const addMonthsClampedIso = (isoDate, monthsToAdd = 0) => {
      const match = String(isoDate || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!match) return isoDate;
      const year = Number(match[1]);
      const month = Number(match[2]);
      const day = Number(match[3]);
      const targetBase = new Date(year, (month - 1) + Number(monthsToAdd || 0), 1);
      const targetYear = targetBase.getFullYear();
      const targetMonth = targetBase.getMonth() + 1;
      const lastDay = new Date(targetYear, targetMonth, 0).getDate();
      const safeDay = Math.min(day, lastDay);
      return `${targetYear}-${String(targetMonth).padStart(2, '0')}-${String(safeDay).padStart(2, '0')}`;
    };

    const getInstallmentInfo = (item, targetYearMonth, myCards) => {
        // Ajustes manuais da análise de cartões pertencem diretamente à fatura indicada.
        if (item.manualInvoiceMonth) {
          if (item.manualInvoiceMonth !== targetYearMonth) return null;
          const manualValue = parseFloat(item.valorParcela ?? item.valorTotal) || 0;
          return { value: manualValue, current: 1, total: 1 };
        }
        if (!item.data) return null;

        const numParc = parseInt(item.parcelas) || 1;
        const valParc = parseFloat(item.valorParcela) || 0;
        let dueYear, dueMonth;

        // Se a compra possui Data de Vencimento informada, ela é a referência principal.
        // Ex.: compra 07/09/2026 com vencimento 10/10/2026 pertence à fatura de outubro.
        const explicitDue = String(item.vencimento || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (explicitDue) {
          dueYear = parseInt(explicitDue[1], 10);
          dueMonth = parseInt(explicitDue[2], 10);
        } else {
          const [dYear, dMonth, dDay] = String(item.data).split('-').map(Number);
          dueYear = dYear;
          dueMonth = dMonth;
          const card = myCards.find(c => normalizeCardName(c.name) === normalizeCardName(item.pagamento));
          if (card) {
            const f = parseInt(card.fechamento, 10);
            const v = parseInt(card.vencimento, 10);
            if (dDay >= f) dueMonth++;
            if (v < f) dueMonth++;
          }
          while (dueMonth > 12) { dueMonth -= 12; dueYear++; }
        }

        const [tYear, tMonth] = targetYearMonth.split('-').map(Number);
        const diff = (tYear - dueYear) * 12 + (tMonth - dueMonth);
        if (diff >= 0 && diff < numParc) {
          return { value: valParc, current: diff + 1, total: numParc };
        }
        return null;
    };

    const calculateLastPaymentDate = (item, myCards) => {
      if (!item.data) return '';
      const totalParc = parseInt(item.parcelas) || 1;

      // A Data de Vencimento digitada no cadastro tem prioridade.
      const explicitDue = String(item.vencimento || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
      let firstDueYear, firstDueMonth, dueDay;

      if (explicitDue) {
        firstDueYear = parseInt(explicitDue[1], 10);
        firstDueMonth = parseInt(explicitDue[2], 10);
        dueDay = parseInt(explicitDue[3], 10);
      } else {
        const parts = String(item.data).split('-');
        if (parts.length < 3) return '';
        firstDueYear = parseInt(parts[0], 10);
        firstDueMonth = parseInt(parts[1], 10);
        const dDay = parseInt(parts[2], 10);
        dueDay = dDay;

        const card = myCards.find(c => normalizeCardName(c.name) === normalizeCardName(item.pagamento));
        if (card && card.vencimento && card.fechamento) {
          const f = parseInt(card.fechamento, 10);
          const v = parseInt(card.vencimento, 10);
          dueDay = v;
          if (dDay >= f) firstDueMonth++;
          if (v < f) firstDueMonth++;
          while (firstDueMonth > 12) { firstDueMonth -= 12; firstDueYear++; }
        }
      }

      const lastDate = new Date(firstDueYear, firstDueMonth - 1 + (totalParc - 1), 1);
      const lastYear = lastDate.getFullYear();
      const lastMonth = lastDate.getMonth() + 1;
      const maxDay = new Date(lastYear, lastMonth, 0).getDate();
      const safeDay = Math.min(Math.max(dueDay, 1), maxDay);

      return `${String(safeDay).padStart(2, '0')}/${String(lastMonth).padStart(2, '0')}/${lastYear}`;

      const handleAutoClassify = async () => {
        let updatedCount = 0;

            let newCat = t.category;
            let newRule = t.ruleType;
            const desc = t.description.toLowerCase();

            if (desc.includes('cashback') || desc.includes('resgate do limite')) {
              newCat = 'receita_freelance';
              newRule = 'receita';
            } else if (desc.includes('rendimento') || desc.includes('cdi')) {
              newCat = 'investimentos';
              newRule = 'receita';
            } else if (desc.includes('conta') || desc.includes('fatura') || desc.includes('cartão')) {
              newCat = desc.includes('fatura') ? 'dividas' : 'moradia';
              newRule = 'necessidade';
            } else if (desc.includes('uber') || desc.includes('combustível') || desc.includes('posto') || desc.includes('gasolina')) {
              newCat = 'transporte';
              newRule = 'necessidade';
            } else if (desc.includes('pix')) {
              if (t.type === 'income') {
                newCat = 'receita_freelance';
                newRule = 'receita';
              } else {
                newCat = 'lazer';
                newRule = 'desejo';
              }
            } else if (desc.includes('ifood') || desc.includes('mcdonald') || desc.includes('restaurante')) {
              newCat = 'restaurantes';
              newRule = 'desejo';
            } else if (desc.includes('farmácia') || desc.includes('drogaria') || desc.includes('saúde')) {
              newCat = 'saude';
              newRule = 'necessidade';
            } else if (desc.includes('supermercado') || desc.includes('mercado') || desc.includes('padaria')) {
              newCat = 'alimentacao';
              newRule = 'necessidade';
            }

            if (newCat !== t.category) {
              updatedCount++;
              const updatedTx = { ...t, category: newCat, ruleType: newRule };
              batches.push(updatedTx);
              return updatedTx;
            }
          }
          return t;
        });

      const handleSaveTransaction = async (e, mode = null) => {
        if (e) e.preventDefault();
        
        const dataToSave = mode ? futureEditsModal.pendingFormData : formData;
        if (!dataToSave.description || !dataToSave.amount || parseFloat(dataToSave.amount) <= 0) return;

        const isEdit = !!editingTransaction;
        
        // INTERCETAR EDIÇÕES COM IMPACTO NO FUTURO
        // Procura parcelas da mesma série, contas fixas e outros lançamentos futuros
        // com o mesmo valor e características principais do lançamento original.
        if (isEdit && !mode) {
            const futureMap = new Map();
            const normalizeDesc = (desc = '') => desc
              .replace(/\s\(\d+\/\d+\)$/, '')
              .trim()
              .toLowerCase();
            const originalAmount = parseFloat(editingTransaction.amount) || 0;
            const baseDesc = normalizeDesc(editingTransaction.description);
            const parentId = editingTransaction.installmentsInfo?.parentId;

            transactions.forEach(t => {
                if (!t || t.id === editingTransaction.id) return;
                if (!t.dueDate || t.dueDate <= editingTransaction.dueDate) return;

                const sameInstallmentGroup = !!(editingTransaction.installmentsInfo && t.installmentsInfo && (
                    (parentId && t.installmentsInfo.parentId === parentId) ||
                    (!parentId &&
                      t.installmentsInfo.total === editingTransaction.installmentsInfo.total &&
                      normalizeDesc(t.description) === baseDesc &&
                      t.installmentsInfo.current > editingTransaction.installmentsInfo.current)
                ));

                const sameFixedSeries = !!(editingTransaction.isFixed && t.isFixed &&
                    normalizeDesc(t.description) === baseDesc);

                const sameCharacteristics =
                    Math.abs((parseFloat(t.amount) || 0) - originalAmount) < 0.005 &&
                    normalizeDesc(t.description) === baseDesc &&
                    t.type === editingTransaction.type &&
                    t.category === editingTransaction.category &&
                    (t.bank || '') === (editingTransaction.bank || '') &&
                    (t.paymentMethod || '') === (editingTransaction.paymentMethod || '');

                if (sameInstallmentGroup || sameFixedSeries || sameCharacteristics) {
                    futureMap.set(t.id, {
                        ...t,
                        matchReason: sameInstallmentGroup ? 'Mesma parcela/série' :
                                     sameFixedSeries ? 'Mesma conta fixa' :
                                     'Mesmo valor e características'
                    });
                }
            });

            const futureTxs = Array.from(futureMap.values())
                .sort((a, b) => a.dueDate.localeCompare(b.dueDate));

            if (futureTxs.length > 0) {
                setFutureEditsModal({
                    isOpen: true,
                    pendingFormData: { ...formData },
                    futureTxs,
                    selectedIds: futureTxs.map(t => t.id)
                });
                return; // Pausa para o usuário escolher quais lançamentos futuros alterar
            }
        }

        const value = parseFloat(dataToSave.amount);
        let updatedTransactions = [...transactions];
        const batches = [];

        if (isEdit) {
            // Atualizar o lançamento atual
            const transactionPayload = {
                ...editingTransaction,
                description: dataToSave.description,
                amount: value,
                type: dataToSave.type,
                category: dataToSave.type === 'transfer' ? 'transferencia' : dataToSave.category,
                bank: dataToSave.bank,
                destinationBank: dataToSave.type === 'transfer' ? dataToSave.destinationBank : null,
                isFixed: dataToSave.isFixed,
                dueDate: dataToSave.dueDate, 
                paid: dataToSave.paid,
                paymentMethod: dataToSave.paymentMethod,
                associatedCard: dataToSave.associatedCard || null,
                budgetStatus: dataToSave.budgetStatus || 'orcado',
                ruleType: dataToSave.type === 'income' ? 'receita' : (dataToSave.type === 'transfer' ? 'neutro' : dataToSave.ruleType)
            };

            const index = updatedTransactions.findIndex(t => t.id === editingTransaction.id);
            if (index > -1) updatedTransactions[index] = transactionPayload;
            if (db && user && syncKey) batches.push({ id: editingTransaction.id, data: transactionPayload });

            // Atualizar somente os lançamentos futuros assinalados pelo usuário
            if (mode === 'selected' || mode === 'all') {
                const newBaseDesc = dataToSave.description.replace(/\s\(\d+\/\d+\)$/, '');
                
                futureEditsModal.futureTxs
                  .filter(ft => mode === 'all' || futureEditsModal.selectedIds.includes(ft.id))
                  .forEach(ft => {
                    let newDesc = dataToSave.description;
                    if (ft.installmentsInfo) {
                        newDesc = `${newBaseDesc} (${ft.installmentsInfo.current}/${ft.installmentsInfo.total})`;
                    }

                    const ftPayload = {
                        ...ft,
                        description: newDesc,
                        amount: value,
                        type: dataToSave.type,
                        category: dataToSave.type === 'transfer' ? 'transferencia' : dataToSave.category,
                        bank: dataToSave.bank,
                        destinationBank: dataToSave.type === 'transfer' ? dataToSave.destinationBank : null,
                        paymentMethod: dataToSave.paymentMethod,
                        associatedCard: dataToSave.associatedCard || null,
                        budgetStatus: dataToSave.budgetStatus || 'orcado',
                        ruleType: dataToSave.type === 'income' ? 'receita' : (dataToSave.type === 'transfer' ? 'neutro' : dataToSave.ruleType),
                        isFixed: dataToSave.isFixed
                        // Mantém a Data de Vencimento e estado "Pago" originais de cada mês
                    };
                    
                    const fIdx = updatedTransactions.findIndex(t => t.id === ft.id);
                    if (fIdx > -1) updatedTransactions[fIdx] = ftPayload;
                    if (db && user && syncKey) batches.push({ id: ft.id, data: ftPayload });
                });
            }

        } else {
            // Lógica de Criação de Novos Lançamentos

            const groupId = 'grp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);

            const totalCents = Math.round(value * 100);
            const baseParcelCents = isInstallment ? Math.floor(totalCents / installmentsCount) : totalCents;

            for (let i = 0; i < installmentsCount; i++) {
                const calculatedDueDate = addMonthsClampedIso(dataToSave.dueDate, i);

                // A última parcela absorve os centavos restantes para a soma bater exatamente com o total.
                const parcelCents = isInstallment
                  ? (i === installmentsCount - 1 ? totalCents - (baseParcelCents * (installmentsCount - 1)) : baseParcelCents)
                  : totalCents;
                const parcelAmount = parcelCents / 100;
                const safeId = 'tx_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
                const itemDesc = installmentsCount > 1 ? `${dataToSave.description} (${i + 1}/${installmentsCount})` : dataToSave.description;

                const transactionPayload = {

                    amount: parcelAmount,

                    bank: dataToSave.bank,
                    destinationBank: dataToSave.type === 'transfer' ? dataToSave.destinationBank : null,
                    isFixed: dataToSave.isFixed,
                    dueDate: calculatedDueDate,
                    paid: i === 0 ? dataToSave.paid : false,
                    paymentMethod: dataToSave.paymentMethod,
                    associatedCard: dataToSave.associatedCard || null,
                    budgetStatus: dataToSave.budgetStatus || 'orcado',
                    installmentsInfo: installmentsCount > 1 ? { current: i + 1, total: installmentsCount, parentId: groupId } : null,
                    ruleType: dataToSave.type === 'income' ? 'receita' : (dataToSave.type === 'transfer' ? 'neutro' : dataToSave.ruleType),
                    createdAt: new Date().toISOString()
                };

                updatedTransactions.push(transactionPayload);
                if (db && user && syncKey) batches.push({ id: safeId, data: transactionPayload });
            }
        }

        setTransactions(updatedTransactions);
        setIsModalOpen(false);
        setFutureEditsModal({ isOpen: false, pendingFormData: null, futureTxs: [], selectedIds: [] });
        resetForm();
        showToast("Lançamento guardado com sucesso!");

            console.error("Erro na nuvem:", err);
          }
        }

      const formatDateShortBR = (isoDate) => {
        if (!isoDate) return '';
        const parts = String(isoDate).split('-');
        if (parts.length !== 3) return '';
        return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0].slice(-2)}`;
      };

      const maskDateShortBR = (value) => {
        const digits = String(value || '').replace(/\D/g, '').slice(0, 6);
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
        return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
      };

      const parseDateShortBR = (value) => {
        const m = String(value || '').match(/^(\d{2})\/(\d{2})\/(\d{2})$/);
        if (!m) return '';
        const day = parseInt(m[1], 10);
        const month = parseInt(m[2], 10);
        const year = 2000 + parseInt(m[3], 10);
        const d = new Date(year, month - 1, day);
        if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return '';
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      };


      // Datas dos cartões/compras exibidas no padrão brasileiro DD/MM/AAAA,
      // mantendo internamente o formato ISO AAAA-MM-DD usado pelos cálculos.
      const formatDateBRFull = (isoDate) => {
        if (!isoDate) return '';
        const m = String(isoDate).match(/^(\d{4})-(\d{2})-(\d{2})$/);
        if (!m) return String(isoDate || '');
        return `${m[3]}/${m[2]}/${m[1]}`;
      };

      const maskDateBRFull = (value) => {
        const digits = String(value || '').replace(/\D/g, '').slice(0, 8);
        if (digits.length <= 2) return digits;
        if (digits.length <= 4) return `${digits.slice(0,2)}/${digits.slice(2)}`;
        return `${digits.slice(0,2)}/${digits.slice(2,4)}/${digits.slice(4)}`;
      };

      const parseDateBRFull = (value) => {
        const m = String(value || '').match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (!m) return '';
        const day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
        const d = new Date(year, month - 1, day);
        if (d.getFullYear() !== year || d.getMonth() !== month - 1 || d.getDate() !== day) return '';
        return `${String(year).padStart(4,'0')}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      };

            startM = currentM - 5;

        else if (pmPeriodFilter === 'all') {
            let minDate = `${currentY}-${String(currentM).padStart(2, '0')}`;

            pmExpenses.forEach(e => {
               if (!e.data) return;

           let m = startM + i;
