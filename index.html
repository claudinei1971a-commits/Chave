                      <div><label className="text-[10px] font-black uppercase text-slate-500">Valor estimado</label><input type="number" step="0.01" min="0" value={futureForm.amount} onChange={e=>setFutureForm(p=>({...p,amount:e.target.value}))} placeholder="0,00" className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" /></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Data prevista</label><input type="text" inputMode="numeric" maxLength="10" placeholder="DD/MM/AAAA" value={futureForm.date} onChange={e=>setFutureForm(p=>({...p,date:maskDateBRFull(e.target.value)}))} className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono" /></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Categoria</label><select value={futureForm.category} onChange={e=>setFutureForm(p=>({...p,category:e.target.value}))} className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">{categories.filter(c=>c.type!=='receita').map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Prioridade</label><select value={futureForm.priority} onChange={e=>setFutureForm(p=>({...p,priority:e.target.value}))} className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white"><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select></div>
                      <div className="md:col-span-2 xl:col-span-5"><label className="text-[10px] font-black uppercase text-slate-500">Observação</label><input value={futureForm.notes} onChange={e=>setFutureForm(p=>({...p,notes:e.target.value}))} placeholder="Opcional" className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" /></div>
                      <div className="flex gap-2 items-end"><button type="submit" className="flex-1 px-4 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-black">{futureEditingId?'Salvar alteração':'Adicionar'}</button>{futureEditingId&&<button type="button" onClick={resetFutureForm} className="px-3 py-2.5 border border-slate-300 rounded-xl text-xs font-bold">Cancelar</button>}</div>
                    </form>

                    <div className="p-4">
                      <div className="flex items-center justify-between gap-3 mb-3"><div><h3 className="font-black text-slate-800">{futureView==='week'?'Próximos 7 dias':futureView==='month'?'Próximo mês':futureView==='year'?'Próximo ano':'Todas as despesas futuras'}</h3><p className="text-xs text-slate-400">{futureWindow.items.length} item(ns)</p></div><div className="text-right"><p className="text-[10px] uppercase font-black text-slate-400">Total previsto</p><p className="font-black text-rose-600">R$ {futureWindow.total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div></div>
                      {futureWindow.items.length === 0 ? (
                        <div className="py-10 text-center text-sm text-slate-400">Nenhuma despesa futura nesse período.</div>
                      ) : (
                        <div className="space-y-2">{futureWindow.items.map(item => {
                          const cat=categories.find(c=>c.id===item.category);
                          const pClass=item.priority==='alta'?'bg-rose-100 text-rose-700':item.priority==='baixa'?'bg-slate-100 text-slate-600':'bg-amber-100 text-amber-700';
                          return <div key={item.id} className="grid grid-cols-1 md:grid-cols-[110px_1fr_150px_130px_auto] gap-3 items-center border border-slate-200 rounded-xl p-3 hover:bg-slate-50">
                            <div><p className="font-black text-slate-800 text-xs">{formatToDDMMAAAA(item.date)}</p><span className={`inline-flex mt-1 px-2 py-0.5 rounded-full text-[9px] font-black ${pClass}`}>{item.priority.toUpperCase()}</span></div>
                            <div><p className="font-black text-slate-800 text-sm">{item.description}</p><p className="text-[10px] text-slate-400">{cat?.name || 'Outros'}{item.notes ? ` • ${item.notes}` : ''}</p></div>
                            <div className="md:text-right"><p className="text-[10px] uppercase font-black text-slate-400">Valor estimado</p><p className="font-black text-rose-600">R$ {(parseFloat(item.amount)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div>
                            <div className="md:text-right"><p className="text-[10px] uppercase font-black text-slate-400">Impacto</p><p className="text-xs font-bold text-slate-600">Fora do orçamento</p></div>
                            <div className="flex justify-end gap-1"><button onClick={()=>handleEditFutureExpense(item)} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600" title="Editar"><Edit3 className="w-4 h-4"/></button><button onClick={()=>handleDeleteFutureExpense(item.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600" title="Excluir"><Trash2 className="w-4 h-4"/></button></div>
                          </div>;
                        })}</div>
                      )}
                    </div>
                  </div>
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800"><strong>Importante:</strong> estes valores são apenas previsões e não entram nas despesas realizadas nem no orçamento mensal até você cadastrá-los em Lançamentos.</div>
                </div>
              )}


              {/* ABA ACOMPANHAMENTO — MESES, GASTOS E METAS */}
              {activeTab === 'advanced' && (() => {
                const hoje = new Date();
                const [anoSelRaw, mesSelRaw] = String(advancedSelectedMonth || '').split('-');
                const anoSelecionado = parseInt(anoSelRaw, 10) || hoje.getFullYear();
                const mesSelecionado = parseInt(mesSelRaw, 10) || (hoje.getMonth() + 1);

                const moeda = valor => (parseFloat(valor) || 0).toLocaleString('pt-BR', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                });

                const capitalizar = txt => {
                  const value = String(txt || '');
                  return value ? value.charAt(0).toUpperCase() + value.slice(1) : value;
                };

                const referenciaTransacao = t => String(t.paymentDate || t.dueDate || t.date || t.data || '');
                const mesDaTransacao = t => referenciaTransacao(t).slice(0,7);

                // Lê a data de Gastos Futuros e compara ANO e MÊS numericamente.
                // Ex.: 01/04/2027 nunca pode entrar em Abr/2026.
                const partesDataGastoFuturo = item => {
                  const raw = String(item?.date || '').trim();
                  if (!raw) return null;

                  let day, month, year;
                  let match = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                  if (match) {
                    year = Number(match[1]);
                    month = Number(match[2]);
                    day = Number(match[3]);
                  } else {
                    match = raw.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
                    if (!match) return null;
                    day = Number(match[1]);
                    month = Number(match[2]);
                    year = Number(match[3]);
                  }

                  const valid = new Date(year, month - 1, day);
                  if (valid.getFullYear() !== year || valid.getMonth() !== month - 1 || valid.getDate() !== day) return null;
                  return { day, month, year };
                };

                const gastoFuturoPertenceAoMes = (item, year, month) => {
                  const parts = partesDataGastoFuturo(item);
                  if (!parts) return false;

                  const hoje = new Date();
                  const hojeNumero = (hoje.getFullYear() * 10000) + ((hoje.getMonth() + 1) * 100) + hoje.getDate();
                  const itemNumero = (parts.year * 10000) + (parts.month * 100) + parts.day;

                  // Um gasto só continua sendo "futuro" enquanto a data ainda não passou.
                  if (itemNumero < hojeNumero) return false;

                  return parts.year === Number(year) && parts.month === Number(month);
                };

                const criarMes = (year, month) => {
                  const d = new Date(year, month - 1, 1);
                  return {
                    numero: d.getMonth() + 1,
                    ano: d.getFullYear(),
                    key: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,
                    curto: capitalizar(d.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')),
                    nome: capitalizar(d.toLocaleDateString('pt-BR',{month:'long'}))
                  };
                };

                const mesesAno = Array.from({length:12}, (_,i) => criarMes(anoSelecionado, i+1));

                const categoriasDespesa = categories.filter(c => c.type !== 'receita');

                const valorRealizadoCategoriaMes = (categoryId, year, month) => {
                  const key = `${year}-${String(month).padStart(2,'0')}`;
                  return transactions
                    .filter(t =>
                      t.type === 'expense' &&
                      t.category === categoryId &&
                      mesDaTransacao(t) === key
                    )
                    .reduce((s,t) => s + (parseFloat(t.amount) || 0), 0);
                };

                const valorCartaoCategoriaMes = (categoryId, year, month) => {
                  const key = `${year}-${String(month).padStart(2,'0')}`;
                  return pmExpenses
                    .filter(item => (item.category || 'outros') === categoryId)
                    .reduce((sum, item) => {
                      const info = getInstallmentInfo(item, key, myCards);
                      return sum + (info ? (parseFloat(info.value) || 0) : 0);
                    }, 0);
                };

                const valorFuturoCategoriaMes = (categoryId, year, month) => {
                  const key = `${year}-${String(month).padStart(2,'0')}`;
                  return futureExpenses
                    .filter(item =>
                      item.category === categoryId &&
                      gastoFuturoPertenceAoMes(item, year, month)
                    )
                    .reduce((s,item) => s + (parseFloat(item.amount) || 0), 0);
                };

                const mediaUltimos3Meses = (categoryId, year, month) => {
                  let total = 0;
                  for (let back = 0; back < 3; back++) {
                    const d = new Date(year, month - 1 - back, 1);
                    total += valorRealizadoCategoriaMes(categoryId, d.getFullYear(), d.getMonth()+1)
                      + valorCartaoCategoriaMes(categoryId, d.getFullYear(), d.getMonth()+1);
                  }
                  return total / 3;
                };

                const resumoMes = mesesAno.map(m => {
                  const realizados = transactions
                    .filter(t => t.type === 'expense' && mesDaTransacao(t) === m.key)
                    .reduce((s,t) => s + (parseFloat(t.amount) || 0), 0);

                  const futuros = futureExpenses
                    .filter(item => gastoFuturoPertenceAoMes(item, m.ano, m.numero))
                    .reduce((s,item) => s + (parseFloat(item.amount) || 0), 0);

                  const meta = categoriasDespesa.reduce((s,c) =>
                    s + (parseFloat(monthlyGoals[goalKey(c.id, m.numero, m.ano)] || 0) || 0), 0);

                  return {
                    ...m,
                    realizados,
                    futuros,
                    meta,
                    previsto: realizados + futuros,
                    saldoMeta: meta - realizados - futuros
                  };
                });

                const resumoSelecionado = resumoMes.find(m => m.numero === mesSelecionado) || resumoMes[0];

                const linhasCategorias = categoriasDespesa.map(cat => {
                  const mesesCategoria = mesesAno.map(m => {
                    const realizado = valorRealizadoCategoriaMes(cat.id, m.ano, m.numero);
                    const cartao = valorCartaoCategoriaMes(cat.id, m.ano, m.numero);
                    const totalCategoria = realizado + cartao;
                    const futuro = valorFuturoCategoriaMes(cat.id, m.ano, m.numero);
                    const meta = parseFloat(monthlyGoals[goalKey(cat.id, m.numero, m.ano)] || 0) || 0;

                    return {
                      ...m,
                      realizado,
                      cartao,
                      totalCategoria,
                      futuro,
                      meta,
                      previsto: totalCategoria + futuro,
                      restante: meta - totalCategoria - futuro
                    };
                  });

                  const temGastoAno = mesesCategoria.some(v => v.totalCategoria > 0 || v.futuro > 0);
                  return {cat, meses: mesesCategoria, temGastoAno};
                });

                const categoriaMesSelecionado = catId => {
                  const row = linhasCategorias.find(r => r.cat.id === catId);
                  return row?.meses.find(v => v.numero === mesSelecionado) || null;
                };

                const categoriasVisiveisMes = categoriasDespesa.filter(cat => {
                  const dado = categoriaMesSelecionado(cat.id);
                  return showGoalEditors || (dado && (dado.totalCategoria > 0 || dado.futuro > 0));
                });

                const lancamentosMes = transactions
                  .filter(t => t.type === 'expense' && mesDaTransacao(t) === resumoSelecionado.key)
                  .sort((a,b) => referenciaTransacao(b).localeCompare(referenciaTransacao(a)));

                const futurosMes = futureExpenses
                  .filter(item => gastoFuturoPertenceAoMes(item, anoSelecionado, mesSelecionado))
                  .sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')));
                const hasFutureMonth = futurosMes.length > 0;
                const totalGastosRealizadosMes = lancamentosMes.reduce(
                  (sum, item) => sum + (parseFloat(item.amount) || 0), 0
                );
                const totalGastosFuturosMes = futurosMes.reduce(
                  (sum, item) => sum + (parseFloat(item.amount) || 0), 0
                );

                const totalMedia3Meses = (() => {
                  let soma = 0;
                  for (let back = 0; back < 3; back++) {
                    const d = new Date(anoSelecionado, mesSelecionado - 1 - back, 1);
                    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
                    soma += transactions
                      .filter(t => t.type === 'expense' && mesDaTransacao(t) === key)
                      .reduce((s,t) => s + (parseFloat(t.amount) || 0), 0);
                  }
                  return soma / 3;
                })();

                const mudarAno = delta => {
                  const novoAno = anoSelecionado + delta;
                  setAdvancedSelectedMonth(`${novoAno}-${String(mesSelecionado).padStart(2,'0')}`);
                };

                const mesesVisao = (() => {
                  if (advancedViewMonths === 12) return mesesAno;

                  const list = [];
                  for (let offset = 0; offset < advancedViewMonths; offset++) {
                    const d = new Date(anoSelecionado, mesSelecionado - 1 + offset, 1);
                    list.push(criarMes(d.getFullYear(), d.getMonth()+1));
                  }
                  return list;
                })();

                const linhasVisao = linhasCategorias
                  .map(row => {
                    const valores = mesesVisao.map(m => {
                      const realizadoDireto = valorRealizadoCategoriaMes(row.cat.id, m.ano, m.numero);
                      const cartao = valorCartaoCategoriaMes(row.cat.id, m.ano, m.numero);
                      const realizado = realizadoDireto + cartao;
                      const futuro = valorFuturoCategoriaMes(row.cat.id, m.ano, m.numero);
                      const meta = parseFloat(monthlyGoals[goalKey(row.cat.id, m.numero, m.ano)] || 0) || 0;
                      return {...m, realizado, realizadoDireto, cartao, futuro, meta};
                    });
                    return {
                      cat: row.cat,
                      valores,
                      temGasto: valores.some(v => v.realizado > 0 || v.futuro > 0)
                    };
                  })
                  .filter(row => showGoalEditors || row.temGasto);

                const dadosGrafico = mesesVisao.map(m => {
                  const realizado = transactions
                    .filter(t => t.type === 'expense' && mesDaTransacao(t) === m.key)
                    .reduce((s,t) => s + (parseFloat(t.amount) || 0), 0);

                  const futuro = futureExpenses
                    .filter(item => gastoFuturoPertenceAoMes(item, m.ano, m.numero))
                    .reduce((s,item) => s + (parseFloat(item.amount) || 0), 0);

                  const meta = categoriasDespesa.reduce((s,c) =>
                    s + (parseFloat(monthlyGoals[goalKey(c.id, m.numero, m.ano)] || 0) || 0), 0);

                  return {
                    mes: `${m.curto}/${String(m.ano).slice(-2)}`,
                    realizado,
                    futuro,
                    meta
                  };
                });

                const futurosConsideradosNoGrafico = futureExpenses
                  .filter(item => mesesVisao.some(m => gastoFuturoPertenceAoMes(item, m.ano, m.numero)))
                  .sort((a,b) => String(a.date || '').localeCompare(String(b.date || '')));
                const graficoTemGastosFuturos = futurosConsideradosNoGrafico.length > 0;

                const nomeVisao = advancedViewMonths === 12
                  ? `Ano inteiro — ${anoSelecionado}`
                  : `${advancedViewMonths} meses a partir de ${resumoSelecionado.nome}/${anoSelecionado}`;

                return (
                  <div className="monthgoals-page monthgoals-v21 monthgoals-v23 monthgoals-v24 monthgoals-v28 monthgoals-v29 monthgoals-v30 monthgoals-v31 animate-fade-in">
                    <div className="monthgoals-header">
                      <div>
                        <h2>Acompanhamento Mensal de Gastos e Metas</h2>
                        <p>Veja os meses, seus gastos, a média dos últimos 3 meses e defina suas metas.</p>
                      </div>

                      <div className="monthgoals-actions">
                        <div className="monthgoals-year">
                          <button type="button" onClick={()=>{
                            if (showGoalEditors) { showToast('Conclua as metas antes de trocar de ano.'); return; }
                            mudarAno(-1);
                          }}>‹</button>
                          <strong>{anoSelecionado}</strong>
                          <button type="button" onClick={()=>{
                            if (showGoalEditors) { showToast('Conclua as metas antes de trocar de ano.'); return; }
                            mudarAno(1);
                          }}>›</button>
                        </div>

                        <button
                          type="button"
                          className={`monthgoals-edit-btn ${showGoalEditors ? 'active' : ''}`}
                          onClick={()=>{
                            if (showGoalEditors) {
                              concludeMonthlyGoalEdit();
                            } else {
                              beginMonthlyGoalEdit(anoSelecionado, mesSelecionado);
                            }
                          }}
                        >
                          <Target className="w-4 h-4"/>
                          {showGoalEditors ? 'Concluir Metas' : 'Definir Metas'}
                        </button>


                        <button
                          type="button"
                          className="monthgoals-print-btn no-print"
                          onClick={()=>window.print()}
                        >
                          <Printer className="w-4 h-4"/>
                          Imprimir resumo
                        </button>
                      </div>
                    </div>

                    <div className="monthgoals-months">
                      {resumoMes.map(m => {
                        const ativo = m.numero === mesSelecionado;
                        const pct = m.meta > 0 ? ((m.realizados + m.futuros) / m.meta) * 100 : 0;
                        return (
                          <button
                            type="button"
                            key={m.key}
                            className={`monthgoals-month-card ${ativo ? 'active' : ''}`}
                            onClick={()=>{
                              if (showGoalEditors) {
                                showToast('Conclua as metas antes de trocar de mês.');
                                return;
                              }
                              setAdvancedSelectedMonth(m.key);
                            }}
                          >
                            <div className="monthgoals-month-name">{m.nome}</div>
                            <div className="monthgoals-month-money">R$ {moeda(m.realizados)}</div>
                            <small>Gastos realizados</small>

                            <div className="monthgoals-month-row">
                              <span>Futuros</span>
                              <b>R$ {moeda(m.futuros)}</b>
                            </div>
                            <div className="monthgoals-month-row">
                              <span>Meta</span>
                              <b>R$ {moeda(m.meta)}</b>
                            </div>

                            <div className={`monthgoals-mini-progress ${pct > 100 ? 'danger' : pct >= 80 ? 'warning' : 'good'}`}>
                              <i style={{width:`${Math.min(Math.max(pct,0),100)}%`}}></i>
                            </div>
                          </button>
                        );
                      })}
                    </div>

                    <div className="monthgoals-summary monthgoals-summary-v21">
                      <div className="monthgoals-summary-card">
                        <span>Gastos realizados</span>
                        <strong className="rose">R$ {moeda(resumoSelecionado.realizados)}</strong>
                        <small>{resumoSelecionado.nome} de {anoSelecionado}</small>
                      </div>

                      {resumoSelecionado.futuros > 0 && (
                        <div className="monthgoals-summary-card">
                          <span>Gastos futuros</span>
                          <strong className="blue">R$ {moeda(resumoSelecionado.futuros)}</strong>
                          <small>Mesma base da aba Futuras</small>
                        </div>
                      )}

                      <div className="monthgoals-summary-card">
                        <span>Meta do mês</span>
                        <strong className="green">R$ {moeda(resumoSelecionado.meta)}</strong>
                        <small>Soma das metas das categorias</small>
                      </div>

                      <div className="monthgoals-summary-card">
                        <span>Média últimos 3 meses</span>
                        <strong>R$ {moeda(totalMedia3Meses)}</strong>
                        <small>Média dos gastos realizados</small>
                      </div>

                      <div className="monthgoals-summary-card">
                        <span>Disponível na meta</span>
                        <strong className={resumoSelecionado.saldoMeta >= 0 ? 'green' : 'rose'}>
                          R$ {moeda(resumoSelecionado.saldoMeta)}
                        </strong>
                        <small>Meta − realizados − futuros</small>
                      </div>
                    </div>

                    <div className="monthgoals-section-card">
                      <div className="monthgoals-section-head">
                        <div>
                          <h3>Metas por Categoria — {resumoSelecionado.nome} de {anoSelecionado}</h3>
                          <p>A meta alterada fica fixa neste mês quando você clicar em Concluir Metas. Para mudar os meses seguintes, use a opção de próximos meses.</p>
                        </div>
                        {!showGoalEditors && (
                          <button type="button" onClick={()=>beginMonthlyGoalEdit(anoSelecionado, mesSelecionado)}>
                            <Target className="w-4 h-4"/> Definir metas
                          </button>
                        )}
                      </div>

                      {showGoalEditors && (
                        <div className="monthgoals-fixed-month-notice">
                          <Target className="w-4 h-4"/>
                          <span>
                            Editando metas de <b>{resumoSelecionado.nome} de {anoSelecionado}</b>.
                            Elas só serão gravadas quando você clicar em <b>Concluir Metas</b>.
                          </span>
                        </div>
                      )}

                      <div className="monthgoals-category-grid monthgoals-category-grid-v21">
                        {categoriasVisiveisMes.length === 0 && !showGoalEditors ? (
                          <div className="monthgoals-empty monthgoals-empty-wide">
                            Nenhuma categoria com gasto neste mês.
                          </div>
                        ) : categoriasVisiveisMes.map(cat => {
                          const dados = categoriaMesSelecionado(cat.id) || {
                            realizado:0,
                            futuro:0,
                            meta:parseFloat(monthlyGoals[goalKey(cat.id,mesSelecionado,anoSelecionado)]||0)||0
                          };

                          const totalCategoria = (dados.totalCategoria ?? ((dados.realizado || 0) + (dados.cartao || 0)));
                          const previsto = totalCategoria + (dados.futuro || 0);
                          const restante = (dados.meta || 0) - previsto;
                          const pct = dados.meta > 0 ? (previsto / dados.meta) * 100 : 0;
                          const media3 = mediaUltimos3Meses(cat.id, anoSelecionado, mesSelecionado);
                          const metaPadrao = getYearGoalBase(cat.id, anoSelecionado);
                          const editingFuture = futureGoalEdit.categoryId === cat.id;

                          return (
                            <div
                              className="monthgoals-category-card monthgoals-category-card-v21 monthgoals-category-card-v29 monthgoals-category-card-v31"
                              key={cat.id}
                              onClick={() => setCategoryExpenseDetail({
                                categoryId: cat.id,
                                categoryName: cat.name,
                                color: cat.color || '#64748b',
                                monthKey: resumoSelecionado.key,
                                monthName: resumoSelecionado.nome,
                                year: anoSelecionado
                              })}
                              title="Clique para ver todos os gastos desta categoria"
                            >
                              <div className="monthgoals-category-title-v29">

                  if (t.includes('saude') || t.includes('medic')) return '❤️';
                  if (t.includes('transporte') || t.includes('combust')) return '🚙';

                  if (t.includes('invest') || t.includes('poupanca')) return '🐷';
                  if (t.includes('divida') || t.includes('emprest')) return '💳';
                  if (t.includes('educa') || t.includes('curso')) return '📚';
                  if (t.includes('restaurante') || t.includes('delivery')) return '🍽️';

                  for (let offset = -18; offset <= 12; offset++) {

                      key,
                      label: offset === 0
                        ? `Este mês — ${labelMonth.charAt(0).toUpperCase() + labelMonth.slice(1)}`
                        : labelMonth.charAt(0).toUpperCase() + labelMonth.slice(1)
                    });

                    .filter(t => {
                      if (t.type !== 'expense' || !isPaidTransaction(t) || t.category !== segment.categoryId) return false;
                      const refDate = t.paymentDate || t.dueDate || t.date || t.data || '';
                      return String(refDate).slice(0, 7) === monthKey;
                    })
                    .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);
                };

                const getThreeMonthAverage = segment => {
                  let total = 0;
                  for (let back = 0; back < 3; back++) {
                    const d = new Date(selectedYear, selectedMonthNum - 1 - back, 1);
                    total += getRealizedForSpecificMonth(segment, d.getFullYear(), d.getMonth() + 1);
                  }
                  return total / 3;
                };

                const detailRowsFor = segment => transactions
                  .filter(t => {
                    if (t.type !== 'expense' || !isPaidTransaction(t) || t.category !== segment.categoryId) return false;
                    const refDate = t.paymentDate || t.dueDate || t.date || t.data || '';
                    return String(refDate).slice(0, 7) === selectedMonthKey;
                  })
                  .sort((a, b) =>
                    String(b.paymentDate || b.dueDate || b.date || '')
                      .localeCompare(String(a.paymentDate || a.dueDate || a.date || ''))
                  );

                const selectedRows = expenseGoalSegments.map(segment => {
                  const realized = getRealizedForSpecificMonth(segment, selectedYear, selectedMonthNum);
                  const objective = getGoalValue(segment.id, selectedMonthNum, selectedYear);
                  const average3 = getThreeMonthAverage(segment);
                  const pct = objective > 0 ? (realized / objective) * 100 : 0;
                  const variation = objective > 0 ? ((realized - objective) / objective) * 100 : null;
                  const normalized = normalizeGoalText(segment.label);
                  const isReserve = normalized.includes('poupanca') || normalized.includes('invest');
                  const isDebt = normalized.includes('divida') || normalized.includes('emprest');

                  let statusText = 'Defina uma meta';
                  let statusClass = 'goalview-status-neutral';

                  if (objective > 0) {
                    if (isReserve) {
                      statusText = pct >= 100 ? 'META ATINGIDA' : 'RESERVA EM ANDAMENTO';
                      statusClass = pct >= 100 ? 'goalview-status-special' : 'goalview-status-blue';
                    } else if (isDebt) {
                      statusText = realized > 0 ? 'AMORTIZAÇÃO ATIVA' : 'SEM PAGAMENTO NO MÊS';
                      statusClass = realized > 0 ? 'goalview-status-special' : 'goalview-status-neutral';
                    } else if (pct > 100) {
                      statusText = 'ACIMA DA META';
                      statusClass = 'goalview-status-red';
                    } else if (pct >= 80) {
                      statusText = 'PRÓXIMO DO LIMITE';
                      statusClass = 'goalview-status-amber';
                    } else {
                      statusText = 'DENTRO DA META';
                      statusClass = 'goalview-status-green';
                    }
                  }

                  return {
                    segment,
                    realized,
                    objective,
                    average3,
                    pct,
                    variation,
                    isReserve,
                    isDebt,
                    statusText,
                    statusClass
                  };
                });

                const totalMonthlySpent = selectedRows.reduce((sum, row) => sum + row.realized, 0);

                const confirmedIncomeMonth = transactions
                  .filter(t => {
                    if (t.type !== 'income' || !isPaidTransaction(t)) return false;
                    const refDate = t.paymentDate || t.dueDate || t.date || '';
                    return String(refDate).slice(0, 7) === selectedMonthKey;
                  })
                  .reduce((sum, t) => sum + (parseFloat(t.amount) || 0), 0);

                const availableForReserve = Math.max(0, confirmedIncomeMonth - totalMonthlySpent);

                const debtCategoryIds = new Set(
                  categories
                    .filter(c => {
                      const txt = normalizeGoalText(c.name);
                      return txt.includes('divida') || txt.includes('emprest') || c.id === 'dividas';
                    })
                    .map(c => c.id)
                );

                const nextDebt = transactions
                  .filter(t => {
                    if (t.type !== 'expense' || isPaidTransaction(t)) return false;
                    const txt = normalizeGoalText(`${t.description || ''} ${t.category || ''}`);
                    const isDebt = debtCategoryIds.has(t.category) || txt.includes('divida') || txt.includes('emprest');
                    if (!isDebt) return false;
                    const due = String(t.dueDate || '');
                    return due && due >= selectedMonthStart;
                  })
                  .sort((a, b) => String(a.dueDate || '').localeCompare(String(b.dueDate || '')))[0];

                const reserveRow = selectedRows.find(r => r.isReserve);
                const debtRow = selectedRows.find(r => r.isDebt);

                const totalGoals = selectedRows.filter(r => r.objective > 0).reduce((sum, r) => sum + r.objective, 0);
                const totalRealized = selectedRows.reduce((sum, r) => sum + r.realized, 0);
                const overallPct = totalGoals > 0 ? (totalRealized / totalGoals) * 100 : 0;

                return (
                  <div className="goalview-page animate-fade-in">
                    <div className="goalview-topline">
                      <div>
                        <h2>Visão Geral das Minhas Metas</h2>
                        <p>Acompanhe seus gastos, metas mensais, reserva e pagamento de dívidas.</p>
                      </div>
                      <button
                        type="button"
                        className={`goalview-structure-btn ${showGoalEditors ? 'active' : ''}`}
                        onClick={() => setShowGoalEditors(v => !v)}
                      >
                        <Settings className="w-4 h-4"/>
                        {showGoalEditors ? 'Concluir Edição' : 'Editar Estrutura'}
                      </button>
                    </div>

                    <div className="goalview-overview-grid">
                      <div className="goalview-period-card">
                        <label>Período</label>
                        <select
                          value={goalPeriod}
                          onChange={e => {
                            const value = e.target.value;
                            setGoalPeriod(value);
                            setGoalYear(parseInt(value.slice(0, 4), 10));
                            setGoalExpandedCategoryId(null);
                          }}
                        >
                          {periodOptions.map(option => (
                            <option key={option.key} value={option.key}>{option.label}</option>
                          ))}
                        </select>
                      </div>

                      <div className="goalview-stat-card">
                        <span>Gasto Total Mensal</span>
                        <strong className="goalview-green">R$ {money(totalMonthlySpent)}</strong>
                        <small>{totalGoals > 0 ? `${Math.round(overallPct)}% das metas definidas` : 'Defina metas para comparar'}</small>
                      </div>

                      <div className="goalview-stat-card">
                        <span>Disponível para Reserva</span>
                        <strong className={availableForReserve > 0 ? 'goalview-green' : 'goalview-red-text'}>
                          R$ {money(availableForReserve)}
                        </strong>
                        <small>
                          {availableForReserve > 0
                            ? 'Saldo após receitas e gastos confirmados'
                            : 'Sem margem disponível neste período'}
                        </small>
                      </div>

                      <div className="goalview-stat-card">
                        <span>Próxima Quitação de Dívida</span>
                        <strong className={nextDebt ? 'goalview-green' : ''}>
                          {nextDebt?.dueDate ? formatToDDMMAAAA(nextDebt.dueDate).slice(0, 5) : 'Nenhuma'}
                        </strong>
                        <small>
                          {nextDebt
                            ? `${nextDebt.description || 'Pagamento de dívida'} • R$ ${money(nextDebt.amount)}`
                            : 'Nenhuma dívida pendente localizada'}
                        </small>
                      </div>
                    </div>

                    {(reserveRow || debtRow) && (
                      <div className="goalview-focus-strip">
                        {reserveRow && (
                          <div>
                            <span>Reserva de Emergência</span>
                            <b>R$ {money(reserveRow.realized)}</b>
                            <small>Meta: R$ {money(reserveRow.objective)}</small>
                          </div>
                        )}
                        {debtRow && (
                          <div>
                            <span>Pagamento de Dívidas</span>
                            <b>R$ {money(debtRow.realized)}</b>
                            <small>Meta: R$ {money(debtRow.objective)}</small>
                          </div>
                        )}
                      </div>
                    )}

                    <div className="goalview-table-card">
                      <div className="goalview-table-scroll">
                        <table className="goalview-table">
                          <thead>
                            <tr>
                              <th>Categoria</th>
                              <th>Realizado Mês</th>
                              <th>Meta do Mês</th>
                              <th>Status</th>
                              <th>Variação (%)</th>
                            </tr>
                          </thead>
                          <tbody>
                            {selectedRows.map(row => {
                              const detailRows = goalExpandedCategoryId === row.segment.id
                                ? detailRowsFor(row.segment)
                                : [];
                              const barWidth = row.objective > 0
                                ? Math.min(Math.max(row.pct, 0), 100)
                                : 0;
                              const variationText = row.variation === null
                                ? '—'
                                : `${row.variation >= 0 ? '+' : ''}${Math.round(row.variation)}%`;

                              return (
                                <React.Fragment key={row.segment.id}>
                                  <tr
                                    className={`goalview-row ${goalExpandedCategoryId === row.segment.id ? 'expanded' : ''}`}
                                    onClick={() => setGoalExpandedCategoryId(id => id === row.segment.id ? null : row.segment.id)}
                                  >
                                    <td>
                                      <div className="goalview-category">
                                        <span className="goalview-category-icon">{rowIcon(row.segment.label)}</span>
                                        <div>
                                          <b>
                                            {row.isReserve
                                              ? 'NOVA: Reserva de Emergência (Poupança)'
                                              : row.segment.label}
                                          </b>
                                          <small>Média últimos 3 meses: R$ {money(row.average3)}</small>
                                          <em>{goalExpandedCategoryId === row.segment.id ? 'Fechar detalhes ▲' : 'Clique para ver detalhes'}</em>
                                        </div>
                                      </div>
                                    </td>

                                    <td>
                                      <div className="goalview-money">R$ {money(row.realized)}</div>
                                      <small>Média: R$ {money(row.average3)}</small>
                                    </td>

                                    <td onClick={e => e.stopPropagation()}>
                                      {showGoalEditors ? (
                                        <div className="goalview-goal-editor">
                                          <span>R$</span>
                                          <input
                                            type="number"
                                            step="0.01"
                                            min="0"
                                            value={monthlyGoals[goalKey(row.segment.id, selectedMonthNum, selectedYear)] ?? ''}
                                            onChange={e => setGoalValue(row.segment.id, selectedMonthNum, e.target.value, selectedYear)}
                                            placeholder="0,00"
                                          />
                                        </div>
                                      ) : (
                                        <>
                                          <div className="goalview-money">R$ {money(row.objective)}</div>
                                          <small>Meta mensal</small>
                                        </>
                                      )}
                                    </td>

                                    <td>
                                      <div className={`goalview-status-wrap ${row.statusClass}`}>
                                        <div className="goalview-progress">
                                          <i style={{ width: `${barWidth}%` }}></i>
                                          {row.objective > 0 && <span>{Math.round(row.pct)}%</span>}
                                        </div>
                                        <small>{row.statusText}</small>
                                      </div>
                                    </td>

                                    <td>
                                      <div className={`goalview-variation ${
                                        row.variation === null
                                          ? ''
                                          : row.isReserve || row.isDebt
                                            ? (row.variation >= 0 ? 'positive' : 'negative')
                                            : (row.variation <= 0 ? 'positive' : 'negative')
                                      }`}>
                                        <b>{variationText}</b>
                                        <small>
                                          {row.objective <= 0
                                            ? 'Sem meta definida'
                                            : row.isReserve
                                              ? (row.pct >= 100 ? 'Meta de reserva alcançada' : 'Reserva em formação')
                                              : row.isDebt
                                                ? 'Amortização acompanhada'
                                                : row.variation <= 0
                                                  ? 'Dentro do planejado'
                                                  : 'Acima do planejado'}
                                        </small>
                                      </div>
                                    </td>
                                  </tr>

                                  {goalExpandedCategoryId === row.segment.id && (
                                    <tr className="goalview-detail-row">
                                      <td colSpan="5">
                                        <div className="goalview-detail-box">
                                          <div className="goalview-detail-head">
                                            <div>
                                              <h4>Detalhes — {row.segment.label}</h4>
                                              <p>{selectedMonthKey} • {detailRows.length} lançamento(s) confirmados</p>
                                            </div>
                                            <button
                                              type="button"
                                              onClick={() => setGoalExpandedCategoryId(null)}
                                            >
                                              Fechar
                                            </button>
                                          </div>

                                          {detailRows.length === 0 ? (
                                            <div className="goalview-empty">Nenhum gasto confirmado nesta categoria no período selecionado.</div>
                                          ) : (
                                            <div className="goalview-detail-list">
                                              {detailRows.map(t => {
                                                const refDate = t.paymentDate || t.dueDate || t.date || '';
                                                return (
                                                  <div key={t.id} className="goalview-detail-item">
                                                    <span>{formatToDDMMAAAA(refDate)}</span>
                                                    <div>
                                                      <b>{t.description || 'Lançamento'}</b>
                                                      <small>{t.bank || t.payerBank || 'Sem banco informado'}</small>
                                                    </div>
                                                    <strong>R$ {money(t.amount)}</strong>
                                                    <button
                                                      type="button"
                                                      onClick={() => handleEditClick(t)}
                                                      title="Editar este lançamento"
                                                    >
                                                      <Edit3 className="w-3.5 h-3.5"/> Editar
                                                    </button>
                                                  </div>
                                                );
                                              })}
                                            </div>
                                          )}
                                        </div>
                                      </td>
                                    </tr>
                                  )}
                                </React.Fragment>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>

                      {selectedRows.length === 0 && (
                        <div className="goalview-empty">Nenhuma categoria de despesa cadastrada.</div>
                      )}
                    </div>

                    <div className="goalview-footer-note">
                      <Target className="w-4 h-4"/>
                      <span>
                        Em <b>Editar Estrutura</b>, informe a meta mensal de cada categoria.
                        Os valores realizados são calculados automaticamente pelos lançamentos confirmados.
                      </span>
                    </div>
                  </div>
                );
              })()}

              {/* ABA PLANEJAMENTO E REGRAS PERSONALIZADAS — V48 */}
              {activeTab === 'planning' && (() => {
                const moneyBR = value => (parseFloat(value) || 0).toLocaleString('pt-BR', {
                  minimumFractionDigits: 2,
                  maximumFractionDigits: 2
                });

                const totalBalanceAllTime = Object.values(balances.bankBalances || {})
                  .reduce((sum, value) => sum + (parseFloat(value) || 0), 0);

                const categoryGroups = [
                  {
                    type: 'necessidade',
                    title: 'Necessidades',
                    subtitle: 'Gastos essenciais para o seu dia a dia',
                    icon: '🏠',
                    tone: 'need'
                  },
                  {
                    type: 'desejo',
                    title: 'Desejos',
                    subtitle: 'Gastos que trazem mais qualidade de vida',
                    icon: '🛒',
                    tone: 'want'
                  },
                  {
                    type: 'poupanca',
                    title: 'Poupança / Investimentos / Dívidas',
                    subtitle: 'Seu futuro financeiro',
                    icon: '📈',
                    tone: 'save'
                  },
                  {
                    type: 'receita',
                    title: 'Receita',
                    subtitle: 'Entradas de dinheiro',
                    icon: '💰',
                    tone: 'income'
                  }
                ];

                const normalizedSearch = planningCategorySearch.trim().toLowerCase();
                const filteredPlanningCategories = categories.filter(c => {
                  if (!normalizedSearch) return true;
                  const desc = getCategoryDescription(c);
                  return `${c.name} ${desc}`.toLowerCase().includes(normalizedSearch);
                });

                const focusNewCategory = (type) => {
                  setNewCatType(type);
                  setTimeout(() => document.getElementById('planning-new-category-name')?.focus(), 50);
                };

                const renderCategoryRow = (c, compact = false) => (
                  <div
                    key={`${compact ? 'group' : 'list'}-${c.id}`}
                    className={`rules-category-row-v48 ${compact ? 'compact' : ''} ${editingCategoryId === c.id ? 'editing' : ''}`}
                  >
                    {editingCategoryId === c.id ? (
                      <div className="rules-category-edit-v48">
                        <input
                          autoFocus
                          type="text"
                          value={editingCategoryName}
                          onChange={(e)=>setEditingCategoryName(e.target.value)}
                          placeholder="Nome da categoria"
                        />

                        <select
                          value={editingCategoryType}
                          onChange={(e)=>setEditingCategoryType(e.target.value)}
                        >
                          <option value="necessidade">Necessidade</option>
                          <option value="desejo">Desejo</option>
                          <option value="poupanca">Poupança / Investimentos / Dívidas</option>
                          <option value="receita">Receita</option>
                        </select>

                        <input
                          type="color"
                          value={editingCategoryColor}
                          onChange={(e)=>setEditingCategoryColor(e.target.value)}
                          title="Cor da categoria"
                        />

                        <button type="button" className="save" onClick={()=>handleSaveCategoryEdit(c.id)}>
                          <CheckCircle className="w-4 h-4"/> Salvar
                        </button>
                        <button type="button" className="cancel" onClick={handleCancelEditCategory}>
                          <X className="w-4 h-4"/>
                        </button>
                      </div>
                    ) : (
                      <>
                        <div className="rules-category-main-v48">
                          <span className="rules-category-dot-v48" style={{backgroundColor:c.color}}></span>
                          <div>
                            <b>{c.name}</b>
                            {!compact && <small>{getCategoryDescription(c)}</small>}
                          </div>
                        </div>

                        {!compact && (
                          <>
                            <span className={`rules-category-group-badge-v48 ${c.type}`}>
                              {c.type === 'necessidade'
                                ? 'Necessidades'
                                : c.type === 'desejo'
                                  ? 'Desejos'
                                  : c.type === 'poupanca'
                                    ? 'Poupança/Dívidas'
                                    : 'Receita'}
                            </span>
                            <span className="rules-category-description-cell-v48">{getCategoryDescription(c)}</span>
                          </>
                        )}

                        <div className="rules-category-actions-v48">
                          <button type="button" onClick={()=>handleEditCategory(c)} title="Editar categoria">
                            <Edit3 className="w-3.5 h-3.5"/>
                          </button>
                          <button type="button" className="delete" onClick={()=>handleDeleteCategory(c.id)} title="Excluir categoria">
                            <Trash2 className="w-3.5 h-3.5"/>
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                );

                return (
                  <div className="planning-rules-v48 space-y-4">
                    <div className="rules-top-grid-v48">
                      {/* AJUSTE DE METAS */}
                      <section className="rules-card-v48 rules-budget-v48">
                        <div className="rules-card-head-v48">
                          <div className="rules-card-icon-v48 blue"><Target className="w-5 h-5"/></div>
                          <div>
                            <h3>Ajuste de Metas</h3>
                            <p>Defina e acompanhe a distribuição do seu orçamento</p>
                          </div>
                        </div>

                        <div className="rules-budget-lines-v48">
                          <div className="rules-budget-line-v48">
                            <div>
                              <span>Necessidades ({budgets.necessidade}%)</span>
                              <b>R$ {moneyBR(stats.totalIncome * budgets.necessidade / 100)}</b>
                            </div>
                            <input
                              type="range"
                              min="10"
                              max="80"
                              step="5"
                              value={budgets.necessidade}
                              onChange={(e)=>{
                                const v = parseInt(e.target.value);
                                setBudgets(prev => ({
                                  ...prev,
                                  necessidade:v,
                                  desejo:Math.max(0,100-v-prev.poupanca)
                                }));
                              }}
                              className="need"
                            />
                          </div>

                          <div className="rules-budget-line-v48">
                            <div>
                              <span>Desejos ({budgets.desejo}%)</span>
                              <b>R$ {moneyBR(stats.totalIncome * budgets.desejo / 100)}</b>
                            </div>
                            <input
                              type="range"
                              min="0"
                              max="70"
                              step="5"
                              value={budgets.desejo}
                              onChange={(e)=>{
                                const v = parseInt(e.target.value);
                                setBudgets(prev => ({
                                  ...prev,
                                  desejo:v,
                                  poupanca:Math.max(0,100-prev.necessidade-v)
                                }));
                              }}
                              className="want"
                            />
                          </div>

                          <div className="rules-budget-line-v48">
                            <div>
                              <span>Poupança/Investimentos ({budgets.poupanca}%)</span>
                              <b>R$ {moneyBR(stats.totalIncome * budgets.poupanca / 100)}</b>
                            </div>
                            <input
                              type="range"
                              min="0"
                              max="70"
                              step="5"
                              value={budgets.poupanca}
                              onChange={(e)=>{
                                const v = parseInt(e.target.value);
                                setBudgets(prev => ({
                                  ...prev,
                                  poupanca:v,
                                  desejo:Math.max(0,100-prev.necessidade-v)
                                }));
                              }}
                              className="save"
                            />
                          </div>
                        </div>

                        <div className="rules-budget-total-v48">
                          <div>
                            <span>Total do orçamento</span>
                            <strong>R$ {moneyBR(stats.totalIncome)}</strong>
                            <small>{budgets.necessidade + budgets.desejo + budgets.poupanca}% distribuído</small>
                          </div>
                          <button
                            type="button"
                            onClick={async()=>{
                              await saveSettingsToCloud(banks, categories, budgets, myCards, monthlyGoals);
                              localStorage.setItem('local_budgets', JSON.stringify(budgets));
                              showToast('Metas de orçamento salvas!');
                            }}
                          >
                            Salvar metas
                          </button>
                        </div>
                      </section>

                      {/* GERENCIAR CONTAS */}
                      <section className="rules-card-v48 rules-accounts-v48">
                        <div className="rules-card-head-v48">
                          <div className="rules-card-icon-v48 blue"><Wallet className="w-5 h-5"/></div>
                          <div className="flex-grow">
                            <h3>Gerenciar Contas</h3>
                            <p>Suas contas financeiras cadastradas</p>
                          </div>
                          <button
                            type="button"
                            className="rules-new-account-v48"
                            onClick={()=>document.getElementById('planning-new-bank')?.focus()}

                            <Plus className="w-4 h-4"/> Nova conta

                            const value = balances.bankBalances?.[bank] || 0;
                            const projectedValue = projectedBalances.bankBalances?.[bank] || 0;
                            const bankVisual = getBankVisualMeta(bank);
                            const color1 = bankVisual.c1;
                            const color2 = bankVisual.c2;
                            return (
                              <div key={bank} className="rules-account-card-v52">
                                <div className="rules-account-card-head-v52">
                                  <div className="rules-account-name-v48">
                                    <span className="rules-bank-specific-icon-v53" style={{ background: `linear-gradient(135deg, ${color1} 0%, ${color2} 100%)` }} title={bankVisual.label}>{bankVisual.short}</span>
                                    {editingBankName === bank ? (
                                      <input
                                        autoFocus
                                        value={editingBankValue}
                                        onChange={(e)=>setEditingBankValue(e.target.value)}
                                        onKeyDown={(e)=>{
                                          if(e.key==='Enter'){ e.preventDefault(); handleSaveBankEdit(bank); }
                                          if(e.key==='Escape') handleCancelEditBank();
                                        }}
                                      />
                                    ) : (
                                      <div>
                                        <b>{bank}</b>
                                        <small>{bankVisual.isInstitution ? 'Instituição' : 'Conta manual'}</small>
                                      </div>
                                    )}
                                  </div>
                                  <div className="rules-account-actions-v48 rules-account-actions-v53">
                                    {editingBankName === bank ? (
                                      <>
                                        <button type="button" className="save" onClick={()=>handleSaveBankEdit(bank)} title="Salvar"><CheckCircle className="w-3.5 h-3.5"/></button>
                                        <button type="button" onClick={handleCancelEditBank} title="Cancelar"><X className="w-3.5 h-3.5"/></button>
                                      </>
                                    ) : (
