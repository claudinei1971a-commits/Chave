                      {cardsList.map(card => <option key={card} value={card}>{card}</option>)}
                    </select>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-sm">
                        <thead>
                          <tr className="bg-slate-100 text-slate-500 uppercase font-bold border-b border-slate-200 text-[11px] tracking-wider">
                            <th className="px-6 py-4">Comprador</th>
                            <th className="px-6 py-4">Local</th>
                            <th className="px-6 py-4">Produto</th>
                            <th className="px-6 py-4">Pagamento</th>
                            <th className="px-6 py-4">Data Compra</th>
                            <th className="px-6 py-4">Último Pagto.</th>
                            <th className="px-6 py-4 text-right">Parcelado em</th>
                            <th className="px-6 py-4 text-right">Valor Parcela</th>
                            <th className="px-6 py-4 text-right">Valor Total</th>
                            <th className="px-6 py-4 text-center">Ações</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                          {filteredPmExpenses.map(item => (
                            <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                              <td className="px-6 py-4 font-bold text-slate-800">{item.comprador}</td>
                              <td className="px-6 py-4 font-black text-slate-900">{item.local}</td>
                              <td className="px-6 py-4 text-slate-600 font-medium">{item.produto}</td>
                              <td className="px-6 py-4">
                                <span className="px-2.5 py-1 rounded-md text-[10px] font-black bg-cyan-50 text-cyan-700 border border-cyan-200 uppercase">{item.pagamento}</span>
                              </td>
                              <td className="px-6 py-4 text-slate-500 font-mono font-medium">{formatToDDMMAAAA(item.data)}</td>
                              <td className="px-6 py-4 text-emerald-600 font-mono font-bold">{calculateLastPaymentDate(item, myCards)}</td>
                              <td className="px-6 py-4 text-right font-semibold text-slate-600">{item.parcelas}x</td>
                              <td className="px-6 py-4 text-right font-bold text-slate-700">R$ {parseFloat(item.valorParcela).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                              <td className="px-6 py-4 text-right font-black text-slate-900">R$ {parseFloat(item.valorTotal).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
                              <td className="px-6 py-4">
                                <div className="flex gap-2 justify-center">
                                  <button onClick={() => handleDuplicatePmClick(item)} className="p-2 hover:bg-slate-200 rounded-lg text-slate-500 hover:text-indigo-600 transition" title="Duplicar"><Copy className="w-4 h-4" /></button>
                                  <button onClick={() => handleEditPmClick(item)} className="p-2 hover:bg-slate-200 rounded-lg text-slate-500 hover:text-slate-800 transition" title="Editar"><Edit3 className="w-4 h-4" /></button>
                                  <button onClick={() => setDeleteConfirmation({ isOpen: true, transactionId: item.id, isPaymanager: true })} className="p-2 hover:bg-rose-100 rounded-lg text-rose-500 hover:text-rose-700 transition" title="Remover"><Trash2 className="w-4 h-4" /></button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* ABA DESPESAS FUTURAS */}
              {activeTab === 'future' && (
                <div className="space-y-5">
                  <div className="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div className="px-5 py-4 bg-gradient-to-r from-rose-600 to-orange-500 text-white flex flex-col md:flex-row gap-3 md:items-center md:justify-between">
                      <div>
                        <h2 className="font-black text-lg flex items-center gap-2"><Clock className="w-5 h-5"/> Despesas Futuras</h2>
                        <p className="text-xs text-rose-50 mt-1">Reserve espaço para gastos fora do orçamento mensal, como IPVA, gás, manutenção e imprevistos.</p>
                      </div>
                      <div className="flex flex-wrap gap-2">
                        {[['week','Semana'],['month','Mês'],['year','Ano'],['all','Todas']].map(([id,label]) => (
                          <button key={id} onClick={() => setFutureView(id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold border ${futureView===id?'bg-white text-rose-600 border-white':'bg-white/10 text-white border-white/30 hover:bg-white/20'}`}>{label}</button>
                        ))}
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 p-4 bg-slate-50 border-b border-slate-200">
                      <div className="bg-white border border-slate-200 rounded-xl p-3"><p className="text-[10px] uppercase font-black text-slate-400">Próximos 7 dias</p><p className="text-lg font-black text-slate-800">R$ {futureSummary.week.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div>
                      <div className="bg-white border border-slate-200 rounded-xl p-3"><p className="text-[10px] uppercase font-black text-slate-400">Próximo mês</p><p className="text-lg font-black text-slate-800">R$ {futureSummary.month.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div>
                      <div className="bg-white border border-slate-200 rounded-xl p-3"><p className="text-[10px] uppercase font-black text-slate-400">Próximo ano</p><p className="text-lg font-black text-slate-800">R$ {futureSummary.year.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div>
                    </div>

                    <form id="future-expense-form" onSubmit={handleSaveFutureExpense} className="p-4 grid grid-cols-1 md:grid-cols-2 xl:grid-cols-6 gap-3 border-b border-slate-200">
                      <div className="xl:col-span-2"><label className="text-[10px] font-black uppercase text-slate-500">Despesa prevista</label><input value={futureForm.description} onChange={e=>setFutureForm(p=>({...p,description:e.target.value}))} placeholder="Ex.: IPVA, botijão de gás, manutenção" className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" /></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Valor estimado</label><input type="number" step="0.01" min="0" value={futureForm.amount} onChange={e=>setFutureForm(p=>({...p,amount:e.target.value}))} placeholder="0,00" className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" /></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Data prevista</label><input type="text" inputMode="numeric" maxLength="10" placeholder="DD/MM/AAAA" value={futureForm.date} onChange={e=>setFutureForm(p=>({...p,date:maskDateBRFull(e.target.value)}))} className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono" /></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Categoria</label><select value={futureForm.category} onChange={e=>setFutureForm(p=>({...p,category:e.target.value}))} className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white">{categories.filter(c=>c.type!=='receita').map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                      <div><label className="text-[10px] font-black uppercase text-slate-500">Prioridade</label><select value={futureForm.priority} onChange={e=>setFutureForm(p=>({...p,priority:e.target.value}))} className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm bg-white"><option value="alta">Alta</option><option value="media">Média</option><option value="baixa">Baixa</option></select></div>
                      <div className="md:col-span-2 xl:col-span-5"><label className="text-[10px] font-black uppercase text-slate-500">Observação</label><input value={futureForm.notes} onChange={e=>setFutureForm(p=>({...p,notes:e.target.value}))} placeholder="Opcional" className="mt-1 w-full border border-slate-300 rounded-xl px-3 py-2 text-sm" /></div>
                      <div className="flex gap-2 items-end"><button type="submit" className="flex-1 px-4 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs font-black">{futureEditingId?'Salvar alteração':'Adicionar'}</button>{futureEditingId&&<button type="button" onClick={resetFutureForm} className="px-3 py-2.5 border border-slate-300 rounded-xl text-xs font-bold">Cancelar</button>}</div>
                    </form>

                    <div className="p-4">
                      <div className="flex items-center justify-between gap-3 mb-3"><div><h3 className="font-black text-slate-800">{futureView==='week'?'Próximos 7 dias':futureView==='month'?'Próximo mês':futureView==='year'?'Próximo ano':'Todas as despesas futuras'}</h3><p className="text-xs text-slate-400">{futureWindow.items.length} item(ns)</p></div><div className="text-right"><p className="text-[10px] uppercase font-black text-slate-400">Total previsto</p><p className="font-black text-rose-600">R$ {futureWindow.total.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div></div>
                      {futureWindow.items.length === 0 ? (
                        <div className="py-10 text-center text-sm text-slate-400">Nenhuma despesa futura nesse período.</div>
                      ) : (
                        <div className="space-y-2">{futureWindow.items.map(item => {
                          const cat=categories.find(c=>c.id===item.category);
                          const pClass=item.priority==='alta'?'bg-rose-100 text-rose-700':item.priority==='baixa'?'bg-slate-100 text-slate-600':'bg-amber-100 text-amber-700';
                          return <div key={item.id} className="grid grid-cols-1 md:grid-cols-[110px_1fr_150px_130px_auto] gap-3 items-center border border-slate-200 rounded-xl p-3 hover:bg-slate-50">
                            <div><p className="font-black text-slate-800 text-xs">{formatToDDMMAAAA(item.date)}</p><span className={`inline-flex mt-1 px-2 py-0.5 rounded-full text-[9px] font-black ${pClass}`}>{item.priority.toUpperCase()}</span></div>
                            <div><p className="font-black text-slate-800 text-sm">{item.description}</p><p className="text-[10px] text-slate-400">{cat?.name || 'Outros'}{item.notes ? ` • ${item.notes}` : ''}</p></div>
                            <div className="md:text-right"><p className="text-[10px] uppercase font-black text-slate-400">Valor estimado</p><p className="font-black text-rose-600">R$ {(parseFloat(item.amount)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</p></div>
                            <div className="md:text-right"><p className="text-[10px] uppercase font-black text-slate-400">Impacto</p><p className="text-xs font-bold text-slate-600">Fora do orçamento</p></div>
                            <div className="flex justify-end gap-1"><button onClick={()=>handleEditFutureExpense(item)} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600" title="Editar"><Edit3 className="w-4 h-4"/></button><button onClick={()=>handleDeleteFutureExpense(item.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600" title="Excluir"><Trash2 className="w-4 h-4"/></button></div>
                          </div>;
                        })}</div>
                      )}
                    </div>
                  </div>
                  <div className="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800"><strong>Importante:</strong> estes valores são apenas previsões e não entram nas despesas realizadas nem no orçamento mensal até você cadastrá-los em Lançamentos.</div>
                </div>
              )}

              {/* ABA OBJETIVO X REALIZADO - VISUAL MODERNO */}
              {activeTab === 'goals' && (() => {
                const expenseGoalSegments = goalSegments.filter(s => s.categoryId);
                const now = new Date();
                const currentMonthNum = goalYear === now.getFullYear() ? now.getMonth() + 1 : 12;
                const sixMonthStart = Math.max(1, currentMonthNum - 5);
                const visibleGoalMonths = goalMonthView === 'all' ? goalMonths : goalMonths.filter(m => m.num >= sixMonthStart && m.num <= currentMonthNum);
                const activeGoalRows = expenseGoalSegments.filter(seg => goalMonths.some(m => getGoalValue(seg.id, m.num) > 0));
                const referenceRows = (activeGoalRows.length ? activeGoalRows : expenseGoalSegments).map(seg => {
                  const objective = getGoalValue(seg.id, currentMonthNum);
                  const realized = getGoalRealized(seg, currentMonthNum);
                  const pct = objective > 0 ? (realized / objective) * 100 : 0;
                  return { seg, objective, realized, pct };
                });
                const within = referenceRows.filter(r => r.objective > 0 && r.pct < 80).length;
                const attention = referenceRows.filter(r => r.objective > 0 && r.pct >= 80 && r.pct <= 100).length;
                const over = referenceRows.filter(r => r.objective > 0 && r.pct > 100).length;
                const totalActive = activeGoalRows.length;
                const monthLabel = goalMonths[currentMonthNum - 1]?.label || '';
                const money = v => (parseFloat(v) || 0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
                const shortMoney = v => (parseFloat(v) || 0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:0});
                const pctClass = pct => pct > 100 ? 'meta-red' : pct >= 80 ? 'meta-amber' : 'meta-green';
                const goalExpenseRowsFor = (segment) => {
                  if (!segment?.categoryId) return [];
                  const visibleMonthNums = new Set(visibleGoalMonths.map(m => m.num));
                  return transactions.filter(t => {
                    if (t.type !== 'expense' || !isPaidTransaction(t) || t.category !== segment.categoryId) return false;
                    const refDate = t.paymentDate || t.dueDate || t.date || t.data || '';
                    const match = String(refDate).match(/^(\d{4})-(\d{2})/);
                    if (!match || parseInt(match[1],10) !== goalYear) return false;
                    const txMonth = parseInt(match[2],10);
                    if (goalDetailMonth !== 'all') return txMonth === parseInt(goalDetailMonth,10);
                    return visibleMonthNums.has(txMonth);
                  }).sort((a,b)=>String(b.paymentDate||b.dueDate||b.date||'').localeCompare(String(a.paymentDate||a.dueDate||a.date||'')));
                };
                const rowIcon = label => {
                  const t = String(label || '').toLowerCase();
                  if (t.includes('aliment')) return '🍴';
                  if (t.includes('transporte') || t.includes('combust')) return '🚙';
                  if (t.includes('moradia') || t.includes('renda') || t.includes('luz')) return '🏠';
                  if (t.includes('saúde') || t.includes('medic')) return '❤';
                  if (t.includes('lazer') || t.includes('viagem')) return '🎮';
                  if (t.includes('educa')) return '🎓';
                  if (t.includes('restaurante') || t.includes('delivery')) return '🍽';
                  if (t.includes('assinatura') || t.includes('stream')) return '▶';
                  if (t.includes('compra') || t.includes('vest')) return '🛍';
                  if (t.includes('invest')) return '📈';
                  if (t.includes('dívida') || t.includes('emprest')) return '💳';
                  return '•••';
                };
                return (
                <div className="meta-modern-page space-y-4 animate-fade-in">
                  <div className="meta-hero">
                    <div className="flex items-center gap-4 min-w-0">
                      <div className="meta-hero-icon"><Target className="w-7 h-7"/></div>
                      <div className="min-w-0">
                        <h2>Metas</h2>
                        <p>Defina seus limites de gastos por categoria e acompanhe seu progresso mês a mês.</p>
                      </div>
                    </div>
                    <div className="meta-year-picker">
                      <button onClick={() => setGoalYear(y => y - 1)} title="Ano anterior"><ChevronLeft className="w-5 h-5"/></button>
                      <strong>{goalYear}</strong>
                      <button onClick={() => setGoalYear(y => y + 1)} title="Próximo ano"><ChevronRight className="w-5 h-5"/></button>
                    </div>
                  </div>

                  <div className="meta-summary-grid">
                    <div className="meta-summary-card meta-summary-blue"><div className="meta-summary-icon"><Target className="w-6 h-6"/></div><div><span>Total de Metas</span><strong>{totalActive}</strong><small>categorias ativas</small></div></div>
                    <div className="meta-summary-card meta-summary-green"><div className="meta-summary-icon"><CheckCircle className="w-6 h-6"/></div><div><span>Dentro do Limite</span><strong>{within}</strong><small>{totalActive ? Math.round(within/totalActive*100) : 0}% das categorias</small></div></div>
                    <div className="meta-summary-card meta-summary-amber"><div className="meta-summary-icon"><AlertCircle className="w-6 h-6"/></div><div><span>Atenção</span><strong>{attention}</strong><small>entre 80% e 100%</small></div></div>
                    <div className="meta-summary-card meta-summary-red"><div className="meta-summary-icon"><X className="w-6 h-6"/></div><div><span>Acima do Limite</span><strong>{over}</strong><small>precisam de ajuste</small></div></div>
                  </div>

                  <div className="meta-main-card">
                    <div className="meta-main-head">
                      <div className="flex items-center gap-3"><div className="meta-head-icon"><Target className="w-5 h-5"/></div><div><h3>Acompanhamento das Metas</h3><p>Valores realizados em reais (R$) • clique na categoria para ver os gastos</p></div></div>
                      <div className="meta-head-actions">
                        <select value={goalMonthView} onChange={e=>setGoalMonthView(e.target.value)}>
                          <option value="6">Últimos 6 meses</option>
                          <option value="all">Todos os meses</option>
                        </select>
                        <button onClick={() => setShowGoalEditors(v => !v)}><Edit3 className="w-4 h-4"/> {showGoalEditors ? 'Ocultar Metas' : 'Editar Metas'}</button>
                      </div>
                    </div>
                    <div id="meta-table-scroll" className="meta-table-wrap overflow-x-auto">
                      <table className={`meta-table ${goalMonthView === 'all' ? 'meta-all-months' : 'meta-six-months'}`}>
                        <thead><tr><th className="meta-cat-col">Categoria</th>{visibleGoalMonths.map(m=><th key={m.num}>{m.label.charAt(0)+m.label.slice(1).toLowerCase()}</th>)}<th>Total</th></tr></thead>
                        <tbody>
                          {expenseGoalSegments.map((segment) => {
                            const periodRealized = visibleGoalMonths.reduce((sum,m)=>sum+getGoalRealized(segment,m.num),0);
                            const periodObjective = visibleGoalMonths.reduce((sum,m)=>sum+getGoalValue(segment.id,m.num),0);
                            const periodPct = periodObjective > 0 ? periodRealized/periodObjective*100 : 0;
                            const currentGoal = getGoalValue(segment.id,currentMonthNum);
                            const detailRows = goalExpandedCategoryId === segment.id ? goalExpenseRowsFor(segment) : [];
                            return <React.Fragment key={segment.id}>
                              <tr>
                                <td className="meta-cat-col">
                                  <button className="meta-cat-button" onClick={() => { setGoalExpandedCategoryId(id => id === segment.id ? null : segment.id); setGoalDetailMonth('all'); }}>
                                    <div className="meta-cat-cell"><span className="meta-cat-icon">{rowIcon(segment.label)}</span><div><b>{segment.label}</b>{showGoalEditors && <span>Meta {monthLabel}: R$ {money(currentGoal)}</span>}</div><span className="meta-cat-toggle">{goalExpandedCategoryId === segment.id ? 'Fechar ▲' : 'Ver gastos ›'}</span></div>
                                  </button>
                                </td>
                                {visibleGoalMonths.map(m=>{
                                  const objective=getGoalValue(segment.id,m.num);
                                  const realized=getGoalRealized(segment,m.num);
                                  const pct=objective>0?realized/objective*100:0;
                                  const cls=pctClass(pct);
                                  return <td key={m.num}>
                                    <div className="meta-cell-value" title="Realizado">{realized>0?shortMoney(realized):'—'}</div>
                                    {objective>0 && <div className={`meta-cell-pct ${cls}`}>{Math.round(pct)}%</div>}
                                    {objective>0 && <div className="meta-mini-bar"><i className={cls} style={{width:`${Math.min(Math.max(pct,0),100)}%`}}></i></div>}
                                    {showGoalEditors && <div className="meta-edit-row"><span>Meta</span><input type="number" step="0.01" min="0" value={monthlyGoals[goalKey(segment.id,m.num)] ?? ''} onChange={e=>setGoalValue(segment.id,m.num,e.target.value)} placeholder="0"/></div>}
                                  </td>
                                })}
                                <td className="meta-total-cell"><b>{shortMoney(periodRealized)}</b>{periodObjective>0 && <span className={pctClass(periodPct)}>{Math.round(periodPct)}%</span>}</td>
                              </tr>
                              {goalExpandedCategoryId === segment.id && <tr><td colSpan={visibleGoalMonths.length + 2} className="!p-0 !bg-white"><div className="meta-expanded-card">
                                <div className="meta-expanded-head">
                                  <div><h4>Gastos de {segment.label}</h4><p>{goalDetailMonth === 'all' ? (goalMonthView === 'all' ? `Todos os meses de ${goalYear}` : `Últimos ${visibleGoalMonths.length} meses`) : `${goalMonths[parseInt(goalDetailMonth,10)-1]?.label || ''} de ${goalYear}`} • {detailRows.length} lançamento(s)</p></div>
                                  <div className="meta-expanded-actions">
                                    <select value={goalDetailMonth} onChange={e=>setGoalDetailMonth(e.target.value)} title="Filtrar gastos por mês">
                                      <option value="all">Todos os meses</option>
                                      {goalMonths.map(m=><option key={m.num} value={String(m.num)}>{m.label}</option>)}
                                    </select>
                                    <button className="meta-expanded-close" onClick={()=>setGoalExpandedCategoryId(null)}>Fechar</button>
                                  </div>
                                </div>
                                {detailRows.length===0 ? <div className="py-4 text-center text-xs text-slate-400">Nenhum gasto confirmado neste período.</div> : <div className="meta-expense-list">{detailRows.map(t=>{const refDate=t.paymentDate||t.dueDate||t.date||t.data||'';return <div key={t.id} className="meta-expense-item"><span>{formatToDDMMAAAA(refDate)}</span><div><b>{t.description||t.local||t.produto||'Lançamento'}</b><span>{categories.find(c=>c.id===t.category)?.name||segment.label}</span></div><span>{t.bank||t.payerBank||'—'}</span><span className="meta-expense-amount">R$ {(parseFloat(t.amount)||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}</span><button type="button" className="meta-expense-edit" onClick={()=>handleEditClick(t)} title="Editar este lançamento"><Edit3 className="w-3.5 h-3.5"/> Editar</button></div>})}</div>}
                              </div></td></tr>}
                            </React.Fragment>
                          })}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div className="meta-bottom-grid">
                    <div className="meta-bottom-card">
                      <div className="meta-bottom-title"><Target className="w-5 h-5"/> Progresso por Categoria</div>
                      <div className="space-y-3">
                        {referenceRows.filter(r=>r.objective>0).sort((a,b)=>b.pct-a.pct).slice(0,8).map(({seg,pct})=><div key={seg.id} className="meta-progress-row"><span className="meta-progress-icon">{rowIcon(seg.label)}</span><b title={seg.label}>{seg.label}</b><div className="meta-progress-track"><i className={pctClass(pct)} style={{width:`${Math.min(pct,100)}%`}}></i></div><strong>{Math.round(pct)}%</strong></div>)}
                        {referenceRows.filter(r=>r.objective>0).length===0 && <p className="text-sm text-slate-400 py-5 text-center">Cadastre uma meta para começar o acompanhamento.</p>}
                      </div>
                    </div>
                    <div className="meta-bottom-card">
                      <div className="meta-bottom-title"><AlertCircle className="w-5 h-5"/> Dicas e Informações</div>
                      <div className="meta-tips">
                        <p className="tip-ok"><CheckCircle/> Você está dentro da meta em <b>{within}</b> categoria(s).</p>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5 text-xs truncate">Fechamento</label>
                      <input type="number" min="1" max="31" required value={cardFormData.fechamento} onChange={(e) => setCardFormData(p => ({ ...p, fechamento: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-800 text-center focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                      <label className="block font-bold text-emerald-600 mb-1.5 text-xs truncate">Vencimento</label>
                      <input type="number" min="1" max="31" required value={cardFormData.vencimento} onChange={(e) => setCardFormData(p => ({ ...p, vencimento: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-800 text-center focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5 text-xs truncate">Limite Total (R$)</label>
                      <input type="number" step="0.01" value={cardFormData.limite} onChange={(e) => setCardFormData(p => ({ ...p, limite: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-800 text-center focus:outline-none focus:border-indigo-500" placeholder="Opcional" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5 text-xs">Cores do Cartão</label>
                    <div className="flex flex-col gap-3">
                      <select onChange={(e) => {
                        if(e.target.value && BANK_COLORS[e.target.value]) {
                          setCardFormData(p => ({ ...p, color1: BANK_COLORS[e.target.value].c1, color2: BANK_COLORS[e.target.value].c2 }));
                        }
                      }} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-800 text-xs focus:outline-none focus:border-indigo-500">
                        <option value="">Escolher Cor do Banco...</option>
                        {Object.keys(BANK_COLORS).map(b => <option key={b} value={b}>{b}</option>)}
                      </select>
                      
                      <div className="flex gap-2 items-center">
                        <span className="text-xs text-slate-500 font-medium">Ou manual:</span>
                        <input type="color" value={cardFormData.color1} onChange={(e) => setCardFormData(p => ({ ...p, color1: e.target.value }))} className="w-10 h-8 cursor-pointer rounded bg-transparent border-0 p-0" />
                        <span className="text-slate-400 text-xs">até</span>
                        <input type="color" value={cardFormData.color2} onChange={(e) => setCardFormData(p => ({ ...p, color2: e.target.value }))} className="w-10 h-8 cursor-pointer rounded bg-transparent border-0 p-0" />
                      </div>
                    </div>
                  </div>
                  
                  <div className="flex gap-3 pt-4 border-t border-slate-200 mt-2">
                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition">Cancelar</button>
                    <button type="submit" className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDIÇÃO FUTUROS */}
          {futureEditsModal.isOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-md w-full p-6">
                <div className="flex items-center gap-3 mb-4">
                  <div className="bg-amber-100 text-amber-600 p-2 rounded-full">
                    <AlertCircle className="w-6 h-6" />
                  </div>
                  <h3 className="text-lg font-black text-slate-900">Atualizar Lançamentos Futuros?</h3>
                </div>
                <p className="text-sm text-slate-600 mb-3 font-medium">
                  Foram encontrados <strong>{futureEditsModal.futureTxs.length}</strong> lançamentos futuros com a mesma série ou com o mesmo valor e características. Marque quais também deverão receber as alterações.
                </p>

                <div className="flex items-center justify-between gap-2 mb-3 text-xs">
                  <span className="font-bold text-slate-700">{futureEditsModal.selectedIds.length} selecionado(s)</span>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setFutureEditsModal(prev => ({...prev, selectedIds: prev.futureTxs.map(t => t.id)}))} className="text-indigo-600 font-bold hover:underline">Marcar todos</button>
                    <button type="button" onClick={() => setFutureEditsModal(prev => ({...prev, selectedIds: []}))} className="text-slate-500 font-bold hover:underline">Desmarcar</button>
                  </div>
                </div>
                
                <div className="max-h-72 overflow-y-auto mb-6 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs custom-scrollbar">
                  {futureEditsModal.futureTxs.map((t, i) => {
                    const checked = futureEditsModal.selectedIds.includes(t.id);
                    return (
                    <label key={t.id || i} className={`flex gap-3 py-3 border-b border-slate-200 last:border-0 cursor-pointer rounded-lg px-2 ${checked ? 'bg-emerald-50' : ''}`}>
                      <input
                        type="checkbox"
                        checked={checked}
                        onChange={() => setFutureEditsModal(prev => ({
                          ...prev,
                          selectedIds: checked ? prev.selectedIds.filter(id => id !== t.id) : [...prev.selectedIds, t.id]
                        }))}
                        className="mt-1 h-4 w-4 accent-emerald-600"
                      />
                      <div className="min-w-0 flex-1">
                        <div className="flex justify-between items-start gap-3">
                          <span className="font-semibold text-slate-700">{t.description}</span>
                          <span className="font-bold text-slate-800 whitespace-nowrap">R$ {parseFloat(t.amount).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                        </div>
                        <div className="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-slate-500">
                          <span>Vencimento: <strong>{formatToDDMMAAAA(t.dueDate)}</strong></span>
                          {!isPaidTransaction(t) && getDueStatus(t.dueDate, false) && (
                            <span className={`font-bold ${getDueStatus(t.dueDate, false).className.split(' ')[0]}`}>
                              {getDueStatus(t.dueDate, false).text}
                            </span>
                          )}
                          <span>Banco: <strong>{t.bank || 'Não informado'}</strong></span>
                          {t.installmentsInfo && <span>Parcela: <strong>{t.installmentsInfo.current}/{t.installmentsInfo.total}</strong></span>}
                          <span>Status: <strong>{isPaidTransaction(t) ? 'Pago' : 'Pendente'}</strong></span>
                        </div>
                        <div className="mt-1 font-bold text-indigo-600">Encontrado por: {t.matchReason}</div>
                      </div>
                    </label>
                  )})}
                </div>

                <div className="flex flex-col gap-2">
                  <button onClick={() => handleSaveTransaction(null, 'selected')} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl text-sm font-bold transition shadow-md">
                    Atualizar este + selecionados ({futureEditsModal.selectedIds.length})
                  </button>
                  <button onClick={() => handleSaveTransaction(null, 'current')} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl text-sm font-bold transition">
                    Alterar apenas este lançamento
                  </button>
                  <button type="button" onClick={() => setFutureEditsModal({ isOpen: false, pendingFormData: null, futureTxs: [], selectedIds: [] })} className="w-full text-slate-400 py-2 text-xs font-bold hover:text-slate-600">
                    Cancelar edição
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL EXTRATO */}
          {extratoModal.isOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-3xl w-full flex flex-col max-h-[90vh]">
                <div className="p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-lg">Extrato: {extratoModal.bankName}</h3>
                    <p className="text-xs text-slate-500 mt-1">
                      {filterMonth === 'all' ? 'Todo o histórico' : 
                       filterMonth === 'custom' ? `De ${formatToDDMMAAAA(customStartDate)} a ${formatToDDMMAAAA(customEndDate)}` : 
                       `Mês: ${filterMonth}`}
                    </p>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={() => handlePrintExtrato('portrait')} className="flex items-center gap-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">
                      <Printer className="w-3.5 h-3.5" /> Imprimir
                    </button>
                    <button onClick={() => setExtratoModal({ isOpen: false, bankName: null })} className="text-slate-400 hover:text-slate-800 bg-white border border-slate-200 p-1.5 rounded-lg shadow-sm"><X className="h-5 w-5" /></button>
                  </div>
                </div>
                
                <div className="p-5 flex gap-4 bg-white border-b border-slate-100">
                  <div className="flex-1 bg-emerald-50 rounded-xl p-3 border border-emerald-100">
                    <span className="text-[10px] font-bold text-emerald-600 uppercase">Entradas</span>
                    <p className="text-lg font-black text-emerald-700">R$ {extratoTotals.inTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                  </div>
                  <div className="flex-1 bg-rose-50 rounded-xl p-3 border border-rose-100">
                    <span className="text-[10px] font-bold text-rose-600 uppercase">Saídas</span>
                    <p className="text-lg font-black text-rose-700">R$ {extratoTotals.outTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                  </div>
                  <div className="flex-1 bg-slate-100 rounded-xl p-3 border border-slate-200">
                    <span className="text-[10px] font-bold text-slate-600 uppercase">Balanço</span>
                    <p className={`text-lg font-black ${extratoTotals.inTotal - extratoTotals.outTotal >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}>
                      R$ {(extratoTotals.inTotal - extratoTotals.outTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                    </p>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-0">
                  {extratoTransactions.length === 0 ? (
                    <div className="py-12 flex flex-col items-center justify-center text-slate-400">
                      <FileText className="h-10 w-10 text-slate-300 mb-2" />
                      <p className="font-medium text-sm">Nenhuma movimentação encontrada.</p>
                    </div>
                  ) : (
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 sticky top-0 border-b border-slate-200">
                        <tr>
                          <th className="px-6 py-3 font-bold text-xs text-slate-500 uppercase">Data / Descrição</th>
                          <th className="px-6 py-3 font-bold text-xs text-slate-500 uppercase">Tipo</th>
                          <th className="px-6 py-3 font-bold text-xs text-slate-500 uppercase text-right">Valor</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {extratoTransactions.map(t => {
                          const isTransferIn = t.type === 'transfer' && t.destinationBank === extratoModal.bankName;
                          const isTransferOut = t.type === 'transfer' && t.bank === extratoModal.bankName;
                          const displayType = t.type === 'income' || isTransferIn ? 'Entrada' : 'Saída';
                          const amountColor = displayType === 'Entrada' ? 'text-emerald-600' : 'text-rose-600';
                          const sign = displayType === 'Entrada' ? '+' : '-';

                          return (
                            <tr key={t.id} className="hover:bg-slate-50 transition-colors">
                              <td className="px-6 py-3">
                                <span className="font-mono text-xs text-slate-500 mr-3">{formatToDDMMAAAA(t.dueDate)}</span>
                                <span className="font-bold text-slate-800">{t.description}</span>
                                {t.type === 'transfer' && (
                                  <span className="block text-[10px] text-slate-500 font-medium mt-0.5">
                                    {isTransferIn ? `De: ${t.bank}` : `Para: ${t.destinationBank}`}
                                  </span>
                                )}
                              </td>
                              <td className="px-6 py-3">
                                <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${
                                  displayType === 'Entrada' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                                }`}>
                                  {displayType}
                                </span>
                              </td>
                              <td className={`px-6 py-3 text-right font-black text-sm whitespace-nowrap ${amountColor}`}>
                                {sign} R$ {parseFloat(t.amount).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
