          valorTotal: String(expense.valorTotal),
          parcelas: String(expense.parcelas).split(' ')[0],
          valorParcela: String(expense.valorParcela),
          tipoLancamento: expense.tipoLancamento || 'cartao'
        });
        setIsPmModalOpen(true);
      };

      const resetPmForm = () => {
        setEditingPmExpense(null);
        const defaultPaymentBank = banks.includes('Santander') ? 'Santander' : (banks[0] || '');
        setPmFormData({
          local: '',
          produto: '',
          comprador: 'Claudinei',
          pagamento: defaultPaymentBank,
          data: new Date().toISOString().split('T')[0],
          vencimento: new Date().toISOString().split('T')[0],
          valorTotal: '',
          parcelas: '1',
          valorParcela: '',
          tipoLancamento: 'cartao'
        });
      };

      const handlePmTotalChange = (val) => {
        setPmFormData(p => {
          const num = parseInt(p.parcelas);
          return {
            ...p,
            valorTotal: val,
            valorParcela: num && val ? (parseFloat(val) / num).toFixed(2) : ''
          };
        });
      };

      const handlePmParcelasChange = (num) => {
        setPmFormData(p => {
          const tot = parseFloat(p.valorTotal);
          return {
            ...p,
            parcelas: num,
            valorParcela: tot && num ? (tot / parseInt(num)).toFixed(2) : ''
          };
        });
      };

      // --- CARDS LOGIC ---
      const handleSaveCard = (e) => {
        e.preventDefault();
        const gradient = `linear-gradient(135deg, ${cardFormData.color1} 0%, ${cardFormData.color2} 100%)`;
        const id = editingCard ? editingCard.id : 'cc-' + Date.now();
        const newCard = {
          id,
          name: cardFormData.name,
          titular: cardFormData.titular,
          last4: String(cardFormData.last4 || '').replace(/\D/g, '').slice(-4),
          fechamento: parseInt(cardFormData.fechamento),
          vencimento: parseInt(cardFormData.vencimento),
          limite: parseFloat(cardFormData.limite) || 0,
          gradient
        };

        const updatedCards = [...myCards];
        if (editingCard) {
          const idx = updatedCards.findIndex(c => c.id === id);
          if (idx > -1) updatedCards[idx] = newCard;
        } else {
          updatedCards.push(newCard);
        }

        setMyCards(updatedCards);
        setIsCardModalOpen(false);
        setEditingCard(null);
        showToast("Cartão guardado com sucesso!");
        saveSettingsToCloud(banks, categories, budgets, updatedCards);
      };

      const handleDeleteCard = (id) => {
        const updatedCards = myCards.filter(c => c.id !== id);
        setMyCards(updatedCards);
        showToast("Cartão removido!");
        saveSettingsToCloud(banks, categories, budgets, updatedCards);
      };

      const handleEditCardClick = (card) => {
        setEditingCard(card);
        const colors = card.gradient.match(/#([a-fA-F0-9]{6}|[a-fA-F0-9]{3})/g) || ['#3b82f6', '#1d4ed8'];
        setCardFormData({
          name: card.name,
          titular: card.titular || '',
          last4: card.last4 || '',
          fechamento: card.fechamento || 1,
          vencimento: card.vencimento || 10,
          limite: card.limite || '',
          color1: colors[0] || '#3b82f6',
          color2: colors[1] || '#1d4ed8'
        });
        setIsCardModalOpen(true);
      };

      const resetCardForm = () => {
        setEditingCard(null);
        setCardFormData({
          name: '',
          titular: 'Titular',
          last4: '',
          fechamento: 1,
          vencimento: 10,
          limite: '',
          color1: '#8b5cf6',
          color2: '#4c1d95'
        });
      };

      // --- DERIVED DATA ---
      const isTransactionInPeriod = (t) => {
        if (filterMonth === 'all') return true;
        if (filterMonth === 'custom') {
          const txDate = t.dueDate;
          if (customStartDate && txDate < customStartDate) return false;
          if (customEndDate && txDate > customEndDate) return false;
          return true;
        }
        return t.dueDate.startsWith(filterMonth);
      };

      const balances = useMemo(() => {
        const bankBalances = {};
        banks.forEach(b => { bankBalances[b] = 0; });
        let totalAllTimeConfirmedIncome = 0;
        let totalAllTimeConfirmedExpense = 0;

        transactions.forEach(t => {
          if (!isTransactionInPeriod(t)) return;

          const amt = parseFloat(t.amount) || 0;
          if (isPaidTransaction(t)) {
            if (t.type === 'income') {
              totalAllTimeConfirmedIncome += amt;
              bankBalances[t.bank] = (bankBalances[t.bank] || 0) + amt;
            } else if (t.type === 'expense') {
              totalAllTimeConfirmedExpense += amt;
              bankBalances[t.bank] = (bankBalances[t.bank] || 0) - amt;
            } else if (t.type === 'transfer') {
              bankBalances[t.bank] = (bankBalances[t.bank] || 0) - amt;
              if (t.destinationBank) {
                bankBalances[t.destinationBank] = (bankBalances[t.destinationBank] || 0) + amt;
              }
            }
          }
        });

        return { bankBalances, currentRealBalance: totalAllTimeConfirmedIncome - totalAllTimeConfirmedExpense };
      }, [transactions, banks, filterMonth, customStartDate, customEndDate]);

      const bancosSaldos = useMemo(() => {
        if (showAllBanks) return banks;
        
        // Filtra para mostrar APENAS os bancos com saldo real diferente de zero (positivo ou negativo)
        return banks.filter(b => {
          const val = balances.bankBalances[b] || 0;
          return Math.abs(val) >= 0.01; // Remove os que têm R$ 0,00
        });
      }, [banks, balances, showAllBanks]);

      // --- LÓGICA EXTRATO (Agora obedece ao filtro de Período) ---
      const extratoTransactions = useMemo(() => {
        if (!extratoModal.bankName) return [];
        const b = extratoModal.bankName;
        const filtered = transactions.filter(t => {
          const matchBank = t.bank === b || (t.type === 'transfer' && t.destinationBank === b);
          const matchPeriod = isTransactionInPeriod(t);
          return matchBank && matchPeriod;
        });
        return filtered.sort((a, b) => b.dueDate.localeCompare(a.dueDate));
      }, [transactions, extratoModal.bankName, filterMonth, customStartDate, customEndDate]);

      const extratoTotals = useMemo(() => {
        let inTotal = 0;
        let outTotal = 0;
        extratoTransactions.forEach(t => {
          if (t.type === 'income') inTotal += parseFloat(t.amount);
          else if (t.type === 'expense') outTotal += parseFloat(t.amount);
          else if (t.type === 'transfer') {
            if (t.bank === extratoModal.bankName) outTotal += parseFloat(t.amount); // Saiu deste banco
            if (t.destinationBank === extratoModal.bankName) inTotal += parseFloat(t.amount); // Entrou neste banco
          }
        });
        return { inTotal, outTotal };
      }, [extratoTransactions, extratoModal.bankName]);

      const resumoData = useMemo(() => {
        let pmTotal = 0;
        const pmGrouped = {};

        let filterYear = null;
        let filterMonthNum = null;

        if (filterMonth !== 'all' && filterMonth !== 'custom') {
          const parts = filterMonth.split('-');
          filterYear = parseInt(parts[0]);
          filterMonthNum = parseInt(parts[1]);
        } else {
            const d = new Date();
            filterYear = d.getFullYear();
            filterMonthNum = d.getMonth() + 1;
        }

        const targetMonthKey = `${filterYear}-${String(filterMonthNum).padStart(2, '0')}`;

        pmExpenses.forEach(item => {
            const info = getInstallmentInfo(item, targetMonthKey, myCards);
            if (info) {
              pmTotal += info.value;
              if (!pmGrouped[item.pagamento]) {
                pmGrouped[item.pagamento] = 0;
              }
              pmGrouped[item.pagamento] += info.value;
            }
        });

        const normalizeCardText = (value) => String(value || '')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().trim();

        // Monta a lista de faturas a partir de TODOS os cartões cadastrados + cartões com compras.
        // Assim, valores salvos da fatura não somem do Painel mesmo quando não há compra PayManager no mês.
        const invoiceCardNames = Array.from(new Set([
          ...myCards.map(c => c.name).filter(Boolean),
          ...Object.keys(pmGrouped)
        ]));

        const pmList = invoiceCardNames.map(cardName => {
          const cardDef = myCards.find(c => normalizeCardText(c.name) === normalizeCardText(cardName));
          const cardNorm = normalizeCardText(cardName);
          const registeredTotal = parseFloat(pmGrouped[cardName]) || 0;

          // Pagamento da fatura: SOMENTE lançamentos confirmados na categoria
          // "Cartão de Crédito" e com o campo "Cartão associado" igual a este cartão.
          // Banco pagador e descrição nunca identificam a fatura.
          const paymentTransactions = transactions.filter(t => {
            if (t.type !== 'expense' || !isPaidTransaction(t)) return false;
            const referenceDate = t.dueDate || t.paymentDate || t.date || t.data || '';
            if (String(referenceDate).slice(0, 7) !== targetMonthKey) return false;

            const categoryObj = categories.find(c => c.id === t.category);
            const categoryText = normalizeCardText(categoryObj?.name || t.category || t.categoryName);
            const isCreditCardPayment =
              categoryText.includes('cartao de credito') ||
              categoryText.includes('cartao credito') ||
              (categoryText.includes('cartao') && categoryText.includes('credito'));
            if (!isCreditCardPayment) return false;

            const explicitCard = normalizeCardText(t.associatedCard || '');
            return Boolean(explicitCard) && explicitCard === cardNorm;
          });

          const paidAmount = paymentTransactions.reduce((acc, t) => acc + (parseFloat(t.amount) || 0), 0);
          const paymentDate = paymentTransactions
            .map(t => t.paymentDate || t.dueDate || '')
            .filter(Boolean).sort().slice(-1)[0]
            || (cardDef && cardDef.faturasPagasDatas && cardDef.faturasPagasDatas[targetMonthKey])
            || '';
          const payerBanks = Array.from(new Set(paymentTransactions.map(t => t.payerBank || '').filter(Boolean)));
          const manualPaid = !!(cardDef && cardDef.faturasPagas && cardDef.faturasPagas[targetMonthKey] === true);
          const storedInvoice = cardDef?.faturasValoresInformados?.[targetMonthKey];
          const storedPaidValue = cardDef?.faturasPagasValores?.[targetMonthKey];
          const invoiceTarget = storedInvoice !== undefined && storedInvoice !== null && storedInvoice !== ''
            ? (parseFloat(storedInvoice) || 0)
            : registeredTotal;
          // Compatibilidade com faturas antigas marcadas como pagas manualmente.
          const effectivePaidAmount = paidAmount > 0
            ? paidAmount
            : (manualPaid ? (parseFloat(storedPaidValue) || invoiceTarget || 0) : 0);
          // No Painel, se existe pagamento confirmado da fatura, ela deve aparecer como PAGA.
          // Eventuais diferenças entre valor registrado e valor pago ficam para a Conferência de Faturas,
          // evitando mostrar "Parcial" ou "Vencido" no resumo quando a fatura já foi efetivamente paga.
          const hasConfirmedPayment = paymentTransactions.length > 0 || effectivePaidAmount > 0;
          const isPaid = manualPaid || hasConfirmedPayment;
          const isPartial = false;

          return {
            cardName,
            totalValue: registeredTotal,
            invoiceTarget,
            vencimentoDia: cardDef ? cardDef.vencimento : null,
            isPaid,
            isPartial,
            paidAmount: effectivePaidAmount,
            paymentDate,
            payerBanks,
            paymentTransactions,
            monthKey: targetMonthKey
          };
        });

        const pmTotalPendente = pmList
          .filter(f => !f.isPaid)
          .reduce((acc, f) => acc + (parseFloat(f.invoiceTarget || f.totalValue || 0) || 0), 0);

        // Pagamento de fatura de cartão não é uma nova conta: ele liquida uma fatura já mostrada
        // no painel de Faturas. Por isso, no Dashboard, escondemos esses lançamentos da lista "Contas"
        // e dos totais de despesas para evitar duplicidade visual e financeira. Eles continuam normalmente
        // em Lançamentos e na conferência de faturas.
        const isCreditCardPaymentTransaction = (t) => {
          if (!t || t.type !== 'expense') return false;
          const categoryObj = categories.find(c => c.id === t.category);
          const categoryText = normalizeCardText(categoryObj?.name || t.category || t.categoryName);
          const descriptionText = normalizeCardText(t.description || '');
          const explicitCard = normalizeCardText(t.associatedCard || t.cardName || t.cartao);
          return Boolean(explicitCard) ||
            categoryText.includes('cartao de credito') ||
            categoryText.includes('cartao credito') ||
            (categoryText.includes('cartao') && categoryText.includes('credito')) ||
            descriptionText.includes('cartao de credito') ||
            descriptionText.includes('cartao credito') ||
            descriptionText.startsWith('fatura ');
        };

        const dashMonthExpenses = transactions.filter(t =>
          t.type === 'expense' && isTransactionInPeriod(t) && !isCreditCardPaymentTransaction(t)
        );
        const dashMonthIncomes = transactions.filter(t => t.type === 'income' && isTransactionInPeriod(t));

        const dashTotalIn = dashMonthIncomes.reduce((acc, t) => acc + parseFloat(t.amount), 0);
        const dashTotalExp = dashMonthExpenses.reduce((acc, t) => acc + parseFloat(t.amount), 0);
        
        const dashPaidIn = dashMonthIncomes.filter(t => isPaidTransaction(t)).reduce((acc, t) => acc + parseFloat(t.amount), 0);
        const dashPaidExp = dashMonthExpenses.filter(t => isPaidTransaction(t)).reduce((acc, t) => acc + parseFloat(t.amount), 0);
        const dashPendingExp = dashMonthExpenses.filter(t => !isPaidTransaction(t)).reduce((acc, t) => acc + parseFloat(t.amount), 0);

        const totalContasFaturas = dashTotalExp + pmTotal;
        const saldoEstimado = dashTotalIn - totalContasFaturas;
        const totalPagoRecebido = dashPaidIn - dashPaidExp; 
        const restantePendente = dashPendingExp + pmTotalPendente;

        return {
          pmTotal, pmList, dashMonthExpenses, dashTotalExp,
          dashTotalIn, totalContasFaturas, saldoEstimado, totalPagoRecebido, restantePendente
        };
      }, [transactions, pmExpenses, filterMonth, customStartDate, customEndDate, myCards, categories]);

      const getDueStatus = (dateStr, isPaid = false) => {
        if (!dateStr) return null;
        if (isPaid) return { text: 'Pago', className: 'text-emerald-700 bg-emerald-50 border-emerald-100' };

        const parts = String(dateStr).split('-').map(Number);
        if (parts.length !== 3 || parts.some(Number.isNaN)) return null;

        const due = new Date(parts[0], parts[1] - 1, parts[2]);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const diffDays = Math.round((due - today) / 86400000);

        if (diffDays < 0) {
          const days = Math.abs(diffDays);
          return {
            text: `Vencido há ${days} ${days === 1 ? 'dia' : 'dias'}`,
            className: 'text-rose-700 bg-rose-50 border-rose-200'
          };
        }
        if (diffDays === 0) {
          return { text: 'Vence hoje', className: 'text-amber-700 bg-amber-50 border-amber-200' };
        }
        if (diffDays === 1) {
          return { text: 'Vence amanhã', className: 'text-amber-700 bg-amber-50 border-amber-200' };
        }
        return {
          text: `Faltam ${diffDays} dias para vencer`,
          className: diffDays <= 5
            ? 'text-amber-700 bg-amber-50 border-amber-200'
            : 'text-sky-700 bg-sky-50 border-sky-100'
        };
      };

      const getInvoiceDueDate = (monthKey, dueDay) => {
        if (!monthKey || !dueDay) return null;
        const [year, month] = monthKey.split('-').map(Number);
        if (!year || !month) return null;
        const lastDay = new Date(year, month, 0).getDate();
        const safeDay = Math.min(parseInt(dueDay) || 1, lastDay);
        return `${year}-${String(month).padStart(2, '0')}-${String(safeDay).padStart(2, '0')}`;
      };

      const handleNewPurchaseForCard = (cardOrName, monthKey = '') => {
        const card = typeof cardOrName === 'string'
          ? myCards.find(c => normalizeCardName(c.name) === normalizeCardName(cardOrName))
          : cardOrName;

        if (!card) {
          showToast('Cartão não encontrado.', 'error');
          return;
        }

        const todayIso = new Date().toISOString().split('T')[0];
        const today = new Date();
        const currentMonthKey = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`;
        const targetMonthKey = monthKey && monthKey !== 'all' ? monthKey : currentMonthKey;
        const invoiceDueDate = getInvoiceDueDate(targetMonthKey, card.vencimento) || todayIso;

        const titular = String(card.titular || '').toLowerCase();
        let comprador = 'Claudinei';
        if (titular.includes('mara')) comprador = 'Mara';
        else if (titular.includes('dependente')) comprador = 'Dependente';
        else if (titular.includes('claudinei')) comprador = 'Claudinei';

        setEditingPmExpense(null);
        setPmSelectedCard(card.name);
        setPmSelectedMonth(targetMonthKey);
        setPmFormData({
          local: '',
          produto: '',
          comprador,
          pagamento: card.name,
          data: todayIso,
          vencimento: invoiceDueDate,
          valorTotal: '',
          parcelas: '1',
          valorParcela: '',
          tipoLancamento: 'cartao'
        });
        setIsPmModalOpen(true);
      };

      const getMonthNameDisplay = (yyyy_mm) => {
        if (yyyy_mm === 'all') return 'Todo Histórico';
        if (yyyy_mm === 'custom') return 'Personalizado';
        const parts = yyyy_mm.split('-');
        if (parts.length !== 2) return yyyy_mm;
        const map = {
          '01': 'Janeiro', '02': 'Fevereiro', '03': 'Março', '04': 'Abril',
          '05': 'Maio', '06': 'Junho', '07': 'Julho', '08': 'Agosto',
          '09': 'Setembro', '10': 'Outubro', '11': 'Novembro', '12': 'Dezembro'
        };
        return `${map[parts[1]]} De ${parts[0]}`;
      };

      const filteredTransactions = useMemo(() => {
        return transactions.filter(t => {
          const matchMonth = isTransactionInPeriod(t);
          const matchType = 
            filterType === 'all' || 
            (filterType === 'income' && t.type === 'income') ||
            (filterType === 'expense' && t.type === 'expense') ||
            (filterType === 'transfer' && t.type === 'transfer') ||
            (filterType === 'pending' && !isPaidTransaction(t)) ||
            (filterType === 'paid' && isPaidTransaction(t));
          
          const matchBank = filterBank === 'all' || t.bank === filterBank || (t.type === 'transfer' && t.destinationBank === filterBank);
          const matchCategory = filterCategory === 'all' || t.category === filterCategory;
          const matchPaymentMethod = filterPaymentMethod === 'all' || t.paymentMethod === filterPaymentMethod;
          
          const searchLower = searchTerm.toLowerCase();
          const matchSearch = t.description.toLowerCase().includes(searchLower) || 
                              t.amount.toString().includes(searchLower) || 
                              (t.bank && t.bank.toLowerCase().includes(searchLower));

          return matchMonth && matchType && matchBank && matchCategory && matchPaymentMethod && matchSearch;
        });
      }, [transactions, filterMonth, filterType, filterBank, filterCategory, filterPaymentMethod, searchTerm, customStartDate, customEndDate]);

      const sortedTransactions = useMemo(() => {
        const sorted = [...filteredTransactions];
        sorted.sort((a, b) => {
          if (sortDirection === 'asc') {
            return a.dueDate.localeCompare(b.dueDate);
          } else {
            return b.dueDate.localeCompare(a.dueDate);
          }
        });
        return sorted;
      }, [filteredTransactions, sortDirection]);

      const stats = useMemo(() => {
        const monthTransactions = transactions.filter(t => isTransactionInPeriod(t));
        let totalIncome = 0, totalExpense = 0, paidIncome = 0, paidExpense = 0, pendingIncome = 0, pendingExpense = 0, creditCardTotal = 0;
        let spentNecessidades = 0, spentDesejos = 0, spentPoupanca = 0;

        monthTransactions.forEach(t => {
          const amt = parseFloat(t.amount);
          if (t.type === 'transfer') return;
          if (t.type === 'income') {
            totalIncome += amt;
            if (isPaidTransaction(t)) paidIncome += amt;
            else pendingIncome += amt;
          } else {
            totalExpense += amt;
            if (isPaidTransaction(t)) paidExpense += amt;
            else pendingExpense += amt;
            if (t.paymentMethod === 'credito') creditCardTotal += amt;

            if (t.ruleType === 'necessidade') spentNecessidades += amt;
            else if (t.ruleType === 'desejo') spentDesejos += amt;
            else if (t.ruleType === 'poupanca') spentPoupanca += amt;
          }
        });

        const netBalance = totalIncome - totalExpense;
        const pctNecessidades = totalIncome > 0 ? (spentNecessidades / totalIncome) * 100 : 0;
        const pctDesejos = totalIncome > 0 ? (spentDesejos / totalIncome) * 100 : 0;
        const pctPoupanca = totalIncome > 0 ? (spentPoupanca / totalIncome) * 100 : 0;

        return {
          totalIncome, totalExpense, paidIncome, paidExpense, pendingIncome, pendingExpense, creditCardTotal, netBalance,
          spentNecessidades, spentDesejos, spentPoupanca, pctNecessidades, pctDesejos, pctPoupanca
        };
      }, [transactions, filterMonth, customStartDate, customEndDate]);

      const categoryChartData = useMemo(() => {
        const monthExpenses = transactions.filter(t => t.type === 'expense' && isTransactionInPeriod(t));
        const group = {};
        monthExpenses.forEach(t => { group[t.category] = (group[t.category] || 0) + parseFloat(t.amount); });

        return Object.keys(group).map(catKey => {
          const catObj = categories.find(c => c.id === catKey) || { name: catKey, color: '#94A3B8' };
          return { name: catObj.name, value: parseFloat(group[catKey].toFixed(2)), color: catObj.color };
        }).sort((a, b) => b.value - a.value);
      }, [transactions, filterMonth, categories, customStartDate, customEndDate]);

      const faturasChartData = useMemo(() => {
        return resumoData.pmList.filter(item => item.totalValue > 0).map(item => {
          const cardDef = myCards.find(c => c.name === item.cardName);
          let color = '#6366f1';
          if (cardDef && cardDef.gradient) {
            const match = cardDef.gradient.match(/#([a-fA-F0-9]{6}|[a-fA-F0-9]{3})/);
            if (match) color = match[0];
          }
          return { name: item.cardName, value: item.totalValue, color };
        }).sort((a, b) => b.value - a.value);
      }, [resumoData.pmList, myCards]);

      const contasDespesasChartData = useMemo(() => {
        const group = {};
        resumoData.dashMonthExpenses.forEach(t => {
          const name = t.description;
          group[name] = (group[name] || 0) + parseFloat(t.amount);
        });

        const PALETTE = ['#ef4444', '#f97316', '#f59e0b', '#84cc16', '#10b981', '#14b8a6', '#06b6d4', '#0ea5e9', '#3b82f6', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e'];
        
        return Object.keys(group).map((desc, idx) => {
          return { 
            name: desc, 
            value: parseFloat(group[desc].toFixed(2)), 
            color: PALETTE[idx % PALETTE.length]
          };
        }).sort((a, b) => b.value - a.value);
      }, [resumoData.dashMonthExpenses]);

      const availableYears = useMemo(() => {
        const years = new Set(transactions.map(t => t.dueDate.substring(0, 4)));
        return Array.from(years).sort().reverse();
      }, [transactions]);

      const monthlyTrendData = useMemo(() => {
        const trend = {};
        
        const d = new Date();
        const currY = d.getFullYear();
        const currM = d.getMonth() + 1;
        const currentMonthStr = `${currY}-${String(currM).padStart(2, '0')}`;

        // Assegura que os meses do período escolhido aparecem no gráfico, mesmo vazios
        const ensureMonthExists = (y, m) => {
          const mStr = `${y}-${String(m).padStart(2, '0')}`;
          if (!trend[mStr]) {
            trend[mStr] = { month: mStr, displayMonth: `${String(m).padStart(2, '0')}/${y}`, Receitas: 0, Despesas: 0 };
          }
        };

        if (trendFilter === 'next6months' || trendFilter === 'next12months') {
           let limit = trendFilter === 'next6months' ? 6 : 12;
           for (let i = 0; i < limit; i++) {
              let m = currM + i;
              let y = currY;
              while (m > 12) { m -= 12; y++; }
              ensureMonthExists(y, m);
           }
        } else if (trendFilter === 'past6months') {
           for (let i = 5; i >= 0; i--) {
              let m = currM - i;
              let y = currY;
              while (m < 1) { m += 12; y--; }
              ensureMonthExists(y, m);
           }
        }

        transactions.forEach(t => {
          const m = t.dueDate.substring(0, 7);
          if (!trend[m]) {
            const [year, month] = m.split('-');
            trend[m] = { month: m, displayMonth: `${month}/${year}`, Receitas: 0, Despesas: 0 };
          }
          if (t.type === 'income') trend[m].Receitas += parseFloat(t.amount);
          else if (t.type === 'expense') trend[m].Despesas += parseFloat(t.amount);
        });

        let sorted = Object.values(trend).sort((a, b) => a.month.localeCompare(b.month));

        if (trendFilter === 'next6months') {
          sorted = sorted.filter(item => item.month >= currentMonthStr).slice(0, 6);
        } else if (trendFilter === 'next12months') {
          sorted = sorted.filter(item => item.month >= currentMonthStr).slice(0, 12);
        } else if (trendFilter === 'past6months') {
          sorted = sorted.filter(item => item.month <= currentMonthStr).slice(-6);
        } else if (trendFilter !== 'all') {
          sorted = sorted.filter(item => item.month.startsWith(trendFilter));
        }

        return sorted.map(item => ({
          ...item,
          Receitas: parseFloat(item.Receitas.toFixed(2)),
          Despesas: parseFloat(item.Despesas.toFixed(2))
        }));
      }, [transactions, trendFilter]);

      const dashboardIncomeCategoryData = useMemo(() => {
        const group = {};
        transactions.filter(t => t.type === 'income' && isTransactionInPeriod(t)).forEach(t => {
          const catObj = categories.find(c => c.id === t.category) || { name: 'Outros', color: '#22c55e' };
          const key = catObj.name;
          if (!group[key]) group[key] = { name: key, value: 0, color: catObj.color || '#22c55e' };
          group[key].value += parseFloat(t.amount) || 0;
        });
        return Object.values(group).sort((a,b) => b.value - a.value);
      }, [transactions, categories, filterMonth, customStartDate, customEndDate]);

      const dashboardRecentTransactions = useMemo(() => {
        return [...transactions]
          .filter(t => isTransactionInPeriod(t) && t.type !== 'transfer')
          .sort((a,b) => String(b.dueDate || '').localeCompare(String(a.dueDate || '')))
          .slice(0, 5);
      }, [transactions, filterMonth, customStartDate, customEndDate]);

      const dashboardUpcomingExpenses = useMemo(() => {
        return [...transactions]
          .filter(t => t.type === 'expense' && !isPaidTransaction(t) && isTransactionInPeriod(t))
          .sort((a,b) => String(a.dueDate || '').localeCompare(String(b.dueDate || '')))
          .slice(0, 5);
      }, [transactions, filterMonth, customStartDate, customEndDate]);

      const dashboardCardDetails = useMemo(() => {
        const periodTransactions = transactions.filter(t => isTransactionInPeriod(t));

        const normalizeText = (value) => String(value || '')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().trim();

        const isCreditCardPaymentTx = (t) => {
          if (!t || t.type !== 'expense') return false;
          const categoryObj = categories.find(c => c.id === t.category);
          const categoryText = normalizeText(categoryObj?.name || t.category || t.categoryName);
          const descriptionText = normalizeText(t.description || '');
          const explicitCard = normalizeText(t.associatedCard || t.cardName || t.cartao);
          return Boolean(explicitCard) ||
            categoryText.includes('cartao de credito') ||
            categoryText.includes('cartao credito') ||
            (categoryText.includes('cartao') && categoryText.includes('credito')) ||
            descriptionText.includes('cartao de credito') ||
            descriptionText.includes('cartao credito') ||
            descriptionText.startsWith('fatura ');
        };

        const incomeItems = periodTransactions
          .filter(t => t.type === 'income')
          .map(t => ({
            kind: 'transaction',
            type: 'income',
            id: t.id,
            description: t.description || 'Receita',
            date: t.dueDate || '',
            amount: parseFloat(t.amount) || 0,
            bank: t.bank || '',
            paid: isPaidTransaction(t),
            transaction: t
          }))
          .sort((a,b) => String(a.date).localeCompare(String(b.date)));

        const expenseItems = periodTransactions
          .filter(t => t.type === 'expense' && !isCreditCardPaymentTx(t))
          .map(t => ({
            kind: 'transaction',
            type: 'expense',
            id: t.id,
            description: t.description || 'Despesa',
            date: t.dueDate || '',
            amount: parseFloat(t.amount) || 0,
            bank: t.bank || '',
            paid: isPaidTransaction(t),
            transaction: t
          }))
          .sort((a,b) => String(a.date).localeCompare(String(b.date)));

        const invoiceItems = (resumoData.pmList || [])
          .filter(f => Number(f.totalValue || 0) > 0)
          .map(f => ({
            kind: 'fatura',
            type: 'expense',
            id: `dashboard_invoice_${f.cardName}_${f.monthKey}`,
            description: `Fatura ${f.cardName}`,
            date: getInvoiceDueDate(f.monthKey, f.vencimentoDia) || '',
            amount: parseFloat(f.totalValue) || 0,
            cardName: f.cardName,
            monthKey: f.monthKey,
            paid: !!f.isPaid
          }))
          .sort((a,b) => String(a.date).localeCompare(String(b.date)));

        const confirmedBalanceItems = periodTransactions
          .filter(t => isPaidTransaction(t) && (t.type === 'income' || t.type === 'expense'))
          .map(t => ({
            kind: 'transaction',
            type: t.type,
            id: t.id,
            description: t.description || (t.type === 'income' ? 'Receita' : 'Despesa'),
            date: t.paymentDate || t.dueDate || '',
            amount: parseFloat(t.amount) || 0,
            bank: t.bank || '',
            paid: true,
            transaction: t
          }))
          .sort((a,b) => String(a.date).localeCompare(String(b.date)));

        const confirmedIn = confirmedBalanceItems
          .filter(i => i.type === 'income')
          .reduce((sum,i) => sum + i.amount, 0);

        const confirmedOut = confirmedBalanceItems
          .filter(i => i.type === 'expense')
          .reduce((sum,i) => sum + i.amount, 0);

        const receivedIncome = incomeItems
          .filter(i => i.paid)
          .reduce((sum,i) => sum + i.amount, 0);

        const pendingIncome = incomeItems
          .filter(i => !i.paid)
          .reduce((sum,i) => sum + i.amount, 0);

        return {
          saldo: {
            title: 'Saldo Atual',
            subtitle: 'Movimentações confirmadas que formam o saldo do período',
            total: balances.currentRealBalance,
            tone: 'green',
            summaries: [
              { label: 'Entradas confirmadas', value: confirmedIn },
              { label: 'Saídas confirmadas', value: confirmedOut },
              { label: 'Saldo atual', value: balances.currentRealBalance }
            ],
            items: confirmedBalanceItems
          },
          receitas: {
            title: 'Receitas',
            subtitle: 'Todas as receitas previstas e recebidas no período',
            total: resumoData.dashTotalIn,
            tone: 'green',
            summaries: [
              { label: 'Recebidas', value: receivedIncome },
              { label: 'A receber', value: pendingIncome },
              { label: 'Total de receitas', value: resumoData.dashTotalIn }
            ],
            items: incomeItems
          },
          despesas: {
            title: 'Despesas',
            subtitle: 'Contas e faturas que formam o total de despesas do período',
            total: resumoData.totalContasFaturas,
            tone: 'red',
            summaries: [
              { label: 'Contas e despesas', value: resumoData.dashTotalExp },
              { label: 'Faturas de cartões', value: resumoData.pmTotal },
              { label: 'Total de despesas', value: resumoData.totalContasFaturas }
            ],
            items: [...expenseItems, ...invoiceItems]
              .sort((a,b) => String(a.date).localeCompare(String(b.date)))
          },
          receber: {
            title: 'A Receber',
            subtitle: 'Receitas que ainda estão pendentes no período',
            total: pendingIncome,
            tone: 'blue',
            summaries: [
              { label: 'Receitas pendentes', value: pendingIncome },
              { label: 'Quantidade', value: incomeItems.filter(i => !i.paid).length, isCount: true },
              { label: 'Total a receber', value: pendingIncome }
            ],
            items: incomeItems.filter(i => !i.paid)
          }
        };
      }, [
        transactions, categories, filterMonth, customStartDate, customEndDate,
        resumoData, balances.currentRealBalance
      ]);

      const dashboardPendingDetails = useMemo(() => {
        const contas = (resumoData.dashMonthExpenses || [])
          .filter(t => !isPaidTransaction(t))
          .map(t => ({
            kind: 'conta',
            id: t.id,
            description: t.description || 'Despesa',
            date: t.dueDate || '',
            amount: parseFloat(t.amount) || 0,
            bank: t.bank || '',
            transaction: t
          }));

        const faturas = (resumoData.pmList || [])
          .filter(f => !f.isPaid && Number(f.invoiceTarget || f.totalValue || 0) > 0)
          .map(f => ({
            kind: 'fatura',
            id: `fatura_${f.cardName}_${f.monthKey}`,
            description: `Fatura ${f.cardName}`,
            date: getInvoiceDueDate(f.monthKey, f.vencimentoDia) || '',
            amount: parseFloat(f.invoiceTarget || f.totalValue || 0) || 0,
            cardName: f.cardName,
            monthKey: f.monthKey
          }));

        return [...contas, ...faturas]
          .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
      }, [resumoData]);

      const dashboardPendingTotals = useMemo(() => {
        const pendingAccounts = dashboardPendingDetails
          .filter(item => item.kind === 'conta')
          .reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

        const pendingInvoices = dashboardPendingDetails
          .filter(item => item.kind === 'fatura')
          .reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);

        return {
          pendingAccounts,
          pendingInvoices,
          grandTotal: pendingAccounts + pendingInvoices
        };
      }, [dashboardPendingDetails]);

      const faturasPorCartao = useMemo(() => {
        const grouped = {};
        if (pmSelectedMonth) {
          filteredPmExpenses.forEach(item => {
            if (pmSelectedMonth === 'all') {
              if (!grouped[item.pagamento]) {
                grouped[item.pagamento] = { total: 0, items: [] };
              }
              grouped[item.pagamento].total += parseFloat(item.valorTotal) || 0;
              grouped[item.pagamento].items.push({ 
                ...item, 
                currentInstallmentValue: parseFloat(item.valorParcela) || 0,
                displayParcela: `${item.parcelas}x (Total)`
              });
            } else {
              const info = getInstallmentInfo(item, pmSelectedMonth, myCards);
              if (info) {
                if (!grouped[item.pagamento]) {
                  grouped[item.pagamento] = { total: 0, items: [] };
                }
                grouped[item.pagamento].total += info.value;
                grouped[item.pagamento].items.push({ 
                  ...item, 
                  currentInstallmentValue: info.value,
                  displayParcela: `${info.current}/${info.total}`
                });
              }
            }
          });
        }
        return grouped;
      }, [filteredPmExpenses, pmSelectedMonth, myCards]);

      // --- CONFERÊNCIA DE FATURAS EM CARTÕES & PROJEÇÕES ---
      const cardAnalysisData = useMemo(() => {
        // A conferência precisa cobrir também meses anteriores.
        // Une o intervalo normal do PayManager ao histórico próprio da conferência.
        const monthMap = new Map();
        [...timeRangeInfo.filter(m => m.key !== 'all'), ...conferenceMonthOptions].forEach(m => monthMap.set(m.key, m));
        const months = Array.from(monthMap.values());
        const normalizeCardName = (value) => String(value || '')
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
          .toLowerCase().trim();
        // Une nomes equivalentes (ex.: Recargapay/RecargaPay) para não duplicar o mesmo cartão.
        const cardNameMap = new Map();
        [...myCards.map(c => c.name), ...pmExpenses.map(e => e.pagamento).filter(Boolean)].forEach(name => {
          const key = normalizeCardName(name);
          if (!key) return;
          const canonical = myCards.find(c => normalizeCardName(c.name) === key)?.name || name;
          if (!cardNameMap.has(key)) cardNameMap.set(key, canonical);
        });
        const cardNames = Array.from(cardNameMap.values());
        const rows = [];

        months.forEach(month => {
          cardNames.forEach(cardName => {
            const cardNormForRow = normalizeCardName(cardName);
            const projected = pmExpenses.reduce((sum, item) => {
              if (normalizeCardName(item.pagamento) !== cardNormForRow) return sum;
              const info = getInstallmentInfo(item, month.key, myCards);
              return sum + (info ? (parseFloat(info.value) || 0) : 0);
            }, 0);
            const card = myCards.find(c => normalizeCardName(c.name) === cardNormForRow);
            const isPaid = !!card?.faturasPagas?.[month.key];
            const storedInvoice = card?.faturasValoresInformados?.[month.key];

            // O VALOR PAGO vem exclusivamente de Lançamentos confirmados cuja
            // categoria é "Cartão de Crédito" e cujo "Cartão associado" corresponde
            // exatamente ao cartão desta fatura. Banco/origem e descrição não entram no vínculo.
            const normalizeText = (value) => String(value || '')
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .toLowerCase().trim();
            const cardNorm = normalizeText(cardName);
            const paidTransactions = transactions.filter(t => {
              if (t.type !== 'expense' || !isPaidTransaction(t)) return false;

              // A competência da fatura é definida pelo vencimento do lançamento de pagamento.
              const referenceDate = t.dueDate || t.paymentDate || t.date || t.data || '';
              if (String(referenceDate).slice(0, 7) !== month.key) return false;

              const categoryObj = categories.find(c => c.id === t.category);
              const categoryText = normalizeText(categoryObj?.name || t.category || t.categoryName);
              const isCreditCardPayment =
                categoryText.includes('cartao de credito') ||
                categoryText.includes('cartao credito') ||
                (categoryText.includes('cartao') && categoryText.includes('credito'));
              if (!isCreditCardPayment) return false;

              const explicitCard = normalizeText(t.associatedCard || '');
              return Boolean(explicitCard) && explicitCard === cardNorm;
            });
            // A FATURA é automática e vem diretamente dos detalhes/compras do cartão.
            // Assim, ao lançar uma diferença nos detalhes, o valor da fatura é recalculado imediatamente.
            const invoiceAmount = projected;

            // Estes são os pagamentos efetivos desta fatura, já filtrados por categoria,
            // Cartão associado e mês de vencimento.
            const invoicePaymentTransactions = paidTransactions;
            const hasInvoicePayment = invoicePaymentTransactions.length > 0;

            // VALOR PAGO = soma real dos lançamentos de pagamento associados a este cartão.
            const paidAmount = invoicePaymentTransactions.reduce(
              (sum, t) => sum + (parseFloat(t.amount) || 0), 0
            );
            const paymentDate = invoicePaymentTransactions
              .map(t => t.paymentDate || t.dueDate || '')
              .filter(Boolean)
              .sort()
              .slice(-1)[0] || card?.faturasPagasDatas?.[month.key] || '';

            // DIFERENÇA = pagamento confirmado - valor atualmente lançado na fatura.
            // Se for positiva, existem valores pagos que ainda precisam ser detalhados no cartão.
            // Sem pagamento confirmado, não cria uma diferença artificial.
            const difference = hasInvoicePayment ? (paidAmount - invoiceAmount) : 0;

            // Data de vencimento da fatura no mês selecionado.
            const [dueYear, dueMonth] = month.key.split('-').map(Number);
            const maxDay = new Date(dueYear, dueMonth, 0).getDate();
            const dueDay = Math.min(Math.max(parseInt(card?.vencimento) || 1, 1), maxDay);
            const invoiceDueDate = `${month.key}-${String(dueDay).padStart(2, '0')}`;

            // Mantém todos os cartões disponíveis para conferência, mesmo sem compras lançadas.
            rows.push({ cardName, monthKey: month.key, monthLabel: month.label, projected, isPaid: hasInvoicePayment, paidAmount, paidTransactions: invoicePaymentTransactions, invoiceAmount, paymentDate, difference, invoiceDueDate });
          });
        });
        return rows.sort((a, b) => b.monthKey.localeCompare(a.monthKey) || a.cardName.localeCompare(b.cardName));
      }, [timeRangeInfo, conferenceMonthOptions, myCards, pmExpenses, transactions, categories]);

      const parseMoneyInput = (value) => {
        const raw = String(value ?? '').trim();
        if (!raw) return 0;
        const normalized = raw.includes(',') ? raw.replace(/\./g, '').replace(',', '.') : raw;
        const parsed = parseFloat(normalized);
        return Number.isFinite(parsed) ? parsed : NaN;
      };

      const handleSaveConferenceValues = async (row) => {
        const key = `${row.cardName}__${row.monthKey}`;
        const draft = invoiceConferenceDrafts[key] || {};
        const invoiceValue = parseMoneyInput(draft.invoiceAmount !== undefined ? draft.invoiceAmount : row.invoiceAmount);
        if (!Number.isFinite(invoiceValue) || invoiceValue < 0) {
          showToast('Informe um valor válido para a fatura.', 'error');
          return;
        }
        const updatedCards = myCards.map(c => c.name === row.cardName ? {
          ...c,
          faturasValoresInformados: {
            ...(c.faturasValoresInformados || {}),
            [row.monthKey]: parseFloat(invoiceValue.toFixed(2))
          }
        } : c);
        setMyCards(updatedCards);
        localStorage.setItem('local_my_cards', JSON.stringify(updatedCards));
        setInvoiceConferenceDrafts(prev => {
          const next = { ...prev };
          delete next[key];
          return next;
        });
        await saveSettingsToCloud(banks, categories, budgets, updatedCards);
        showToast('Valor da fatura salvo. O valor pago é atualizado automaticamente pelos Lançamentos!');
      };

      const handleSetInvoiceAmount = async (row) => {
        const currentValue = Number.isFinite(parseFloat(row.invoiceAmount)) ? parseFloat(row.invoiceAmount) : parseFloat(row.projected) || 0;
        const typed = window.prompt(
          `Informe o valor total da fatura de ${row.cardName} - ${row.monthLabel}:`,
          currentValue.toFixed(2).replace('.', ',')
        );
        if (typed === null) return;
        const rawValue = String(typed).trim();
        const normalizedValue = rawValue.includes(',')
          ? rawValue.replace(/\./g, '').replace(',', '.')
          : rawValue;
        const parsed = parseFloat(normalizedValue);
        if (!Number.isFinite(parsed) || parsed < 0) {
          showToast('Informe um valor de fatura válido.', 'error');
          return;
        }
        const updatedCards = myCards.map(c => c.name === row.cardName ? {
          ...c,
          faturasValoresInformados: {
            ...(c.faturasValoresInformados || {}),
            [row.monthKey]: parseFloat(parsed.toFixed(2))
          }
        } : c);
        setMyCards(updatedCards);
        localStorage.setItem('local_my_cards', JSON.stringify(updatedCards));
        await saveSettingsToCloud(banks, categories, budgets, updatedCards);
        showToast('Valor da fatura atualizado. A conferência foi recalculada!');
      };

      const handleLaunchMissingCardValue = (row) => {
        const missing = Math.max(0, parseFloat(row.difference) || 0);
        if (missing <= 0.009) return;
        const [year, month] = row.monthKey.split('-').map(Number);
        const card = myCards.find(c => c.name === row.cardName);
        const dueDay = Math.min(parseInt(card?.vencimento) || 1, new Date(year, month, 0).getDate());
        const dueDate = `${row.monthKey}-${String(dueDay).padStart(2, '0')}`;
        setEditingPmExpense(null);
        setPmFormData({
          local: '',
          produto: '',
          comprador: 'Claudinei',
          pagamento: row.cardName,
          data: (() => { const d = new Date(year, month - 2, 15); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-15`; })(),
          vencimento: dueDate,
          valorTotal: missing.toFixed(2),
          parcelas: '1',
          valorParcela: missing.toFixed(2),
          tipoLancamento: 'cartao'
        });
        setIsPmModalOpen(true);
        showToast(`Falta lançar R$ ${missing.toLocaleString('pt-BR', {minimumFractionDigits: 2})} para atingir o valor da fatura. Informe a compra que está faltando; você pode lançar uma parte e repetir até conferir.`);
      };


      const getExistingInvoiceLaunches = (cardName, monthKey) => {
        return pmExpenses
          .filter(item => normalizeCardName(item.pagamento) === normalizeCardName(cardName))
          .map(item => ({ item, info: getInstallmentInfo(item, monthKey, myCards) }))
          .filter(({ info }) => !!info)
          .map(({ item, info }) => ({
            ...item,
            invoiceValue: parseFloat(info.value) || 0,
            currentInstallment: info.current || 1,
            totalInstallments: info.total || (parseInt(item.parcelas) || 1)
          }))
          .sort((a, b) => String(a.data || '').localeCompare(String(b.data || '')));
      };

      const openDifferenceLaunchModal = (rows) => {
        const prepared = (rows || [])
          .filter(r => (parseFloat(r.difference) || 0) > 0.009)
          .map((r, idx) => {
            const [year, month] = r.monthKey.split('-').map(Number);
            const card = myCards.find(c => normalizeCardName(c.name) === normalizeCardName(r.cardName));
            const dueDay = Math.min(parseInt(card?.vencimento) || 1, new Date(year, month, 0).getDate());
            const dueDate = r.invoiceDueDate || `${r.monthKey}-${String(dueDay).padStart(2, '0')}`;
            const purchaseDateObj = new Date(year, month - 2, 15);
            const purchaseDate = `${purchaseDateObj.getFullYear()}-${String(purchaseDateObj.getMonth()+1).padStart(2,'0')}-15`;
            const diff = parseFloat(r.difference) || 0;
            return {
              lineId: `diff_${Date.now()}_${idx}`,
              cardName: r.cardName,
              monthKey: r.monthKey,
              monthLabel: r.monthLabel,
              invoiceDueDate: dueDate,
              maxDifference: diff,
              amount: diff.toFixed(2),
              selected: true,
              comprador: 'Claudinei',
              tipoLancamento: 'cartao',
              local: '',
              produto: '',
              parcelas: '1',
              valorParcela: diff.toFixed(2),
              data: purchaseDate,
              vencimento: dueDate
            };
          });
        if (!prepared.length) {
          showToast('Não há diferenças positivas para lançar.', 'error');
          return;
        }
        setDifferenceLaunchModal({ isOpen: true, rows: prepared });
      };

      const confirmDifferenceLaunchModal = async (e) => {
        e.preventDefault();
        const selected = differenceLaunchModal.rows.filter(r => r.selected && (parseFloat(r.amount) || 0) > 0.009);
        if (!selected.length) {
          showToast('Selecione pelo menos uma diferença para lançar.', 'error');
          return;
        }

        // Permite dividir uma diferença em vários lançamentos, mas impede ultrapassar o total devido.
        const groupedTotals = new Map();
        selected.forEach(r => {
          const key = `${r.cardName}__${r.monthKey}`;
          groupedTotals.set(key, (groupedTotals.get(key) || 0) + (parseFloat(r.amount) || 0));
        });
        for (const r of selected) {
          const key = `${r.cardName}__${r.monthKey}`;
          const total = groupedTotals.get(key) || 0;
          const max = parseFloat(r.maxDifference) || 0;
          if (max > 0 && total - max > 0.01) {
            showToast(`Os valores de ${r.cardName} ultrapassam a diferença de R$ ${max.toLocaleString('pt-BR',{minimumFractionDigits:2})}.`, 'error');
            return;
          }
        }

        const created = selected.map((r, idx) => {
          const amount = parseFloat(r.amount) || 0;
          const parcelas = Math.max(1, parseInt(r.parcelas) || 1);
          const total = parseFloat(r.valorTotal || r.amount) || amount;
          const parcela = parseFloat(r.valorParcela) || (total / parcelas) || amount;
          const purchaseDate = parseDateBRFull(formatDateBRFull(r.data)) || r.data;
          const dueDate = parseDateBRFull(formatDateBRFull(r.vencimento)) || r.vencimento || r.invoiceDueDate;
          return {

      const handleLaunchPaymentDifference = (row, currentInvoice) => {
        // Prioridade: quando existe pagamento confirmado, o alvo passa a ser o valor pago.
        // Assim os lançamentos de compras podem ser completados até atingir exatamente o que saiu da conta.
        const paid = parseFloat(row.paidAmount) || 0;
        const registered = parseFloat(row.projected) || 0;
        const invoice = Number.isFinite(parseFloat(currentInvoice)) ? parseFloat(currentInvoice) : (parseFloat(row.invoiceAmount) || 0);
        const target = paid > 0 ? paid : invoice;
        const missing = target - registered;

        if (missing <= 0.009) {
          showToast("Não há valor positivo faltando para lançar.", "error");
          return;
        }

        // Se o valor pago for maior do que a fatura atualmente informada,
        // já sugere o valor pago no campo Valor da Fatura.
        if (paid > 0 && Math.abs(invoice - paid) > 0.009) {
          const key = `${row.cardName}__${row.monthKey}`;
          setInvoiceConferenceDrafts(prev => ({
            ...prev,
            [key]: { ...(prev[key] || {}), invoiceAmount: paid.toFixed(2) }
          }));
        }

        const [year, month] = row.monthKey.split('-').map(Number);
        const card = myCards.find(c => c.name === row.cardName);
        const dueDay = Math.min(parseInt(card?.vencimento) || 1, new Date(year, month, 0).getDate());
        const dueDate = `${row.monthKey}-${String(dueDay).padStart(2, '0')}`;

        setEditingPmExpense(null);
        setPmFormData({
          local: '',
          produto: '',
          comprador: 'Claudinei',
          pagamento: row.cardName,
          data: `${row.monthKey}-01`,
          vencimento: dueDate,
          valorTotal: missing.toFixed(2),
          parcelas: '1',
          valorParcela: missing.toFixed(2)
        });
        setIsPmModalOpen(true);

        showToast(
          `Faltam R$ ${missing.toLocaleString('pt-BR', {minimumFractionDigits: 2})} em compras de ${row.cardName}. ` +
          `Cadastre o lançamento que está faltando. Você pode lançar uma parte e repetir até zerar a diferença.`
        );
      };

      const handleAddMissingCardValue = async (row) => {
        const missing = parseFloat(row.difference) || 0;
        if (missing <= 0.009) return;
        const [year, month] = row.monthKey.split('-').map(Number);
        const card = myCards.find(c => c.name === row.cardName);
        const dueDay = Math.min(parseInt(card?.vencimento) || 1, new Date(year, month, 0).getDate());
        const dueDate = `${row.monthKey}-${String(dueDay).padStart(2, '0')}`;
        const safePmId = 'pm_adjust_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
        const adjustment = {
          id: safePmId,
          local: 'Ajuste da Fatura',

          data: `${row.monthKey}-01`,

          valorTotal: parseFloat(missing.toFixed(2)),
          parcelas: '1',
          valorParcela: parseFloat(missing.toFixed(2)),

        };
        const updatedPm = [...pmExpenses, adjustment];
        setPmExpenses(updatedPm);
        localStorage.setItem('local_pm_expenses', JSON.stringify(updatedPm));
        showToast(`R$ ${missing.toLocaleString('pt-BR', {minimumFractionDigits: 2})} adicionados ao Registro de Compras de ${row.cardName}. A conferência será recalculada automaticamente.`);

        if (db && user && syncKey) {
          try {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', `pm_${syncKey}_expenses`, safePmId);
            await setDoc(ref, adjustment);
          } catch (err) {
            console.error('Erro ao guardar ajuste da fatura:', err);
          }
        }
      };

      const openPaidInvoiceEdit = (row) => {
        setFaturaPaymentModal({
          isOpen: true,
          cardName: row.cardName,
          monthKey: row.monthKey,
          paymentDate: row.paymentDate || new Date().toISOString().split('T')[0],
          amountPaid: row.paidAmount ? row.paidAmount.toFixed(2) : row.projected.toFixed(2)
        });
      };

      // --- OBJETIVO X REALIZADO ---
      const goalMonths = [
        { num: 1, label: 'JAN' }, { num: 2, label: 'FEV' }, { num: 3, label: 'MAR' },
        { num: 4, label: 'ABR' }, { num: 5, label: 'MAI' }, { num: 6, label: 'JUN' },
        { num: 7, label: 'JUL' }, { num: 8, label: 'AGO' }, { num: 9, label: 'SET' },
        { num: 10, label: 'OUT' }, { num: 11, label: 'NOV' }, { num: 12, label: 'DEZ' }
      ];

      const goalKey = (segment, monthNum, year = goalYear) => `${year}-${String(monthNum).padStart(2, '0')}__${segment}`;
      const getGoalValue = (segment, monthNum) => parseFloat(monthlyGoals[goalKey(segment, monthNum)] || 0) || 0;
      const setGoalValue = (segment, monthNum, value) => {
        const clean = String(value ?? '').replace(/\./g, '').replace(',', '.');
        const parsed = clean === '' ? '' : parseFloat(clean);
        const next = { ...monthlyGoals };
        const key = goalKey(segment, monthNum);
        if (clean === '' || !Number.isFinite(parsed)) delete next[key];
        else next[key] = Math.round(parsed * 100) / 100;
        setMonthlyGoals(next);
        localStorage.setItem('local_monthly_goals', JSON.stringify(next));
        saveSettingsToCloud(banks, categories, budgets, myCards, next);
      };

      const getRealizedForMonth = (monthNum, segment, categoryId = null) => {
        const monthKey = `${goalYear}-${String(monthNum).padStart(2, '0')}`;
        const rows = transactions.filter(t => {
          const refDate = t.paymentDate || t.dueDate || t.date || '';
          if (String(refDate).slice(0, 7) !== monthKey) return false;
          // Realizado representa movimentações confirmadas/pagas. Para dados antigos sem campo paid,
          // considera como realizado para não ocultar histórico já importado.
          if (!isPaidTransaction(t)) return false;
          return true;
        });
        if (segment === 'receitas') return rows.filter(t => t.type === 'income').reduce((a,t)=>a+(parseFloat(t.amount)||0),0);
        if (segment === 'despesas') return rows.filter(t => t.type === 'expense').reduce((a,t)=>a+(parseFloat(t.amount)||0),0);
        if (segment === 'saldo') {
          const inc = rows.filter(t => t.type === 'income').reduce((a,t)=>a+(parseFloat(t.amount)||0),0);
          const exp = rows.filter(t => t.type === 'expense').reduce((a,t)=>a+(parseFloat(t.amount)||0),0);
          return inc-exp;
        }
        if (segment === 'categoria' && categoryId) {
          return rows.filter(t => t.type === 'expense' && t.category === categoryId).reduce((a,t)=>a+(parseFloat(t.amount)||0),0);
        }
        return 0;
      };

      const goalSegments = useMemo(() => {
        const base = [
          { id: 'receitas', label: 'RECEITAS', kind: 'income' },
          { id: 'despesas', label: 'DESPESAS', kind: 'expense' },
          { id: 'saldo', label: 'SALDO', kind: 'income' }
        ];
        const expenseCategories = categories
          .filter(c => c.type !== 'receita')
          .map(c => ({ id: `cat_${c.id}`, categoryId: c.id, label: c.name, kind: 'expense' }));
        return [...base, ...expenseCategories];
      }, [categories]);

      const getGoalRealized = (segment, monthNum) => {
        if (segment.categoryId) return getRealizedForMonth(monthNum, 'categoria', segment.categoryId);
        return getRealizedForMonth(monthNum, segment.id);
      };

      const deviationFor = (segment, objective, realized) => {
        const diff = realized - objective;
        const isGood = segment.kind === 'expense' ? diff <= 0 : diff >= 0;
        return { diff, isGood };
      };

      // --- HELPERS ---
      const handleMonthShift = (direction) => {
        if (filterMonth === 'all' || filterMonth === 'custom') return;
        const [year, month] = filterMonth.split('-').map(Number);
        const date = new Date(year, month - 1 + direction, 1);
        setFilterMonth(`${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`);
      };

      const formatToDDMMAAAA = (dateString) => {
        if (!dateString) return '';
        const parts = dateString.split('-');
        if (parts.length !== 3) return dateString;
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      };

      const getMonthDateRange = (yearMonthStr) => {
        if (!yearMonthStr || yearMonthStr === 'all') return 'Todo Histórico';
        if (yearMonthStr === 'custom') {
          return `Período: ${formatToDDMMAAAA(customStartDate)} a ${formatToDDMMAAAA(customEndDate)}`;
        }
        const [year, month] = yearMonthStr.split('-').map(Number);
        const lastDay = new Date(year, month, 0).getDate(); 
        const monthStr = String(month).padStart(2, '0');
        const monthName = new Date(year, month - 1, 1).toLocaleDateString('pt-BR', { month: 'long' });
        return `${monthName.charAt(0).toUpperCase() + monthName.slice(1)} de ${year} (01/${monthStr} a ${lastDay}/${monthStr})`;
      };

      const getDisplayPercentage = (spent, income) => {
        if (income <= 0) return spent > 0 ? '> 100%' : '0%';
        const pct = (spent / income) * 100;
        return pct > 100 ? '> 100%' : `${Math.round(pct)}%`;
      };


      const resetFutureForm = () => {
        const defaultFutureCategory = categories.find(c => c.id === 'outros')?.id || categories.find(c => c.type !== 'receita')?.id || categories[0]?.id || '';
        setFutureForm({ description: '', amount: '', date: '', category: defaultFutureCategory, priority: 'media', notes: '' });
        setFutureEditingId(null);
      };

      const handleSaveFutureExpense = async (e) => {
        e?.preventDefault();
        const amount = parseFloat(String(futureForm.amount).replace(',', '.')) || 0;
        const futureDateIso = parseDateBRFull(futureForm.date);
        if (!futureForm.description.trim() || amount <= 0 || !futureDateIso) {
          showToast('Informe descrição, valor e data no formato DD/MM/AAAA.', 'error');
          return;
        }
        const item = {
          id: futureEditingId || `future_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
          description: futureForm.description.trim(),
          amount,
          date: futureDateIso,
          category: futureForm.category || 'outros',
          priority: futureForm.priority || 'media',
          notes: futureForm.notes?.trim() || '',
          createdAt: futureEditingId ? (futureExpenses.find(x => x.id === futureEditingId)?.createdAt || new Date().toISOString()) : new Date().toISOString()
        };
        setFutureExpenses(prev => futureEditingId ? prev.map(x => x.id === futureEditingId ? item : x) : [item, ...prev]);
        localStorage.setItem('local_future_expenses', JSON.stringify(
          futureEditingId ? futureExpenses.map(x => x.id === futureEditingId ? item : x) : [item, ...futureExpenses]
        ));

        if (db && user && syncKey) {
          try {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', `future_${syncKey}_expenses`, item.id);
            await setDoc(ref, item, { merge: true });
          } catch (err) {
            console.error('Erro ao guardar despesa futura na nuvem:', err);
            showToast('Despesa futura salva neste aparelho, mas houve erro na sincronização.', 'error');
          }
        }

        showToast(futureEditingId ? 'Despesa futura atualizada.' : 'Despesa futura adicionada.');
        resetFutureForm();
      };

      const handleEditFutureExpense = (item) => {
        setFutureEditingId(item.id);
        setFutureForm({
          description: item.description || '', amount: String(item.amount ?? ''), date: formatDateBRFull(item.date || ''),
          category: item.category || 'outros', priority: item.priority || 'media', notes: item.notes || ''
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleDeleteFutureExpense = async (id) => {
        setFutureExpenses(prev => prev.filter(x => x.id !== id));
        localStorage.setItem('local_future_expenses', JSON.stringify(futureExpenses.filter(x => x.id !== id)));
        if (futureEditingId === id) resetFutureForm();

        if (db && user && syncKey) {
          try {
            const ref = doc(db, 'artifacts', appId, 'public', 'data', `future_${syncKey}_expenses`, id);
            await deleteDoc(ref);
          } catch (err) {
            console.error('Erro ao remover despesa futura da nuvem:', err);
          }
        }

        showToast('Despesa futura removida.');
      };

      const futureWindow = useMemo(() => {
        const now = new Date();
        now.setHours(0,0,0,0);
        const start = new Date(now);
        const end = new Date(now);
        if (futureView === 'week') end.setDate(end.getDate() + 7);
        else if (futureView === 'month') end.setMonth(end.getMonth() + 1);
        else if (futureView === 'year') end.setFullYear(end.getFullYear() + 1);
        else end.setFullYear(end.getFullYear() + 20);
        const items = futureExpenses
          .filter(item => {
            const d = new Date(`${item.date}T00:00:00`);
            return !Number.isNaN(d.getTime()) && d >= start && d <= end;
          })
          .sort((a,b) => String(a.date).localeCompare(String(b.date)));
        const total = items.reduce((sum,x) => sum + (parseFloat(x.amount)||0),0);
        return { items, total };
      }, [futureExpenses, futureView]);

      const futureSummary = useMemo(() => {
        const now = new Date(); now.setHours(0,0,0,0);
        const totalUntil = (kind) => {
          const end = new Date(now);
          if (kind === 'week') end.setDate(end.getDate()+7);
          if (kind === 'month') end.setMonth(end.getMonth()+1);
          if (kind === 'year') end.setFullYear(end.getFullYear()+1);
          return futureExpenses.reduce((sum,x) => {
            const d = new Date(`${x.date}T00:00:00`);
            return d >= now && d <= end ? sum + (parseFloat(x.amount)||0) : sum;
          },0);
        };
        return { week: totalUntil('week'), month: totalUntil('month'), year: totalUntil('year') };
      }, [futureExpenses]);


      // Registros da aba Futuras que vencem no mês atual.
      // Eles aparecem automaticamente no painel em Alertas e Notificações.
      const futureAlertsThisMonth = useMemo(() => {
        const now = new Date();
        const currentMonthKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        return futureExpenses
          .filter(item => String(item?.date || '').slice(0, 7) === currentMonthKey)
          .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
      }, [futureExpenses]);

      const handleExportData = () => {
        try {
          // Backup completo: usa o estado atual e também uma cópia dos dados persistidos no navegador.
          // Isso evita perder dados no celular quando algum estado ainda não terminou de sincronizar/renderizar.
          const safeParse = (key, fallback) => {
            try {
              const raw = localStorage.getItem(key);
              return raw ? JSON.parse(raw) : fallback;
            } catch (_) {
              return fallback;
            }
          };

          const persistedTransactions = safeParse('local_transactions', transactions);
          const persistedPmExpenses = safeParse('local_pm_expenses', pmExpenses);
          const persistedBanks = safeParse('local_banks', banks);
          const persistedCategories = safeParse('local_categories', categories);
          const persistedBudgets = safeParse('local_budgets', budgets);
          const persistedMyCards = safeParse('local_my_cards', myCards);
          const persistedMonthlyGoals = safeParse('local_monthly_goals', monthlyGoals);
          const persistedFutureExpenses = safeParse('local_future_expenses', futureExpenses);

          // Mescla listas por ID, priorizando o estado atual sem perder campos persistidos.
          // Isso garante que campos importantes como associatedCard (Cartão associado) entrem no backup.
          const mergeArraysById = (stateValue, storedValue) => {
            const a = Array.isArray(storedValue) ? storedValue : [];
            const b = Array.isArray(stateValue) ? stateValue : [];
            const map = new Map();
            [...a, ...b].forEach((item, index) => {
              if (!item) return;
              const key = item.id || `__idx_${index}`;
              const prev = map.get(key) || {};
              const merged = { ...prev, ...item };
              // Compatibilidade com backups/versões antigas que usavam outros nomes.
              merged.associatedCard = merged.associatedCard || merged.cardName || merged.cartao || '';
              map.set(key, merged);
            });
            return Array.from(map.values());
          };

          const chooseLongestArray = (stateValue, storedValue) => {
            const a = Array.isArray(stateValue) ? stateValue : [];
            const b = Array.isArray(storedValue) ? storedValue : [];
            return b.length > a.length ? b : a;
          };

          const backupTransactions = mergeArraysById(transactions, persistedTransactions);

          const completeData = {
            transactions: backupTransactions,
            pmExpenses: chooseLongestArray(pmExpenses, persistedPmExpenses),
            banks: chooseLongestArray(banks, persistedBanks),
            categories: chooseLongestArray(categories, persistedCategories),
            budgets: (persistedBudgets && Object.keys(persistedBudgets).length >= Object.keys(budgets || {}).length) ? persistedBudgets : budgets,
            myCards: chooseLongestArray(myCards, persistedMyCards),
            monthlyGoals: (persistedMonthlyGoals && Object.keys(persistedMonthlyGoals).length >= Object.keys(monthlyGoals || {}).length) ? persistedMonthlyGoals : monthlyGoals,
            futureExpenses: chooseLongestArray(futureExpenses, persistedFutureExpenses)
          };

          const localStorageSnapshot = {};
          [
            'local_transactions',
            'local_pm_expenses',
            'local_banks',
            'local_categories',
            'local_budgets',
            'local_my_cards',
            'local_monthly_goals',
            'local_future_expenses'
          ].forEach(key => {
            const value = localStorage.getItem(key);
            if (value !== null) localStorageSnapshot[key] = value;
          });

          const payload = {
            backupVersion: 4,
            exportedAt: new Date().toISOString(),
            source: 'Financas Pro',
            deviceBackup: true,
            ...completeData,
            localStorageSnapshot,
            manifest: {
              transactions: completeData.transactions.length,
              transactionsWithAssociatedCard: completeData.transactions.filter(t => t.associatedCard).length,
              pmExpenses: completeData.pmExpenses.length,
              banks: completeData.banks.length,
              categories: completeData.categories.length,
              cards: completeData.myCards.length,
              futureExpenses: completeData.futureExpenses.length
            }
          };
          const json = JSON.stringify(payload, null, 2);
          const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const downloadAnchor = document.createElement('a');
          downloadAnchor.href = url;
          downloadAnchor.download = `Copia_Seguranca_Financeiro_${new Date().toISOString().split('T')[0]}.json`;
          downloadAnchor.style.display = 'none';
          document.body.appendChild(downloadAnchor);
          downloadAnchor.click();
          downloadAnchor.remove();
          setTimeout(() => URL.revokeObjectURL(url), 1500);

          const backupTime = new Date().toISOString();
          localStorage.setItem('financial_last_backup_at', backupTime);
          setLastBackupAt(backupTime);
          showToast(`Backup completo criado — ${completeData.transactions.length} lançamentos e ${completeData.pmExpenses.length} compras/cartões salvos.`);
        } catch (err) {
          console.error('Erro ao gerar backup JSON:', err);
          showToast("Não foi possível gerar o backup JSON.", "error");
        }
      };

      const handleImportData = (e) => {
        const fileReader = new FileReader();
        fileReader.onload = async (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.transactions || parsed.pmExpenses || parsed.localStorageSnapshot) {
              // Restaura primeiro a persistência local, garantindo que o celular receba todos os dados do arquivo.
              if (parsed.localStorageSnapshot && typeof parsed.localStorageSnapshot === 'object') {
                Object.entries(parsed.localStorageSnapshot).forEach(([key, value]) => {
                  if (typeof value === 'string') localStorage.setItem(key, value);
                });
              }

              const restoredTransactionsRaw = parsed.transactions || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_transactions || '[]'); } catch { return []; } })();
              const restoredTransactions = Array.isArray(restoredTransactionsRaw) ? restoredTransactionsRaw.map(t => normalizeTransactionPaid({
                ...t,
                // Mantém/restaura explicitamente o Cartão associado e aceita nomes usados por versões antigas.
                associatedCard: t?.associatedCard || t?.cardName || t?.cartao || ''
              })) : [];
              const restoredPmExpenses = parsed.pmExpenses || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_pm_expenses || '[]'); } catch { return []; } })();
              const restoredBanks = parsed.banks || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_banks || '[]'); } catch { return []; } })();
              const restoredCategories = parsed.categories || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_categories || '[]'); } catch { return []; } })();
              const restoredBudgets = parsed.budgets || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_budgets || '{}'); } catch { return {}; } })();
              const restoredMyCards = parsed.myCards || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_my_cards || '[]'); } catch { return []; } })();
              const restoredMonthlyGoals = parsed.monthlyGoals || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_monthly_goals || '{}'); } catch { return {}; } })();
              const restoredFutureExpenses = parsed.futureExpenses || (() => { try { return JSON.parse(parsed.localStorageSnapshot?.local_future_expenses || '[]'); } catch { return []; } })();

              if (restoredTransactions) { setTransactions(restoredTransactions); localStorage.setItem('local_transactions', JSON.stringify(restoredTransactions)); }
              if (restoredPmExpenses) { setPmExpenses(restoredPmExpenses); localStorage.setItem('local_pm_expenses', JSON.stringify(restoredPmExpenses)); }
              if (restoredBanks) { setBanks(restoredBanks); localStorage.setItem('local_banks', JSON.stringify(restoredBanks)); }
              if (restoredCategories) { setCategories(restoredCategories); localStorage.setItem('local_categories', JSON.stringify(restoredCategories)); }
              if (restoredBudgets) { setBudgets(restoredBudgets); localStorage.setItem('local_budgets', JSON.stringify(restoredBudgets)); }
              if (restoredMyCards) { setMyCards(restoredMyCards); localStorage.setItem('local_my_cards', JSON.stringify(restoredMyCards)); }
              if (restoredMonthlyGoals) { setMonthlyGoals(restoredMonthlyGoals); localStorage.setItem('local_monthly_goals', JSON.stringify(restoredMonthlyGoals)); }
              if (restoredFutureExpenses) { setFutureExpenses(restoredFutureExpenses); localStorage.setItem('local_future_expenses', JSON.stringify(restoredFutureExpenses)); }

              const restoreTime = new Date().toISOString();
              localStorage.setItem('financial_last_restore_at', restoreTime);
              setLastRestoreAt(restoreTime);
              showToast(`Backup restaurado — ${restoredTransactions.length} lançamentos e ${restoredPmExpenses.length} compras/cartões carregados.`);

              if (db && user && syncKey) {
                showToast("Sincronizando com a nuvem...");
                await saveSettingsToCloud(restoredBanks, restoredCategories, restoredBudgets, restoredMyCards, restoredMonthlyGoals);
                let batch = writeBatch(db);
                let writeCount = 0;

                                return (a.local || '').localeCompare(b.local || '') * modifier;
