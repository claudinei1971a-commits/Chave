                  </div>

                  <div className="flex gap-3 mt-6">
                    <button type="button" onClick={() => setFaturaPaymentModal({ isOpen: false, cardName: '', monthKey: '', paymentDate: '', amountPaid: '' })} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-xl text-sm font-bold transition">Cancelar</button>
                    <button type="submit" className="flex-1 bg-emerald-500 hover:bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-bold transition shadow-md">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL NOVO CARTÃO */}
          {isCardModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden flex flex-col">
                <div className="p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                  <h3 className="font-extrabold text-slate-900 text-lg">{editingCard ? 'Editar Cartão' : 'Novo Cartão'}</h3>
                  <button onClick={() => setIsCardModalOpen(false)} className="text-slate-400 hover:text-slate-800 bg-white border border-slate-200 p-1.5 rounded-lg shadow-sm"><X className="h-5 w-5" /></button>
                </div>
                <form onSubmit={handleSaveCard} className="p-6 space-y-4 text-sm">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Nome do Banco / Cartão</label>
                    <input type="text" required placeholder="Ex: Nubank, Santander..." value={cardFormData.name} onChange={(e) => setCardFormData(p => ({ ...p, name: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-slate-800 focus:outline-none focus:border-indigo-500" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Titular do Cartão</label>
                    <input type="text" required placeholder="Ex: João, Família..." value={cardFormData.titular} onChange={(e) => setCardFormData(p => ({ ...p, titular: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-slate-800 focus:outline-none focus:border-indigo-500" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5">Últimos 4 números</label>
                    <input type="text" inputMode="numeric" maxLength="4" placeholder="Ex: 1234" value={cardFormData.last4 || ''} onChange={(e) => setCardFormData(p => ({ ...p, last4: e.target.value.replace(/\D/g, '').slice(0, 4) }))} className="w-full bg-white border border-slate-300 rounded-xl px-4 py-2 text-slate-800 focus:outline-none focus:border-indigo-500" />
                    <p className="mt-1 text-[10px] text-slate-400">Informe somente os 4 últimos dígitos.</p>
                  </div>
                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5 text-xs truncate">Fechamento</label>
                      <input type="number" min="1" max="31" required value={cardFormData.fechamento} onChange={(e) => setCardFormData(p => ({ ...p, fechamento: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-800 text-center focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                      <label className="block font-bold text-emerald-600 mb-1.5 text-xs truncate">Vencimento</label>
                      <input type="number" min="1" max="31" required value={cardFormData.vencimento} onChange={(e) => setCardFormData(p => ({ ...p, vencimento: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-800 text-center focus:outline-none focus:border-indigo-500" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1.5 text-xs truncate">Limite Total (R$)</label>
                      <input type="number" step="0.01" value={cardFormData.limite} onChange={(e) => setCardFormData(p => ({ ...p, limite: e.target.value }))} className="w-full bg-white border border-slate-300 rounded-xl px-2 py-2 text-slate-800 text-center focus:outline-none focus:border-indigo-500" placeholder="Opcional" />
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1.5 text-xs">Cores do Cartão</label>
                    <div className="flex flex-col gap-3">
                      <select onChange={(e) => {
                        if(e.target.value && BANK_COLORS[e.target.value]) {
                          setCardFormData(p => ({ ...p, color1: BANK_COLORS[e.target.value].c1, color2: BANK_COLORS[e.target.value].c2 }));
                        }
                      }} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-slate-800 text-xs focus:outline-none focus:border-indigo-500">
                        <option value="">Escolher Cor do Banco...</option>
                        {Object.keys(BANK_COLORS).map(b => <option key={b} value={b}>{b}</option>)}
                      </select>
                      
                      <div className="flex gap-2 items-center">
                        <span className="text-xs text-slate-500 font-medium">Ou manual:</span>
                        <input type="color" value={cardFormData.color1} onChange={(e) => setCardFormData(p => ({ ...p, color1: e.target.value }))} className="w-10 h-8 cursor-pointer rounded bg-transparent border-0 p-0" />
                        <span className="text-slate-400 text-xs">até</span>
                        <input type="color" value={cardFormData.color2} onChange={(e) => setCardFormData(p => ({ ...p, color2: e.target.value }))} className="w-10 h-8 cursor-pointer rounded bg-transparent border-0 p-0" />
                      </div>
                    </div>
                  </div>
                  
                  <div className="flex gap-3 pt-4 border-t border-slate-200 mt-2">
                    <button type="button" onClick={() => setIsCardModalOpen(false)} className="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl font-bold transition">Cancelar</button>
                    <button type="submit" className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDIÇÃO FUTUROS */}
          {futureEditsModal.isOpen && (
            <div className="fixed inset-0 z-[60] bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-md w-full p-6">
                <div className="flex items-center gap-3 mb-4">
                  <div className="bg-amber-100 text-amber-600 p-2 rounded-full">
                    <AlertCircle className="w-6 h-6" />
                  </div>
                  <h3 className="text-lg font-black text-slate-900">Atualizar Lançamentos Futuros?</h3>
                </div>
                <p className="text-sm text-slate-600 mb-3 font-medium">
                  Foram encontrados <strong>{futureEditsModal.futureTxs.length}</strong> lançamentos futuros com a mesma série ou com o mesmo valor e características. Marque quais também deverão receber as alterações.
                </p>

                <div className="flex items-center justify-between gap-2 mb-3 text-xs">
                  <span className="font-bold text-slate-700">{futureEditsModal.selectedIds.length} selecionado(s)</span>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setFutureEditsModal(prev => ({...prev, selectedIds: prev.futureTxs.map(t => t.id)}))} className="text-indigo-600 font-bold hover:underline">Marcar todos</button>
                    <button type="button" onClick={() => setFutureEditsModal(prev => ({...prev, selectedIds: []}))} className="text-slate-500 font-bold hover:underline">Desmarcar</button>
                  </div>
                </div>
                
                <div className="max-h-72 overflow-y-auto mb-6 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs custom-scrollbar">
                  {futureEditsModal.futureTxs.map((t, i) => {
                    const checked = futureEditsModal.selectedIds.includes(t.id);
                    return (
                    <label key={t.id || i} className={`flex gap-3 py-3 border-b border-slate-200 last:border-0 cursor-pointer rounded-lg px-2 ${checked ? 'bg-emerald-50' : ''}`}>
                      <input
                        type="checkbox"
                        checked={checked}
                        onChange={() => setFutureEditsModal(prev => ({
                          ...prev,
                          selectedIds: checked ? prev.selectedIds.filter(id => id !== t.id) : [...prev.selectedIds, t.id]
                        }))}
                        className="mt-1 h-4 w-4 accent-emerald-600"
                      />
                      <div className="min-w-0 flex-1">
                        <div className="flex justify-between items-start gap-3">
                          <span className="font-semibold text-slate-700">{t.description}</span>
                          <span className="font-bold text-slate-800 whitespace-nowrap">R$ {parseFloat(t.amount).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</span>
                        </div>
                        <div className="flex flex-wrap gap-x-3 gap-y-1 mt-1 text-slate-500">
                          <span>Vencimento: <strong>{formatToDDMMAAAA(t.dueDate)}</strong></span>
                          {!isPaidTransaction(t) && getDueStatus(t.dueDate, false) && (
                            <span className={`font-bold ${getDueStatus(t.dueDate, false).className.split(' ')[0]}`}>
                              {getDueStatus(t.dueDate, false).text}
                            </span>
                          )}
                          <span>Banco: <strong>{t.bank || 'Não informado'}</strong></span>
                          {t.installmentsInfo && <span>Parcela: <strong>{t.installmentsInfo.current}/{t.installmentsInfo.total}</strong></span>}
                          <span>Status: <strong>{isPaidTransaction(t) ? 'Pago' : 'Pendente'}</strong></span>
                        </div>
                        <div className="mt-1 font-bold text-indigo-600">Encontrado por: {t.matchReason}</div>
                      </div>
                    </label>
                  )})}
                </div>

                <div className="flex flex-col gap-2">
                  <button onClick={() => handleSaveTransaction(null, 'selected')} className="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-3 rounded-xl text-sm font-bold transition shadow-md">
                    Atualizar este + selecionados ({futureEditsModal.selectedIds.length})
                  </button>
                  <button onClick={() => handleSaveTransaction(null, 'current')} className="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-xl text-sm font-bold transition">
                    Alterar apenas este lançamento
                  </button>
                  <button type="button" onClick={() => setFutureEditsModal({ isOpen: false, pendingFormData: null, futureTxs: [], selectedIds: [] })} className="w-full text-slate-400 py-2 text-xs font-bold hover:text-slate-600">
                    Cancelar edição
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL EXTRATO */}
          {extratoModal.isOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white border border-slate-200 rounded-3xl shadow-2xl max-w-3xl w-full flex flex-col max-h-[90vh]">
                <div className="p-5 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
                  <div>
                    <h3 className="font-extrabold text-slate-900 text-lg">Extrato: {extratoModal.bankName}</h3>
                    <p className="text-xs text-slate-500 mt-1">
                      {filterMonth === 'all' ? 'Todo o histórico' : 
                       filterMonth === 'custom' ? `De ${formatToDDMMAAAA(customStartDate)} a ${formatToDDMMAAAA(customEndDate)}` : 
                       `Mês: ${filterMonth}`}
                    </p>
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={() => handlePrintExtrato('portrait')} className="flex items-center gap-1.5 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 px-3 py-1.5 rounded-lg text-xs font-bold transition shadow-sm">
                      <Printer className="w-3.5 h-3.5" /> Imprimir
                    </button>
                    <button onClick={() => setExtratoModal({ isOpen: false, bankName: null })} className="text-slate-400 hover:text-slate-800 bg-white border border-slate-200 p-1.5 rounded-lg shadow-sm"><X className="h-5 w-5" /></button>
                  </div>
                </div>
                
                <div className="p-5 flex gap-4 bg-white border-b border-slate-100">
                  <div className="flex-1 bg-emerald-50 rounded-xl p-3 border border-emerald-100">
                    <span className="text-[10px] font-bold text-emerald-600 uppercase">Entradas</span>
                    <p className="text-lg font-black text-emerald-700">R$ {extratoTotals.inTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                  </div>
                  <div className="flex-1 bg-rose-50 rounded-xl p-3 border border-rose-100">
                    <span className="text-[10px] font-bold text-rose-600 uppercase">Saídas</span>
                    <p className="text-lg font-black text-rose-700">R$ {extratoTotals.outTotal.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                  </div>
                  <div className="flex-1 bg-slate-100 rounded-xl p-3 border border-slate-200">
                    <span className="text-[10px] font-bold text-slate-600 uppercase">Balanço</span>
                    <p className={`text-lg font-black ${extratoTotals.inTotal - extratoTotals.outTotal >= 0 ? 'text-indigo-600' : 'text-rose-600'}`}>
                      R$ {(extratoTotals.inTotal - extratoTotals.outTotal).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                    </p>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto p-0">
                  {extratoTransactions.length === 0 ? (
                    <div className="py-12 flex flex-col items-center justify-center text-slate-400">
                      <FileText className="h-10 w-10 text-slate-300 mb-2" />
                      <p className="font-medium text-sm">Nenhuma movimentação encontrada.</p>
                    </div>
                  ) : (
                    <table className="w-full text-left text-sm">
                      <thead className="bg-slate-50 sticky top-0 border-b border-slate-200">
                        <tr>
                          <th className="px-6 py-3 font-bold text-xs text-slate-500 uppercase">Data / Descrição</th>
                          <th className="px-6 py-3 font-bold text-xs text-slate-500 uppercase">Tipo</th>
                          <th className="px-6 py-3 font-bold text-xs text-slate-500 uppercase text-right">Valor</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {extratoTransactions.map(t => {
                          const isTransferIn = t.type === 'transfer' && t.destinationBank === extratoModal.bankName;
                          const isTransferOut = t.type === 'transfer' && t.bank === extratoModal.bankName;
                          const displayType = t.type === 'income' || isTransferIn ? 'Entrada' : 'Saída';
                          const amountColor = displayType === 'Entrada' ? 'text-emerald-600' : 'text-rose-600';
                          const sign = displayType === 'Entrada' ? '+' : '-';

                          return (
                            <tr key={t.id} className="hover:bg-slate-50 transition-colors">
                              <td className="px-6 py-3">
                                <span className="font-mono text-xs text-slate-500 mr-3">{formatToDDMMAAAA(t.dueDate)}</span>
                                <span className="font-bold text-slate-800">{t.description}</span>
                                {t.type === 'transfer' && (
                                  <span className="block text-[10px] text-slate-500 font-medium mt-0.5">
                                    {isTransferIn ? `De: ${t.bank}` : `Para: ${t.destinationBank}`}
                                  </span>
                                )}
                              </td>
                              <td className="px-6 py-3">
                                <span className={`px-2 py-0.5 rounded text-[9px] font-black uppercase ${
                                  displayType === 'Entrada' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                                }`}>
                                  {displayType}
                                </span>
                              </td>
                              <td className={`px-6 py-3 text-right font-black text-sm whitespace-nowrap ${amountColor}`}>
                                {sign} R$ {parseFloat(t.amount).toLocaleString('pt-BR', {minimumFractionDigits: 2})}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  )}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
